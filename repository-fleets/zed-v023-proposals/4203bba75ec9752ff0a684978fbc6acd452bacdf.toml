[package]
org = "fiducia-cloud"
name = "fiducia-interfaces"
version = "0.1.0"
description = "Canonical coordination payload schemas, SQL contracts, and generated language interfaces"
license = "MIT"
keywords = ["interfaces", "coordination", "json-schema", "postgres", "polyglot"]

[package.repository]
vcs = "git"
url = "https://github.com/fiducia-cloud/fiducia-interfaces"

[install]
dir = ".vendor/.zed"

[publish]
include_readme = true
tag_format = "v{version}"
smoke_test = "test -f \"$ZED_PKG_TEST_TARGET/schema/index.json\" && test -f \"$ZED_PKG_TEST_TARGET/sql/customer.sql\""
exclude = [".env", ".env.*", ".direnv/**", ".zed/**", ".zed-pack/**", ".vendor/.zed/**", "tmp/**", "**/*.log", ".DS_Store", "**/target/**", "**/node_modules/**", "**/.dart_tool/**", "**/__pycache__/**"]

[targets.repository]
dir = "."

[targets.rust]
dir = "generated/rust"
adapter = "rust"

[targets.rust-wasm]
dir = "generated/rust-wasm"
adapter = "node"
ecosystem = "npm"

[targets.rust-db]
dir = "generated/rust-db"
adapter = "rust"

[targets.typescript]
dir = "generated/typescript"
adapter = "node"

[targets.dart]
dir = "generated/dart"
adapter = "dart"

[targets.python]
dir = "generated/python"
adapter = "python"

[targets.go]
dir = "generated/go"
adapter = "go"

[scripts]
test = "npm test"
