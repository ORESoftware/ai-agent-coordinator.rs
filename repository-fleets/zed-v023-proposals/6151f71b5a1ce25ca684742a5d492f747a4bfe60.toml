[package]
org = "apostille-me"
name = "apostille-me-github-io"
version = "0.1.0"
description = "Astro marketing site for Apostille Me"
license = "MIT"
language = "astro"

[package.repository]
vcs = "git"
url = "https://github.com/apostille-me/apostille-me.github.io"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".env", ".env.*", "node_modules/**", "target/**", "dist/**", "*.log"]

[scripts]
test = "npm test"
