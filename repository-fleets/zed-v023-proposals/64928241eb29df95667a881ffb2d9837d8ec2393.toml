[package]
org = "evento-globolo"
name = "evento-globolo-github-io"
version = "0.1.0"
description = "Astro marketing site for Evento Globolo"
license = "MIT"
language = "astro"

[package.repository]
vcs = "git"
url = "https://github.com/evento-globolo/evento-globolo.github.io"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".env", ".env.*", "node_modules/**", "target/**", "dist/**", "*.log"]

[scripts]
test = "npm test"
