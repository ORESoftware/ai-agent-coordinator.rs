[package]
org = "embedded-alerts"
name = "embedded-alerts-github-io"
version = "0.1.0"
description = "Astro marketing site for Embedded Alerts"
license = "MIT"
language = "astro"

[package.repository]
vcs = "git"
url = "https://github.com/embedded-alerts/embedded-alerts.github.io"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".env", ".env.*", "node_modules/**", "target/**", "dist/**", "*.log"]

[scripts]
test = "npm test"
