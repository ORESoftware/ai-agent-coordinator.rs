[package]
org = "akrion-sim"
name = "akrion-sim-interfaces"
version = "0.1.0"
description = "Canonical Akrion simulation schemas and generated cross-language adapters"
license = "MIT"
keywords = ["interfaces", "json-schema", "soccer", "simulation", "polyglot"]

[package.repository]
vcs = "git"
url = "https://github.com/akrion-sim/akrion-sim-interfaces"

[publish]
include_readme = true
tag_format = "v{version}"
smoke_test = "test -f \"$ZED_PKG_TEST_TARGET/schema/index.json\" && test -f \"$ZED_PKG_TEST_TARGET/generated/rust/Cargo.toml\""
exclude = [".env", ".env.*", ".direnv/**", ".zed/**", ".zed-pack/**", "tmp/**", "**/*.log", ".DS_Store", "**/target/**", "**/node_modules/**"]

[targets.repository]
dir = "."

[targets.typescript]
dir = "generated/typescript"

[targets.rust]
dir = "generated/rust"
adapter = "rust"

[targets.python]
dir = "generated/python"
adapter = "python"

[targets.golang]
dir = "generated/go"
adapter = "go"

[scripts]
test = "node src/generate.mjs --check && node --test src/*.test.mjs"
