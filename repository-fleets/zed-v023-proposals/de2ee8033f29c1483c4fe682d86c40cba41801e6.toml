[package]
org = "embedded-alerts"
name = "eal-clients"
version = "0.1.0"
description = "Polyglot SDK clients for Embedded Alerts"
license = "MIT"
keywords = ["clients", "sdk", "polyglot", "openapi"]

[package.repository]
vcs = "git"
url = "https://github.com/embedded-alerts/eal-clients"

[install]
dir = ".vendor/.zed"

[dependencies]
"embedded-alerts/eal-interfaces" = "^0.1.0"
"embedded-alerts/eal-libs" = "^0.1.0"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".env", ".env.*", "node_modules/**", "target/**", "dist/**", "build/**", ".build/**", "*.log", ".vendor/.zed/**"]

[scripts]
test = "bash scripts/test.sh && bash scripts/validate-client-layout.sh && node scripts/verify-client-matrix.mjs"

[targets.repository]
dir = "."

[targets.c]
dir = "clients/c"
adapter = "none"

[targets.cpp]
dir = "clients/cpp"
adapter = "none"

[targets.zig]
dir = "clients/zig"
adapter = "none"

# TypeScript is the Node.js Zed target. Deno, Bun, and edge remain explicit
# runtime entry points inside this package rather than unsupported Zed targets.
[targets.nodejs]
dir = "clients/typescript"
name = "eal-clients-typescript"
adapter = "node"

[targets.golang]
dir = "clients/golang"
adapter = "go"

[targets.python]
dir = "clients/python"
adapter = "python"

[targets.ruby]
dir = "clients/ruby"
adapter = "none"

[targets.php]
dir = "clients/php"
adapter = "none"

[targets.rust]
dir = "clients/rust"
adapter = "rust"

[targets.rust-wasm]
dir = "clients/wasm"
adapter = "node"

[targets.dart]
dir = "clients/dart"
adapter = "dart"

[targets.gleam]
dir = "clients/gleam"

[targets.erlang]
dir = "clients/erlang"
adapter = "none"

[targets.elixir]
dir = "clients/elixir"
adapter = "none"

[targets.java]
dir = "clients/java"
adapter = "java"

[targets.kotlin]
dir = "clients/kotlin"
adapter = "none"

[targets.swift]
dir = "clients/swift"
adapter = "none"

[targets.gleamlang]
dir = "clients/gleamlang"
adapter = "none"

[targets.python3]
dir = "clients/python3"
adapter = "none"

[targets.typescript-nodejs]
dir = "clients/typescript/nodejs"
adapter = "node"

[targets.typescript-deno]
dir = "clients/typescript/deno"
adapter = "none"

[targets.typescript-bun]
dir = "clients/typescript/bun"
adapter = "node"

[targets.typescript-edge]
dir = "clients/typescript/edge"
adapter = "none"
