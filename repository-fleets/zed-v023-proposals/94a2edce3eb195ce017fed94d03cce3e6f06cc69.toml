[package]
org = "memebank"
name = "mbk-cli"
version = "0.1.0"
description = "Command-line client for MemeBank — search the image bank, inspect your account, and probe the API"
license = "MIT"
keywords = ["cli", "images", "search", "rust", "global-tool"]
language = "rust"

[package.repository]
vcs = "git"
url = "https://github.com/memebank/mbk-cli"

# No org dependencies yet — deliberately, not by omission.
#
# DEN-2743 has not selected between the populated mb-* family and the proposed
# mbk-* family. Until that decision is made, `src/wire.rs` and
# `src/transport.rs` isolate the legacy API boundary and this table remains
# empty rather than claiming dependencies that do not resolve.
#
# scripts/check-zed-dependencies.py enforces both the dependency graph and the
# runtime packaging contract.
[dependencies]

[build]
command = "cargo build --release --locked --bin mbk"
# The executable parses this audited contract at runtime. Publishing only the
# binary would make a globally installed CLI fail before it could render help.
outputs = ["target/release/mbk", ".cli-flags.toml"]

[bin]
mbk = "target/release/mbk"

[install]
adapter = "none"
dir = ".vendor/.zed"

[publish]
include_readme = true
tag_format = "v{version}"
smoke_test = "test -x \"$ZED_PKG_TEST_TARGET/target/release/mbk\" && test -f \"$ZED_PKG_TEST_TARGET/.cli-flags.toml\" && \"$ZED_PKG_TEST_TARGET/target/release/mbk\" --help >/dev/null"
exclude = [".env", ".env.*", ".direnv/**", ".zed/**", ".zed-pack/**", ".vendor/.zed/**", "target/**", "tmp/**", "**/*.log", ".DS_Store"]

[scripts]
test = "cargo test --all-targets --locked && cargo clippy --all-targets --locked -- -D warnings && python3 scripts/check-zed-dependencies.py"
