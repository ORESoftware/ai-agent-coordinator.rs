[package]
org = "threefa"
name = "threefa-cli"
version = "0.1.0"
description = "Command-line client for 3FA — device management and zero-knowledge vault sync inspection"
license = "MIT"
keywords = ["cli", "totp", "authenticator", "zero-knowledge", "rust", "global-tool"]
language = "rust"

[package.repository]
vcs = "git"
url = "https://github.com/3FA-app/3FA-app-cli"

# Org dependency graph: interfaces (wire contract) -> clients (transport) ->
# this CLI. The org segment is the GitHub org that owns each repo. 3FA-app has
# no `3fa-lib`; when one lands, it belongs between these two.
# scripts/check-zed-dependencies.py fails CI if this list and Cargo.toml
# disagree.
[dependencies]
"threefa/threefa-interfaces" = "^0.1.0"
"threefa/threefa-clients" = "^0.1.0"

[build]
command = "cargo build --release --locked --bin 3fa"
outputs = ["target/release/3fa"]

[bin]
"3fa" = "target/release/3fa"

[install]
adapter = "none"
dir = ".vendor/.zed"

[publish]
include_readme = true
tag_format = "v{version}"
smoke_test = "test -x \"$ZED_PKG_TEST_TARGET/target/release/3fa\" && \"$ZED_PKG_TEST_TARGET/target/release/3fa\" --help >/dev/null"
exclude = [".env", ".env.*", ".direnv/**", ".zed/**", ".zed-pack/**", ".vendor/.zed/**", "target/**", "tmp/**", "**/*.log", ".DS_Store"]

[scripts]
test = "cargo test --all-targets --locked && cargo clippy --all-targets --locked -- -D warnings && python3 scripts/check-zed-dependencies.py"
