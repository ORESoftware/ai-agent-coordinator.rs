[package]
org = "embedded-alerts"
name = "eal-monorepo"
version = "0.1.0"
description = "High-context development monorepo for Embedded Alerts"
license = "MIT"
language = "rust"

[package.repository]
vcs = "git"
url = "https://github.com/embedded-alerts/eal-monorepo"

[install]
dir = ".vendor/.zed"

[dependencies]
"embedded-alerts/eal-clients" = "^0.1.0"
"embedded-alerts/eal-interfaces" = "^0.1.0"
"embedded-alerts/eal-libs" = "^0.1.0"
"embedded-alerts/eal-sync" = "^0.1.0"
"shared-auth/shared-auth-clients" = "^0.1.0"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".env", ".env.*", "node_modules/**", "target/**", "dist/**", "*.log", ".vendor/.zed/**"]

[scripts]
test = "bash scripts/test.sh && bash scripts/validate-zed-submodules.sh && bash scripts/zed-install-with-submodules.sh"
