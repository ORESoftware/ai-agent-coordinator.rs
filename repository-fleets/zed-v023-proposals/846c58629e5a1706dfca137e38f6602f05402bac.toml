[package]
org = "daedalus-fab"
name = "daedalus-clients"
version = "0.1.0"
description = "Official polyglot clients for Daedalus fabrication APIs"
license = "MIT"
keywords = ["clients", "sdk", "polyglot", "daedalus"]

[package.repository]
vcs = "git"
url = "https://github.com/daedalus-fab/daedalus-clients"

[install]
dir = ".vendor/.zed"

[dependencies]
"daedalus-fab/daedalus-interfaces" = "^0.1.0"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".env", ".env.*", ".direnv/**", ".zed-pack/**", ".vendor/.zed/**", "tmp/**", "**/*.log", ".DS_Store"]

[targets.repository]
dir = "."

[targets.c]
dir = "clients/c"
adapter = "none"

[targets.cpp]
dir = "clients/cpp"
adapter = "none"

[targets.zig]
dir = "clients/zig"
adapter = "none"

[targets.nodejs]
dir = "clients/typescript"
name = "daedalus-clients-nodejs"
adapter = "node"

[targets.nodejs.native]
registry = "npm"
package = "@daedalus-fab/client"
forge = ["github-packages", "gitlab-packages", "bitbucket-packages"]

[targets.python]
dir = "clients/python"
adapter = "python"

[targets.python.native]
registry = "pypi"
package = "daedalus-fab-client"
forge = ["gitlab-packages"]

[targets.golang]
dir = "clients/go"
name = "daedalus-clients-golang"
adapter = "go"

[targets.golang.native]
registry = "go-modules"
package = "github.com/daedalus-fab/daedalus-clients/clients/go"
tag_format = "clients/go/v{version}"
forge = ["gitlab-packages"]

[targets.ruby]
dir = "clients/ruby"
adapter = "none"

[targets.php]
dir = "clients/php"
adapter = "none"

[targets.rust]
dir = "clients/rust"
adapter = "rust"

[targets.rust-wasm]
dir = "clients/wasm"
name = "daedalus-clients-wasm"
adapter = "node"

[targets.dart]
dir = "clients/dart"
adapter = "dart"

[targets.gleam]
dir = "clients/gleam"

[targets.erlang]
dir = "clients/erlang"
adapter = "none"

[targets.elixir]
dir = "clients/elixir"
adapter = "none"

[targets.java]
dir = "clients/java"
adapter = "java"

[targets.java.native]
registry = "maven-central"
package = "fab.daedalus:daedalus-client"
forge = ["github-packages", "gitlab-packages", "bitbucket-packages"]

[targets.kotlin]
dir = "clients/kotlin"
adapter = "none"

[targets.swift]
dir = "clients/swift"
adapter = "none"
