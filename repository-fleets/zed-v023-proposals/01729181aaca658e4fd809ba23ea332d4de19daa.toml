[package]
org = "sonus-auris"
name = "sonus-auris-cli"
version = "0.1.0"
description = "Command-line client for Sonus Auris — evaluates product rules and verifies conformance"
license = "MIT"
keywords = ["cli", "sonus-auris", "audio", "rust", "global-tool"]
language = "rust"

[package.repository]
vcs = "git"
url = "https://github.com/sonus-auris/sonus-auris-cli"

# The full dependency graph. `sonus-auris-clients` is declared because the CLI
# is its downstream application; the Cargo edge is added when the transport
# commands land (see sonus-auris-lib#1).
[dependencies]
"sonus-auris/sonus-auris-interfaces" = "^0.1.0"
"sonus-auris/sonus-auris-lib" = "^0.1.0"
"sonus-auris/sonus-auris-clients" = "^0.1.0"

[build]
command = "cargo build --release --locked"
outputs = ["target/release/sonus-auris"]

[bin]
sonus-auris = "target/release/sonus-auris"

[publish]
include_readme = true
tag_format = "v{version}"
smoke_test = "test -x \"$ZED_PKG_TEST_TARGET/target/release/sonus-auris\" && \"$ZED_PKG_TEST_TARGET/target/release/sonus-auris\" --help >/dev/null"
exclude = [".env", ".env.*", ".direnv/**", ".zed/**", ".zed-pack/**", ".vendor/.zed/**", "target/**", "tmp/**", "**/*.log", ".DS_Store"]

[publish.native]
registry = "crates-io"
package = "sonus-auris-cli"

[install]
adapter = "none"
dir = ".vendor/.zed"

[scripts]
test = "cargo test --all-targets --locked && cargo clippy --all-targets --locked -- -D warnings && cargo fmt --all -- --check && cargo run --quiet -- conformance --quiet"
