[package]
org = "canonical-cloud"
name = "canonical-clients"
version = "0.1.0"
description = "Canonical compliance audit protocol clients"
license = "MIT"
keywords = ["compliance", "audit", "clients", "sdk", "polyglot"]

[package.repository]
vcs = "git"
url = "https://github.com/canonical-cloud/canonical-clients"

[install]
dir = ".vendor/.zed"

[dependencies]
"canonical-cloud/canonical-interfaces" = "^0.1.0"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".env", ".env.*", ".direnv/**", ".zed-pack/**", ".vendor/.zed/**", "tmp/**", "**/*.log", ".DS_Store", "**/target/**", "**/node_modules/**", "**/dist/**"]

[targets.repository]
dir = "."

[targets.c]
dir = "clients/c"
adapter = "none"

[targets.cpp]
dir = "clients/cpp"
adapter = "none"

[targets.zig]
dir = "clients/zig"
adapter = "none"

# One TypeScript package owns Node.js, Deno, Bun, and edge exports so Zed
# re-rooting preserves the shared implementation and generated model surface.
[targets.nodejs]
dir = "clients/typescript"
name = "canonical-clients-nodejs"
adapter = "node"

[targets.nodejs.native]
registry = "npm"
package = "@canonical-cloud/clients"
forge = ["github-packages", "gitlab-packages", "bitbucket-packages"]

[targets.golang]
dir = "clients/go"
name = "canonical-clients-golang"
adapter = "go"

[targets.golang.native]
registry = "go-modules"
package = "github.com/canonical-cloud/canonical-clients/clients/go"
tag_format = "clients/go/v{version}"
forge = ["gitlab-packages"]

[targets.python]
dir = "clients/python"
adapter = "python"

[targets.ruby]
dir = "clients/ruby"
adapter = "none"

[targets.php]
dir = "clients/php"
adapter = "none"

[targets.rust]
dir = "clients/rust"
adapter = "rust"

[targets.rust.native]
registry = "crates-io"
package = "canonical-clients"

[targets.rust-wasm]
dir = "clients/wasm"
name = "canonical-clients-wasm"
adapter = "node"

[targets.dart]
dir = "clients/dart"
adapter = "dart"

[targets.dart.native]
registry = "pub.dev"
package = "canonical_clients"

[targets.gleam]
dir = "clients/gleam"
adapter = "none"

[targets.erlang]
dir = "clients/erlang"
adapter = "none"

[targets.elixir]
dir = "clients/elixir"
adapter = "none"

[targets.java]
dir = "clients/java"
adapter = "java"

[targets.java.native]
registry = "maven-central"
package = "cloud.canonical:canonical-clients"
forge = ["github-packages", "gitlab-packages", "bitbucket-packages"]

[targets.kotlin]
dir = "clients/kotlin"
adapter = "java"

[targets.swift]
dir = "clients/swift"
