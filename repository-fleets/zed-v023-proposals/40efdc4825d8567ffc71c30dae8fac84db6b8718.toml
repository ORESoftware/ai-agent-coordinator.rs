[package]
org = "zed-pkg"
name = "zed-lib-core"
version = "0.1.0"
description = "Canonical zed-pkg core: SeaORM registry entities, migrations, and the role-aware query boundary, plus the polyglot resolution slices"
license = "MIT"
keywords = ["package-manager", "resolution", "registry", "seaorm", "polyglot"]

[package.repository]
vcs = "git"
url = "https://github.com/zed-pkg/zed-lib-core"

[dependencies]
"zed-pkg/zed-interfaces" = "^0.1.0"
"oresoftware/k8s-libs-and-shared-defs" = "^0.1.0"

[publish]
include_readme = true
tag_format = "v{version}"
smoke_test = "test -f \"$ZED_PKG_TEST_TARGET/conformance/cases/version-resolution.json\""
exclude = [
  ".env",
  ".env.*",
  ".direnv/**",
  ".vendor/.zed/**",
  ".zed/**",
  ".zed-pack/**",
  "target/**",
  "**/target/**",
  "**/node_modules/**",
  "**/.dart_tool/**",
  "tmp/**",
  "**/*.log",
  ".DS_Store",
]

[install]
dir = ".vendor/.zed"

# Whole-repository slice: every implementation plus the shared corpus they are
# all verified against.
# Publishes under the canonical package name; the model rejects a divergent
# `name` on the whole-repository slice (DEN-2960).
[targets.repository]
dir = "."

[targets.rust]
dir = "src/rust"
adapter = "rust"

[targets.rust.native]
registry = "crates-io"
package = "zed-lib"

# Canonical SeaORM data plane: opaque role-aware contexts, the registry
# entities, and the migration runner. Merged from the former zed-orm-core repo.
# Writes are feature-gated (`read-write`) and migrations doubly so (`migrate`);
# see src/rust-orm/lib.rs and SERVICE_AND_DATA_ARCHITECTURE.md.
[targets.rust-orm]
dir = "src/rust-orm"
name = "zed-orm-core"
adapter = "rust"

# The corpus is consumable on its own: an implementation in a language zed-lib
# does not ship yet still has something to be correct against.
[targets.conformance]
dir = "conformance"
name = "zed-lib-conformance"
adapter = "none"

# Front-end implementations of the same behavior. Not thin bindings — each is a
# native implementation held to `conformance/cases/*.json`, so a browser or
# Flutter client resolves a requirement exactly the way zed-cli does.
[targets.dart]
dir = "src/dart"
adapter = "dart"

[targets.dart.native]
registry = "pub.dev"
package = "zed_lib"
tag_format = "dart/v{version}"

[targets.typescript]
dir = "src/ts"
name = "zed-lib-typescript"
adapter = "node"

[targets.typescript.native]
registry = "npm"
package = "@zed-pkg/zed-lib"
tag_format = "ts/v{version}"

[scripts]
test = "cargo test --all-targets --locked && cargo clippy --all-targets --locked -- -D warnings && cargo fmt --all -- --check && cargo test --locked --test conformance"
