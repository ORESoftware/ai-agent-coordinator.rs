[package]
org = "canonical-cloud"
name = "canonical-infra"
version = "0.1.1"
description = "Cloudflare Worker, DNS reconciliation, and activation policy for Canonical services"
license = "MIT"
keywords = ["infrastructure", "cloudflare", "workers", "dns", "canonical-cloud"]
language = "yaml"

[package.repository]
vcs = "git"
url = "https://github.com/canonical-cloud/canonical-infra"

[dependencies]
"canonical-cloud/canonical-interfaces" = "^0.1.0"

[targets.repository]
dir = "."

[scripts]
test = "npm run check"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".env", ".env.*", ".vendor/.zed/**", ".zed/**", ".zed-pack/**", "tmp/**", "node_modules/**", "**/*.log", "**/*.tfstate", "**/*.tfstate.*"]

[install]
adapter = "none"
dir = ".vendor/.zed"
