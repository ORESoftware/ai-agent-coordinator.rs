[package]
org = "sonus-auris"
name = "sonus-auris-clients"
version = "0.1.0"
description = "Official polyglot clients for Sonus Auris"
license = "MIT"
keywords = ["clients", "sdk", "polyglot", "sonus-auris", "audio"]

[package.repository]
vcs = "git"
url = "https://github.com/sonus-auris/sonus-auris-clients"

[install]
dir = ".vendor/.zed"

[dependencies]
"sonus-auris/sonus-auris-interfaces" = "^0.1.0"
"sonus-auris/sonus-auris-lib" = "^0.1.0"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".env", ".env.*", ".direnv/**", ".zed-pack/**", ".vendor/.zed/**", "tmp/**", "**/*.log", ".DS_Store", "**/target/**", "**/node_modules/**"]

[targets.repository]
dir = "."

[targets.c]
dir = "clients/c"
adapter = "none"

[targets.cpp]
dir = "clients/cpp"
adapter = "none"

[targets.zig]
dir = "clients/zig"
adapter = "none"

# Node.js, Deno, Bun, and edge entrypoints share one TypeScript source root.
[targets.nodejs]
dir = "clients/typescript"
name = "sonus-auris-clients-nodejs"
adapter = "node"

[targets.nodejs.native]
registry = "npm"
package = "@sonus-auris/client"
forge = ["github-packages", "gitlab-packages", "bitbucket-packages"]

[targets.golang]
dir = "clients/go"
name = "sonus-auris-clients-golang"
adapter = "go"

[targets.golang.native]
registry = "go-modules"
package = "github.com/sonus-auris/sonus-auris-clients/clients/go"
tag_format = "clients/go/v{version}"
forge = ["gitlab-packages"]

[targets.python]
dir = "clients/python"
adapter = "python"

[targets.ruby]
dir = "clients/ruby"
adapter = "none"

[targets.php]
dir = "clients/php"
adapter = "none"

[targets.rust]
dir = "clients/rust"
adapter = "rust"

[targets.rust.native]
registry = "crates-io"
package = "sonus-auris-client"

[targets.rust-wasm]
dir = "clients/wasm"
name = "sonus-auris-clients-wasm"
adapter = "node"

[targets.dart]
dir = "clients/dart"
adapter = "dart"

[targets.dart.native]
registry = "pub.dev"
package = "sonus_auris_client"

[targets.gleam]
dir = "clients/gleam"

[targets.erlang]
dir = "clients/erlang"

[targets.elixir]
dir = "clients/elixir"
adapter = "none"

[targets.java]
dir = "clients/java"
adapter = "java"

[targets.java.native]
registry = "maven-central"
package = "app.sonusauris:sonus-auris-client"
forge = ["github-packages", "gitlab-packages", "bitbucket-packages"]

[targets.kotlin]
dir = "clients/kotlin"
adapter = "java"

[targets.swift]
dir = "clients/swift"
