[package]
org = "quaestor-ledger"
name = "quaestor-ledger-mcp-server"
version = "0.1.0"
description = "Private global read-only MCP diagnostics for Quaestor Ledger"
license = "UNLICENSED"
keywords = ["mcp", "ledger", "diagnostics", "agents", "global-tool"]
language = "rust"

[package.repository]
vcs = "git"
url = "https://github.com/quaestor-ledger/quaestor-ledger-mcp-server.rs"

[build]
command = "cargo build --release --locked --bin quaestor-mcp"
outputs = ["target/release/quaestor-mcp"]

[bin]
quaestor-mcp = "target/release/quaestor-mcp"

[publish]
include_readme = true
tag_format = "v{version}"
smoke_test = "cargo test --manifest-path \"$ZED_PKG_TEST_TARGET/Cargo.toml\" --all-targets --locked && test -x \"$ZED_PKG_TEST_TARGET/target/release/quaestor-mcp\""
exclude = [".env", ".env.*", ".direnv/**", ".zed/**", ".zed-pack/**", "target/**", "tmp/**", "**/*.log", ".DS_Store"]

[install]
adapter = "none"

[scripts]
test = "cargo test --all-targets --locked"
