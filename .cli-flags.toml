[help]
url = "https://github.com/ORESoftware/ai-agent-coordinator.rs"
columns = ["options", "env", "type", "description"]

[parse]
require_equals = true
stop_at_first_positional = false
unknown_options_env = "FLAGS2ENV_UNKNOWN_OPTIONS"
errors_env = "FLAGS2ENV_PARSE_ERRORS"
allow_unknown = false

[env]
# Credentials are intentionally environment-only. They must never be accepted
# as command-line values because process arguments are commonly observable.
ignore = [
  "COORDINATOR_API_TOKEN",
  "GITHUB_WEBHOOK_SECRET",
  "GITHUB_REPOSITORY_ADMIN_TOKEN",
  "MISTRAL_API_KEY",
  "OPENROUTER_API_KEY",
  "OPENAI_API_KEY",
]

[flags.config]
env = "COORDINATOR_CONFIG"
aliases = ["config", "config-path"]
short = "c"
type = "string"
help = "Path to the coordinator YAML configuration file."

[flags.json-logs]
env = "COORDINATOR_JSON_LOGS"
aliases = ["json-logs"]
type = "boolean"
help = "Emit structured JSON logs."

[flags.repository-admin-enabled]
env = "GITHUB_REPOSITORY_ADMIN_ENABLED"
aliases = ["repository-admin-enabled"]
type = "boolean"
help = "Enable the fail-closed GitHub repository administration adapter."

[flags.repository-admin-allowed-orgs]
env = "GITHUB_REPOSITORY_ADMIN_ALLOWED_ORGS"
aliases = ["repository-admin-allowed-orgs"]
type = "string"
help = "Comma-separated exact organization allowlist for repository administration."

[flags.github-api-base-url]
env = "GITHUB_API_BASE_URL"
aliases = ["github-api-base-url"]
type = "string"
help = "HTTPS base URL for the GitHub API."

[flags.github-api-version]
env = "GITHUB_API_VERSION"
aliases = ["github-api-version"]
type = "string"
help = "GitHub REST API version header value."

[flags.github-api-user-agent]
env = "GITHUB_API_USER_AGENT"
aliases = ["github-api-user-agent"]
type = "string"
help = "User-Agent sent by the GitHub administration adapter."

[flags.rust-log]
env = "RUST_LOG"
aliases = ["rust-log", "log-filter"]
type = "string"
help = "Tracing filter used by the coordinator process."
