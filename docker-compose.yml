services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_agent_coordinator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_agent_coordinator"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ${AI_AGENT_COORDINATOR_SCHEMA_PATH:-../k8s-libs-and-shared-defs/pg-defs/schema/databases/ai_agent_coordinator/schema.sql}:/docker-entrypoint-initdb.d/001-ai-agent-coordinator.sql:ro

  coordinator:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      AI_AGENT_COORDINATOR_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/ai_agent_coordinator
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./coordinator.yaml:/app/coordinator.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  postgres-data:
