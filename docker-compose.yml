services:
  coordinator:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./coordinator.yaml:/app/coordinator.yaml:ro
      - coordinator-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  coordinator-data:
