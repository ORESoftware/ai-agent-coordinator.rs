name: Probe Meta Agents and File Tunnel repository administration

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/probe-meta-file-repository-admin.yml'

permissions:
  contents: read

jobs:
  probe:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check protected credential availability without exposing values
        shell: bash
        env:
          META_TOKEN: ${{ secrets.META_AGENTS_DEMO_REPOSITORY_ADMIN_TOKEN || secrets.REMOTE_DEV_GH_PAT || secrets.ORG_GITOPS_TOKEN || secrets.GITHUB_REPOSITORY_ADMIN_TOKEN }}
          FILE_TUNNEL_TOKEN: ${{ secrets.FILE_TUNNEL_REPOSITORY_ADMIN_TOKEN || secrets.REMOTE_DEV_GH_PAT || secrets.ORG_GITOPS_TOKEN || secrets.GITHUB_REPOSITORY_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          status=0
          if [[ -z "${META_TOKEN:-}" ]]; then
            echo '::error::No Meta Agents repository-administration credential is configured.'
            status=1
          else
            printf '::add-mask::%s\n' "$META_TOKEN"
            GH_TOKEN="$META_TOKEN" gh api /user --jq '.login' >/dev/null
            GH_TOKEN="$META_TOKEN" gh api /user/memberships/orgs/meta-agents-demo --jq 'select(.role == "admin" and .state == "active") | .organization.login' | grep -Fx meta-agents-demo
          fi
          if [[ -z "${FILE_TUNNEL_TOKEN:-}" ]]; then
            echo '::error::No File Tunnel repository-administration credential is configured.'
            status=1
          else
            printf '::add-mask::%s\n' "$FILE_TUNNEL_TOKEN"
            GH_TOKEN="$FILE_TUNNEL_TOKEN" gh api /user --jq '.login' >/dev/null
            GH_TOKEN="$FILE_TUNNEL_TOKEN" gh api /user/memberships/orgs/file-tunnel --jq 'select(.role == "admin" and .state == "active") | .organization.login' | grep -Fx file-tunnel
          fi
          exit "$status"
