name: Temporary DEN-3401 Clippy reconciliation

on:
  push:
    branches:
      - agent/den-3401-agent-pontifex-export-rustfmt-20260809
    paths:
      - .github/workflows/tmp-den-3401-clippy-reconcile.yml
      - scripts/tmp-den-3401-clippy-reconcile.py

permissions:
  contents: write

concurrency:
  group: temporary-den-3401-clippy-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact trigger commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify branch has not advanced
        shell: bash
        env:
          BRANCH_NAME: agent/den-3401-agent-pontifex-export-rustfmt-20260809
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH_NAME"
          test "$(git rev-parse "origin/$BRANCH_NAME")" = "$GITHUB_SHA"

      - name: Apply exact semantics-preserving patch
        run: python3 scripts/tmp-den-3401-clippy-reconcile.py

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.97.0'
          components: rustfmt, clippy

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: false

      - name: Verify formatting
        run: cargo fmt --all --check

      - name: Verify Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Verify tests
        run: cargo test --locked --all-features

      - name: Remove temporary machinery and verify scope
        run: |
          set -euo pipefail
          rm scripts/tmp-den-3401-clippy-reconcile.py
          rm .github/workflows/tmp-den-3401-clippy-reconcile.yml
          git diff --check
          git status --short

      - name: Commit reviewed reconciliation
        shell: bash
        env:
          BRANCH_NAME: agent/den-3401-agent-pontifex-export-rustfmt-20260809
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH_NAME"
          test "$(git rev-parse "origin/$BRANCH_NAME")" = "$GITHUB_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            .github/workflows/tmp-den-3401-clippy-reconcile.yml \
            scripts/tmp-den-3401-clippy-reconcile.py \
            src/daily_portfolio_delivery_store.rs
          git commit -m "fix(DEN-3401): preserve baseline ordering under Clippy"
          git push origin "HEAD:$BRANCH_NAME"
