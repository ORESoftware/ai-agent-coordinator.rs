name: Temporary reconcile Shared Auth package locks

on:
  push:
    branches:
      - agent/reconcile-shared-auth-package-locks

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/reconcile-shared-auth-package-locks
          fetch-depth: 1
      - name: Apply reviewed package-lock reconciliation patch
        run: python3 scripts/patch_shared_auth_lock_reconciliation.py
      - name: Commit exact publisher patch and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/publish_shared_auth_client_artifacts.sh
          git add -u scripts/patch_shared_auth_lock_reconciliation.py
          git add -u .github/workflows/patch-shared-auth-lock-reconciliation.yml
          git commit -m 'fix: reconcile generated package locks before publication'
          git push origin HEAD:agent/reconcile-shared-auth-package-locks
