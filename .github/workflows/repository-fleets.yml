name: Repository fleet manifests

on:
  pull_request:
    paths:
      - repository-fleets/**
      - scripts/render_repository_fleet.py
      - scripts/test_render_repository_fleet.py
      - scripts/reconstruct_hypesiege_streempilot_fleet.py
      - scripts/publish_hypesiege_streempilot_fleet.py
      - scripts/test_publish_hypesiege_streempilot_fleet.py
      - docs/memebank-repository-bootstrap.md
      - docs/hypesiege-streempilot-repository-publication.md
      - .github/workflows/repository-fleets.yml
  push:
    branches: [main]
    paths:
      - repository-fleets/**
      - scripts/render_repository_fleet.py
      - scripts/test_render_repository_fleet.py
      - scripts/reconstruct_hypesiege_streempilot_fleet.py
      - scripts/publish_hypesiege_streempilot_fleet.py
      - scripts/test_publish_hypesiege_streempilot_fleet.py
      - docs/memebank-repository-bootstrap.md
      - docs/hypesiege-streempilot-repository-publication.md
      - .github/workflows/repository-fleets.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  memebank:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Compile repository-fleet tools
        run: |
          python -m py_compile \
            scripts/render_repository_fleet.py \
            scripts/test_render_repository_fleet.py
      - name: Run repository-fleet tests
        run: python -m unittest -v scripts/test_render_repository_fleet.py
      - name: Prove the checked-in MemeBank fleet remains fail-closed
        shell: bash
        run: |
          set -euo pipefail
          python scripts/render_repository_fleet.py \
            --manifest repository-fleets/memebank.json \
            --mode plan > memebank-plan.json
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("repository-fleets/memebank.json").read_text(encoding="utf-8")
          )
          plan = json.loads(Path("memebank-plan.json").read_text(encoding="utf-8"))
          assert plan["organization"] == "memebank"
          assert plan["tracking_issue"] == "DEN-1043"
          assert plan["ready_for_dry_run"] is False
          assert plan["ready_for_live"] is False
          assert len(plan["blockers"]) == 12
          assert ".github" in manifest["deferred_repositories"]
          assert all(
              repository["full_name"] != "memebank/.github"
              for repository in plan["repositories"]
          )
          assert plan["repositories"][0]["full_name"] == "memebank/mb-interfaces"
          assert plan["repositories"][-1]["full_name"] == "memebank/memebank-monorepo"
          PY

  hypesiege-streempilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Compile deterministic fleet tools
        run: |
          python -m py_compile \
            scripts/reconstruct_hypesiege_streempilot_fleet.py \
            scripts/publish_hypesiege_streempilot_fleet.py \
            scripts/test_publish_hypesiege_streempilot_fleet.py
      - name: Reconstruct, compare, and preflight the sealed fleet
        run: |
          python -m unittest -v \
            scripts/test_publish_hypesiege_streempilot_fleet.py
      - name: Render representative network-free plans
        shell: bash
        run: |
          set -euo pipefail
          python scripts/publish_hypesiege_streempilot_fleet.py \
            --repository hypesiege/hypesiege-api-server.rs \
            > hypesiege-plan.json
          python scripts/publish_hypesiege_streempilot_fleet.py \
            --repository streempilot/streempilot-monorepo \
            > streempilot-plan.json
          python - <<'PY'
          import json
          from pathlib import Path

          hypesiege = json.loads(Path("hypesiege-plan.json").read_text())
          streempilot = json.loads(Path("streempilot-plan.json").read_text())
          assert hypesiege == {
              "mode": "plan",
              "repository": "hypesiege/hypesiege-api-server.rs",
              "commit": "8b1b00ecc3ef421d03db9f9231a703bfbec6df9f",
              "visibility": "public",
              "remote": "https://github.com/hypesiege/hypesiege-api-server.rs.git",
              "files": 25,
              "gitlinks": 0,
          }
          assert streempilot == {
              "mode": "plan",
              "repository": "streempilot/streempilot-monorepo",
              "commit": "0e83a0dfa1c2f5c4a20c50c8b6f7d1453a24cc07",
              "visibility": "public",
              "remote": "https://github.com/streempilot/streempilot-monorepo.git",
              "files": 43,
              "gitlinks": 16,
          }
          PY
      - name: Reject conflict markers and live credential wiring
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' \
            repository-fleets/hypesiege-streempilot* \
            scripts/reconstruct_hypesiege_streempilot_fleet.py \
            scripts/publish_hypesiege_streempilot_fleet.py \
            scripts/test_publish_hypesiege_streempilot_fleet.py; then
            echo 'conflict markers found' >&2
            exit 1
          fi
          if grep -RInE 'HYPESIEGE_REPOSITORY_ADMIN_TOKEN|STREEMPILOT_REPOSITORY_ADMIN_TOKEN' \
            .github/workflows/repository-fleets.yml \
            scripts/reconstruct_hypesiege_streempilot_fleet.py \
            scripts/test_publish_hypesiege_streempilot_fleet.py; then
            echo 'live organization credentials must not be wired into validation CI' >&2
            exit 1
          fi

# BEGIN DEN877 FLEET SEAL RECONCILIATION
  reconcile-fleet-seal:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/den-877-fleet-merge-repair'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Reconcile the reviewed generator identity and publication boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import gzip
          import hashlib
          from pathlib import Path

          old_digest = "50629a57beca1ac85928cfae8fbebbca4f62a6455a7013016f92b1203dcbbd1f"
          reviewed_digest = "a57b00961ee57ae09bf3bb2e2d09afbdd1ddbbbde832b027802f82a1fc5dfa84"
          payload_dir = Path("repository-fleets/hypesiege-streempilot")
          parts = [payload_dir / f"generator.py.gz.b64.part-{index:02d}" for index in range(6)]
          if not all(path.is_file() for path in parts):
              raise SystemExit("reviewed six-part generator payload is incomplete")
          encoded = "".join(path.read_text(encoding="utf-8").strip() for path in parts)
          source = gzip.decompress(base64.b64decode(encoded, validate=True))
          actual_digest = hashlib.sha256(source).hexdigest()
          if actual_digest != reviewed_digest:
              raise SystemExit(
                  f"reviewed generator identity changed: {actual_digest} != {reviewed_digest}"
              )

          checksum_paths = [
              Path("scripts/reconstruct_hypesiege_streempilot_fleet.py"),
              Path("scripts/publish_hypesiege_streempilot_fleet.py"),
              Path("repository-fleets/hypesiege-streempilot.json"),
              Path("docs/hypesiege-streempilot-repository-publication.md"),
          ]
          for path in checksum_paths:
              text = path.read_text(encoding="utf-8")
              if old_digest not in text and reviewed_digest not in text:
                  raise SystemExit(f"generator identity is absent from {path}")
              path.write_text(text.replace(old_digest, reviewed_digest), encoding="utf-8")

          reconstructor_path = Path("scripts/reconstruct_hypesiege_streempilot_fleet.py")
          reconstructor = reconstructor_path.read_text(encoding="utf-8")
          old_relocation = '''    expected_literal = "ROOT = Path('/mnt/data/hypesiege-streempilot-fleet')"
              replacement = f"ROOT = Path({str(output_root)!r})"
              if source.count(expected_literal) != 1:
                  raise ReconstructionError("generator output-root contract changed")
              source = source.replace(expected_literal, replacement)
          '''
          new_relocation = '''    expected_literal = "ROOT = Path('/mnt/data/hypesiege-streempilot-fleet')"
              replacement = f"ROOT = Path({str(output_root)!r})"
              if source.count(expected_literal) != 1:
                  raise ReconstructionError("generator output-root contract changed")
              source = source.replace(expected_literal, replacement)

              archive_literal = "/mnt/data/hypesiege-streempilot-fleet.tar.gz"
              if archive_literal not in source:
                  raise ReconstructionError("generator archive-output contract changed")
              archive_replacement = str(output_root.parent / f"{output_root.name}.tar.gz")
              source = source.replace(archive_literal, archive_replacement)
          '''
          if old_relocation in reconstructor:
              reconstructor = reconstructor.replace(old_relocation, new_relocation, 1)
          elif "generator archive-output contract changed" not in reconstructor:
              raise SystemExit("reconstructor output-relocation block drifted")
          reconstructor_path.write_text(reconstructor, encoding="utf-8")

          docs_path = Path("docs/hypesiege-streempilot-repository-publication.md")
          docs = docs_path.read_text(encoding="utf-8")
          marker = "## Reconstruct and validate locally\n"
          paragraph = (
              "The superseded `deploy/k8s/bootstrap` all-at-once publisher and its bundled "
              "generator were removed during reconciliation. That job accepted a broad "
              "repository-administration credential and attempted the entire fleet in one "
              "execution, contradicting the canonical one-repository confirmation, preflight, "
              "and remote-head verification boundary.\n\n"
          )
          if paragraph not in docs:
              if marker not in docs:
                  raise SystemExit("publication documentation insertion point is missing")
              docs = docs.replace(marker, paragraph + marker, 1)
          docs_path.write_text(docs, encoding="utf-8")

          stale_bootstrap = [
              Path("deploy/k8s/bootstrap/hypesiege-streempilot-bootstrap-job.yaml"),
              Path("deploy/k8s/bootstrap/kustomization.yaml"),
              *[
                  Path(f"deploy/k8s/bootstrap/generate.py.gz.b64.part-{index:02d}")
                  for index in range(7)
              ],
          ]
          missing = [str(path) for path in stale_bootstrap if not path.is_file()]
          if missing:
              raise SystemExit(f"stale bootstrap inventory drifted: {missing}")
          for path in stale_bootstrap:
              path.unlink()

          workflow_path = Path(".github/workflows/repository-fleets.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          start_marker = "# BEGIN DEN877 FLEET SEAL RECONCILIATION\n"
          end_marker = "# END DEN877 FLEET SEAL RECONCILIATION\n"
          if start_marker not in workflow or end_marker not in workflow:
              raise SystemExit("temporary reconciliation job markers are missing")
          start = workflow.index(start_marker)
          end = workflow.index(end_marker, start) + len(end_marker)
          workflow_path.write_text(workflow[:start].rstrip() + "\n", encoding="utf-8")
          PY
          python -m py_compile \
            scripts/reconstruct_hypesiege_streempilot_fleet.py \
            scripts/publish_hypesiege_streempilot_fleet.py \
            scripts/test_publish_hypesiege_streempilot_fleet.py
          python -m unittest -v scripts/test_publish_hypesiege_streempilot_fleet.py
          test -z "$(git grep -l '50629a57beca1ac85928cfae8fbebbca4f62a6455a7013016f92b1203dcbbd1f' || true)"
          test ! -e deploy/k8s/bootstrap/hypesiege-streempilot-bootstrap-job.yaml
          git diff --check
      - name: Commit the semantically reconciled seal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "DEN-877 reconcile reviewed fleet generator seal"
          git push origin "HEAD:${{ github.head_ref }}"
# END DEN877 FLEET SEAL RECONCILIATION
