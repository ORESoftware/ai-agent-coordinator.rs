name: DEN-767 fix Claude option order

on:
  push:
    branches:
      - agent/den-767-linear-mcp-oauth-bootstrap

permissions:
  contents: write

concurrency:
  group: den-767-fix-cli-order-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    if: github.repository == 'ORESoftware/ai-agent-coordinator.rs' && github.ref_name == 'agent/den-767-linear-mcp-oauth-bootstrap'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Apply the reviewed compatibility correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match in {path}, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "tools/linear_mcp_bootstrap.py",
              '''            "http",
                      name,
                      "--scope",
                      "user",
                      endpoint,''',
              '''            "http",
                      "--scope",
                      "user",
                      name,
                      endpoint,''',
          )

          test_path = Path("tests/test_linear_mcp_bootstrap.py")
          test_text = test_path.read_text(encoding="utf-8")
          marker = '                if len(args) >= 3 and args[:2] == ["mcp", "add"]:\n'
          insertion = marker + '                    if args[2:6] != ["--transport", "http", "--scope", "user"]:\n                        raise SystemExit(64)\n'
          if test_text.count(marker) != 1:
              raise SystemExit("expected one fake-Claude add handler")
          test_text = test_text.replace(marker, insertion, 1)
          old_expected = '''                "http",
                          "linear-server",
                          "--scope",
                          "user",
                          READ_WRITE_URL,'''
          new_expected = '''                "http",
                          "--scope",
                          "user",
                          "linear-server",
                          READ_WRITE_URL,'''
          if test_text.count(old_expected) != 1:
              raise SystemExit("expected one Claude argument assertion")
          test_path.write_text(test_text.replace(old_expected, new_expected, 1), encoding="utf-8")

          replace_once(
              "docs/linear-mcp-bootstrap.md",
              '''  --transport http \\
            linear-server \\
            --scope user \\
            https://mcp.linear.app/mcp''',
              '''  --transport http \\
            --scope user \\
            linear-server \\
            https://mcp.linear.app/mcp''',
          )
          PY
          rm -f .github/workflows/den-767-fix-cli-order.yml

      - name: Validate the corrected bootstrap
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/linear_mcp_bootstrap.py tests/test_linear_mcp_bootstrap.py
          python3 -m unittest discover -s tests -p 'test_linear_mcp_bootstrap.py' -v
          git diff --check

      - name: Commit normalized sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: place Claude MCP options before server name'

      - name: Push the reviewed correction
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${GITHUB_REF_NAME}"
