name: DEN-2334 repair digest fixture

on:
  push:
    branches:
      - agent/den-2334-daily-briefing-delivery-state
    paths:
      - .github/workflows/den-2334-fix-digest-fixture.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: den-2334-fix-digest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/den-2334-daily-briefing-delivery-state
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.97.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Replace invalid digest generator exactly once
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/daily_portfolio_delivery_state.rs')
          text = path.read_text(encoding='utf-8')
          old = '''fn digest(character: char) -> String {
              std::iter::repeat_n(character, 64).collect()
          }
          '''
          new = '''fn digest(seed: char) -> String {
              let nibble = seed.to_digit(36).expect("test digest seed") % 16;
              let character = char::from_digit(nibble, 16).expect("hex digest character");
              std::iter::repeat_n(character, 64).collect()
          }
          '''
          if text.count(old) != 1:
              raise SystemExit(f'digest helper anchor count={text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          cargo fmt --all
      - name: Run focused delivery-state validation
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --test daily_portfolio_delivery_state -- --nocapture
          cargo clippy --locked --lib --test daily_portfolio_delivery_state -- -D warnings
      - name: Remove temporary workflow and publish product-only repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/den-2334-fix-digest-fixture.yml
          git add tests/daily_portfolio_delivery_state.rs .github/workflows/den-2334-fix-digest-fixture.yml
          git diff --cached --check
          test -z "$(git diff --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'DEN-2334: generate valid hexadecimal digest fixtures'
          git push origin HEAD:agent/den-2334-daily-briefing-delivery-state
