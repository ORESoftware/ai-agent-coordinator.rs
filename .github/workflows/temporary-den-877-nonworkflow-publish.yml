name: Temporary DEN-877 validated non-workflow publication

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temporary-den-877-nonworkflow-publish.yml

permissions:
  contents: write

concurrency:
  group: temporary-den-877-nonworkflow-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.head_ref == 'agent/den-877-fleet-merge-repair'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Build the semantic two-stage repository history
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import gzip
          import hashlib
          import json
          import re
          import shutil
          from pathlib import Path

          root = Path.cwd()
          payload_dir = root / 'repository-fleets/hypesiege-streempilot'
          parts = [payload_dir / f'generator.py.gz.b64.part-{index:02d}' for index in range(6)]
          if not all(path.is_file() for path in parts):
              raise SystemExit('reviewed six-part generator payload is incomplete')
          encoded = ''.join(path.read_text(encoding='utf-8').strip() for path in parts)
          source = gzip.decompress(base64.b64decode(encoded, validate=True))
          reviewed_digest = hashlib.sha256(source).hexdigest()
          expected_digest = 'a57b00961ee57ae09bf3bb2e2d09afbdd1ddbbbde832b027802f82a1fc5dfa84'
          if reviewed_digest != expected_digest:
              raise SystemExit(
                  f'reviewed generator identity changed: {reviewed_digest} != {expected_digest}'
              )

          old_digest = '50629a57beca1ac85928cfae8fbebbca4f62a6455a7013016f92b1203dcbbd1f'
          checksum_paths = [
              root / 'scripts/reconstruct_hypesiege_streempilot_fleet.py',
              root / 'scripts/publish_hypesiege_streempilot_fleet.py',
              root / 'repository-fleets/hypesiege-streempilot.json',
              root / 'docs/hypesiege-streempilot-repository-publication.md',
          ]
          for path in checksum_paths:
              text = path.read_text(encoding='utf-8')
              if old_digest in text:
                  text = text.replace(old_digest, reviewed_digest)
              elif reviewed_digest not in text:
                  raise SystemExit(f'generator identity is absent from {path}')
              path.write_text(text, encoding='utf-8')

          reconstructor_path = root / 'scripts/reconstruct_hypesiege_streempilot_fleet.py'
          reconstructor = reconstructor_path.read_text(encoding='utf-8')
          function_pattern = re.compile(
              r'def amend_root_commit\(repository: pathlib\.Path\) -> str:\n.*?(?=\n\ndef write_gitmodules)',
              re.DOTALL,
          )
          replacement_function = '''def reseal_foundation_commit(
    repository: pathlib.Path,
    *,
    expected_source_commits: int,
) -> tuple[str, str]:
    """Return a deterministic root plus the preserved source-tip tree."""
    source_commits = int(
        run(["git", "rev-list", "--count", "HEAD"], cwd=repository).strip()
    )
    if source_commits != expected_source_commits:
        raise ReconstructionError(
            f"{repository} source history has {source_commits} commits; "
            f"expected {expected_source_commits}"
        )
    source_tip = run(["git", "rev-parse", "HEAD"], cwd=repository).strip()
    roots = run(
        ["git", "rev-list", "--max-parents=0", "HEAD"], cwd=repository
    ).splitlines()
    if len(roots) != 1:
        raise ReconstructionError(f"{repository} must contain exactly one root commit")
    run(["git", "reset", "--hard", roots[0]], cwd=repository)
    run(
        ["git", "commit", "--amend", "--no-edit", "--reset-author"],
        cwd=repository,
        env=git_environment(),
    )
    foundation = run(["git", "rev-parse", "HEAD"], cwd=repository).strip()
    return foundation, source_tip
'''
          reconstructor, function_count = function_pattern.subn(
              replacement_function,
              reconstructor,
              count=1,
          )
          if function_count != 1:
              if 'def reseal_foundation_commit(' not in reconstructor:
                  raise SystemExit('foundation resealing function drifted')

          child_call = 'record["commit"] = amend_root_commit(repository)'
          child_replacement = '''record["commit"], _source_tip = reseal_foundation_commit(
            repository, expected_source_commits=1
        )'''
          if child_call in reconstructor:
              if reconstructor.count(child_call) != 1:
                  raise SystemExit('child repository resealing call is ambiguous')
              reconstructor = reconstructor.replace(child_call, child_replacement, 1)
          elif child_replacement not in reconstructor:
              raise SystemExit('child repository resealing call drifted')

          monorepo_old = '''        write_gitmodules(repository, child_records)
        add_local_gitlinks(output_root, repository, child_records)
        record = dict(record)
        record["commit"] = amend_root_commit(repository)
        record["files"] = len(run(["git", "ls-files"], cwd=repository).splitlines())
'''
          monorepo_new = '''        _foundation, source_tip = reseal_foundation_commit(
            repository, expected_source_commits=2
        )
        run(["git", "read-tree", "--reset", "-u", source_tip], cwd=repository)
        write_gitmodules(repository, child_records)
        add_local_gitlinks(output_root, repository, child_records)
        run(
            ["git", "commit", "-m", "chore: pin canonical repository fleet"],
            cwd=repository,
            env=git_environment(),
        )
        record = dict(record)
        record["commit"] = run(
            ["git", "rev-parse", "HEAD"], cwd=repository
        ).strip()
        record["files"] = len(run(["git", "ls-files"], cwd=repository).splitlines())
'''
          if monorepo_old in reconstructor:
              if reconstructor.count(monorepo_old) != 1:
                  raise SystemExit('monorepo resealing block is ambiguous')
              reconstructor = reconstructor.replace(monorepo_old, monorepo_new, 1)
          elif monorepo_new not in reconstructor:
              raise SystemExit('monorepo resealing block drifted')

          output_anchor = '    source = source.replace(expected_literal, replacement)\n'
          output_patch = '''
    archive_literal = "/mnt/data/hypesiege-streempilot-fleet.tar.gz"
    archive_replacement = str(output_root.parent / f"{output_root.name}.tar.gz")
    if source.count(archive_literal) != 1:
        raise ReconstructionError("generator archive-output contract changed")
    source = source.replace(archive_literal, archive_replacement)

    checksum_literal = "/mnt/data/hypesiege-streempilot-fleet.SHA256"
    checksum_replacement = str(output_root.parent / f"{output_root.name}.SHA256")
    if source.count(checksum_literal) != 1:
        raise ReconstructionError("generator checksum-output contract changed")
    source = source.replace(checksum_literal, checksum_replacement)
'''
          if 'checksum_literal = "/mnt/data/hypesiege-streempilot-fleet.SHA256"' not in reconstructor:
              if reconstructor.count(output_anchor) != 1:
                  raise SystemExit('generator output-path insertion point drifted')
              reconstructor = reconstructor.replace(
                  output_anchor,
                  output_anchor + output_patch,
                  1,
              )

          old_cleanup = '''    stale_archive = output_root.parent / f"{output_root.name}.tar.gz"
    stale_archive.unlink(missing_ok=True)
    stale_archive.with_suffix(stale_archive.suffix + ".SHA256").unlink(missing_ok=True)
'''
          new_cleanup = '''    stale_archive = output_root.parent / f"{output_root.name}.tar.gz"
    stale_checksum = output_root.parent / f"{output_root.name}.SHA256"
    stale_archive.unlink(missing_ok=True)
    stale_checksum.unlink(missing_ok=True)
'''
          if old_cleanup in reconstructor:
              reconstructor = reconstructor.replace(old_cleanup, new_cleanup, 1)
          elif new_cleanup not in reconstructor:
              raise SystemExit('generated-output cleanup contract drifted')
          reconstructor_path.write_text(reconstructor, encoding='utf-8')

          docs_path = root / 'docs/hypesiege-streempilot-repository-publication.md'
          docs = docs_path.read_text(encoding='utf-8')
          marker = '## Reconstruct and validate locally\n'
          paragraph = (
              'The superseded `deploy/k8s/bootstrap` all-at-once publisher and its bundled '
              'generator were removed during reconciliation. The retained path reconstructs '
              'each child repository as a deterministic root history and each monorepository '
              'as a deterministic foundation commit followed by a deterministic commit that '
              'pins exact child gitlinks. Publication remains one explicitly confirmed '
              'repository at a time with complete preflight and remote-head verification.\n\n'
          )
          if paragraph not in docs:
              if marker not in docs:
                  raise SystemExit('publication documentation insertion point is missing')
              docs = docs.replace(marker, paragraph + marker, 1)
          docs_path.write_text(docs, encoding='utf-8')

          bootstrap = root / 'deploy/k8s/bootstrap'
          expected_bootstrap = {
              'hypesiege-streempilot-bootstrap-job.yaml',
              'kustomization.yaml',
              *{f'generate.py.gz.b64.part-{index:02d}' for index in range(7)},
          }
          if bootstrap.exists():
              actual_bootstrap = {
                  path.relative_to(bootstrap).as_posix()
                  for path in bootstrap.rglob('*')
                  if path.is_file()
              }
              if actual_bootstrap != expected_bootstrap:
                  raise SystemExit(
                      'refusing to remove bootstrap overlay with unrelated content: '
                      f'{sorted(actual_bootstrap ^ expected_bootstrap)}'
                  )
              shutil.rmtree(bootstrap)

          previous_manifest = json.loads(
              (root / 'repository-fleets/hypesiege-streempilot.json').read_text(
                  encoding='utf-8'
              )
          )
          (root / '.git/den-877-previous-manifest.json').write_text(
              json.dumps(previous_manifest),
              encoding='utf-8',
          )
          PY

      - name: Regenerate and verify the derived ledger
        shell: bash
        run: |
          set -euo pipefail
          output_root="$RUNNER_TEMP/hypesiege-streempilot-fleet"
          manifest_out="$RUNNER_TEMP/hypesiege-streempilot-manifest.json"
          python scripts/reconstruct_hypesiege_streempilot_fleet.py \
            --output-root "$output_root" \
            --manifest-out "$manifest_out"

          MANIFEST_OUT="$manifest_out" python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          root = Path.cwd()
          previous = json.loads(
              (root / '.git/den-877-previous-manifest.json').read_text(encoding='utf-8')
          )
          generated = json.loads(Path(os.environ['MANIFEST_OUT']).read_text(encoding='utf-8'))
          for key in (
              'schema_version', 'default_branch', 'repository_count',
              'total_tracked_files', 'total_gitlinks', 'organizations',
          ):
              if previous[key] != generated[key]:
                  raise SystemExit(
                      f'fleet invariant changed for {key}: '
                      f'{previous[key]!r} != {generated[key]!r}'
                  )
          if generated['generator_sha256'] != 'a57b00961ee57ae09bf3bb2e2d09afbdd1ddbbbde832b027802f82a1fc5dfa84':
              raise SystemExit('generated ledger lost the reviewed generator identity')

          previous_names = [item['full_name'] for item in previous['repositories']]
          generated_names = [item['full_name'] for item in generated['repositories']]
          if previous_names != generated_names:
              raise SystemExit('repository identity or order changed during reconstruction')
          previous_by_name = {item['full_name']: item for item in previous['repositories']}
          generated_by_name = {item['full_name']: item for item in generated['repositories']}
          for full_name in previous_names:
              before = previous_by_name[full_name]
              after = generated_by_name[full_name]
              for field in (
                  'org', 'name', 'kind', 'files', 'remote', 'description',
                  'visibility', 'default_branch', 'gitlinks',
              ):
                  if before[field] != after[field]:
                      raise SystemExit(
                          f'{full_name}: non-commit contract changed for {field}'
                      )

          manifest_path = root / 'repository-fleets/hypesiege-streempilot.json'
          manifest_path.write_text(json.dumps(generated, indent=2) + '\n', encoding='utf-8')
          test_path = root / 'scripts/test_publish_hypesiege_streempilot_fleet.py'
          test_text = test_path.read_text(encoding='utf-8')
          docs_path = root / 'docs/hypesiege-streempilot-repository-publication.md'
          docs_text = docs_path.read_text(encoding='utf-8')
          for full_name in previous_names:
              old_commit = previous_by_name[full_name]['commit']
              new_commit = generated_by_name[full_name]['commit']
              if old_commit == new_commit:
                  continue
              test_text = test_text.replace(old_commit, new_commit)
              docs_text = docs_text.replace(old_commit, new_commit)
          test_path.write_text(test_text, encoding='utf-8')
          docs_path.write_text(docs_text, encoding='utf-8')
          PY

      - name: Validate every non-workflow change
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/reconstruct_hypesiege_streempilot_fleet.py \
            scripts/publish_hypesiege_streempilot_fleet.py \
            scripts/test_publish_hypesiege_streempilot_fleet.py
          python -m unittest -v scripts/test_publish_hypesiege_streempilot_fleet.py
          python scripts/publish_hypesiege_streempilot_fleet.py \
            --repository hypesiege/hypesiege-api-server.rs > /tmp/hypesiege-plan.json
          python scripts/publish_hypesiege_streempilot_fleet.py \
            --repository streempilot/streempilot-monorepo > /tmp/streempilot-plan.json
          test ! -e deploy/k8s/bootstrap
          git diff --check

      - name: Push only validated non-workflow paths
        shell: bash
        run: |
          set -euo pipefail
          rm -f repository-fleets/hypesiege-streempilot/RECONCILE-TRIGGER-20260731
          git add \
            docs/hypesiege-streempilot-repository-publication.md \
            repository-fleets/hypesiege-streempilot.json \
            repository-fleets/hypesiege-streempilot/RECONCILE-TRIGGER-20260731 \
            scripts/publish_hypesiege_streempilot_fleet.py \
            scripts/reconstruct_hypesiege_streempilot_fleet.py \
            scripts/test_publish_hypesiege_streempilot_fleet.py
          git add -u deploy/k8s/bootstrap
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo 'workflow paths must be committed separately by the authorized connector' >&2
            exit 1
          fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(DEN-877): publish the validated deterministic fleet ledger'
          git push origin HEAD:${{ github.head_ref }}
