name: Refresh DEN-877 deterministic fleet ledger

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: den-877-ledger-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-ledger:
    if: github.head_ref == 'agent/den-877-fleet-merge-repair-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out clean replacement branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/den-877-fleet-merge-repair-v2
          fetch-depth: 0
      - name: Import only the deterministic ledger from the closed superseded repair
        shell: bash
        run: |
          set -euo pipefail
          reviewed_repair_sha='bb545a665ef0420bd602c115276b95db9aab09c9'
          git show \
            "${reviewed_repair_sha}:repository-fleets/hypesiege-streempilot.json" \
            > repository-fleets/hypesiege-streempilot.json
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('repository-fleets/hypesiege-streempilot.json')
          manifest = json.loads(path.read_text(encoding='utf-8'))
          assert manifest['schema_version'] == 2
          assert manifest['generator_sha256'] == 'a57b00961ee57ae09bf3bb2e2d09afbdd1ddbbbde832b027802f82a1fc5dfa84'
          assert manifest['repository_count'] == 32
          assert manifest['total_tracked_files'] == 888
          assert manifest['total_gitlinks'] == 30
          assert manifest['organizations'] == {'hypesiege': 15, 'streempilot': 17}
          assert len(manifest['repositories']) == 32
          records = {record['full_name']: record for record in manifest['repositories']}
          assert records['hypesiege/hypesiege-monorepo']['commit'] == '669c91b1bf96643fe5c11b79f862716d3fb59558'
          assert records['hypesiege/hypesiege-monorepo']['gitlinks'] == 14
          assert records['streempilot/streempilot-monorepo']['gitlinks'] == 16
          assert all(len(record['commit']) == 40 for record in manifest['repositories'])
          PY
          rm .github/workflows/refresh-den-877-ledger.yml
          git diff --check
      - name: Commit pinned deterministic ledger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "DEN-877 pin regenerated schema-v2 fleet ledger"
          git push origin "HEAD:agent/den-877-fleet-merge-repair-v2"
