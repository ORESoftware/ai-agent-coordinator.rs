name: DEN-529 Type Fix

on:
  push:
    branches:
      - agent/den-529-linear-delivery-worker

permissions:
  contents: write

concurrency:
  group: den-529-typefix
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/den-529-linear-delivery-worker
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.97.0'
          components: rustfmt
      - name: Apply exact error conversion and formatting
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/app.rs')
          source = path.read_text()
          old = 'let result = serde_json::to_value(&report).map_err(AppError::Internal)?;'
          new = 'let result = serde_json::to_value(&report)\n                .map_err(|error| AppError::Internal(error.into()))?;'
          count = source.count(old)
          if count not in (0, 1):
              raise SystemExit(f'unexpected type-fix match count: {count}')
          if count == 1:
              path.write_text(source.replace(old, new))
          PY
          cargo fmt --all
          rm .github/workflows/den-529-typefix.yml
          git diff --check
      - name: Commit corrected source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'ORESoftware automation'
          git config user.email 'alexander.d.mills@gmail.com'
          git add .github/workflows/den-529-typefix.yml src tests
          git commit -m 'Refs DEN-529 convert serialization errors explicitly'
          git push origin HEAD:agent/den-529-linear-delivery-worker
