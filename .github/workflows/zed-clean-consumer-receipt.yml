name: Zed clean-consumer receipt

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zed-clean-consumer-receipt.yml'
      - 'docs/zed-clean-consumer-receipt.md'
      - 'fixtures/zed-clean-consumer-receipt-*.json'
      - 'scripts/zed_clean_consumer_receipt.py'
      - 'scripts/test_zed_clean_consumer_receipt.py'
  pull_request:
    paths:
      - '.github/workflows/zed-clean-consumer-receipt.yml'
      - 'docs/zed-clean-consumer-receipt.md'
      - 'fixtures/zed-clean-consumer-receipt-*.json'
      - 'scripts/zed_clean_consumer_receipt.py'
      - 'scripts/test_zed_clean_consumer_receipt.py'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate this workflow
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo" \
            --workdir /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            .github/workflows/zed-clean-consumer-receipt.yml

      - name: Compile validator and tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/zed_clean_consumer_receipt.py \
            scripts/test_zed_clean_consumer_receipt.py

      - name: Run quartet, graph, leakage, and closure tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v scripts/test_zed_clean_consumer_receipt.py

      - name: Verify the checked-in planning receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/zed_clean_consumer_receipt.py \
            fixtures/zed-clean-consumer-receipt-2026-09-04.json \
            --mode planning --json > planning-report.json
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          report = json.loads(Path("planning-report.json").read_text(encoding="utf-8"))
          assert report["valid"] is True
          assert report["closure_ready"] is False
          assert report["package_count"] == 4
          assert report["submodule_count"] == 2
          assert report["consumer_count"] == 5
          assert report["operation_count"] == 6
          assert re.fullmatch(r"[0-9a-f]{64}", report["receipt_sha256"])
          assert report["errors"] == []
          assert report["warnings"]
          PY

      - name: Prove the planning receipt fails closure
        shell: bash
        run: |
          set -euo pipefail
          status=0
          set +e
          python3 scripts/zed_clean_consumer_receipt.py \
            fixtures/zed-clean-consumer-receipt-2026-09-04.json \
            --mode closure --json > closure-report.json
          status=$?
          set -e
          test "$status" -eq 3
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("closure-report.json").read_text(encoding="utf-8"))
          assert report["valid"] is False
          assert report["closure_ready"] is False
          assert any(
              error == "closure: all four packages must be verified"
              for error in report["errors"]
          )
          assert any(
              error == "closure: receipt blockers must be empty"
              for error in report["errors"]
          )
          PY

      - name: Require a clean worktree
        shell: bash
        run: |
          set -euo pipefail
          rm -f planning-report.json closure-report.json
          test -z "$(git status --porcelain)"
