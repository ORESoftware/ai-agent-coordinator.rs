name: RPC source evidence exact-head
# Triggered from the coordinator so private dependency access stays centralized.

on:
  push:
    branches:
      - rpc-source-evidence
    paths:
      - ".github/workflows/rpc-source-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rpc-source-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: nightly-org-maintenance
      deployment: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: canonical-cloud/canonical-api-server.rs
            branch: DEN-4078-materialize-rpc-evidence-v2
            typespec: contracts/rpc/version/main.tsp
            schema: contracts/rpc/version/authored.schema.json
            expected: '["CanonicalCloud.Rpc.Version.VersionResponse","CanonicalCloud.Rpc.Version.VersionError","CanonicalCloud.Rpc.Version.UserLookupHeaders","CanonicalCloud.Rpc.Version.FindUsersRequest","CanonicalCloud.Rpc.Version.FindUsersResponse","CanonicalCloud.Rpc.Version.FindUserByIdRequest","CanonicalCloud.Rpc.Version.FindUserByIdResponse","CanonicalCloud.Rpc.Version.UserLookupError"]'
            target_owner: canonical-cloud
            target_repo: canonical-api-server.rs
            need_canonical_deps: true
            need_k8s: true
          - repo: canonical-cloud/canonical-admin-api-server.rs
            branch: DEN-4078-materialize-rpc-evidence-v2
            typespec: contracts/rpc/version/main.tsp
            schema: contracts/rpc/version/authored.schema.json
            expected: '["CanonicalCloud.Admin.Rpc.Version.VersionResponse","CanonicalCloud.Admin.Rpc.Version.VersionError","CanonicalCloud.Admin.Rpc.Version.FindUsersHeaders","CanonicalCloud.Admin.Rpc.Version.FindUsersRequest","CanonicalCloud.Admin.Rpc.Version.FindUsersResponse","CanonicalCloud.Admin.Rpc.Version.FindUsersError"]'
            target_owner: canonical-cloud
            target_repo: canonical-admin-api-server.rs
            need_canonical_deps: false
            need_k8s: false
          - repo: sonus-auris/sonus-auris-api-server.rs
            branch: DEN-4078-materialize-rpc-evidence-v2
            typespec: contracts/rpc-version/main.tsp
            schema: contracts/rpc-version/authored.schema.json
            expected: '["SonusAurisVersion.VersionError","SonusAurisVersion.VersionResponse","SonusAurisVersion.UserLookupHeaders","SonusAurisVersion.FindUsersRequest","SonusAurisVersion.FindUsersResponse","SonusAurisVersion.FindUserByIdRequest","SonusAurisVersion.FindUserByIdResponse","SonusAurisVersion.UserLookupError"]'
            target_owner: sonus-auris
            target_repo: sonus-auris-api-server.rs
            need_canonical_deps: false
            need_k8s: true
          - repo: sonus-auris/sonus-auris-admin-api-server.rs
            branch: rpc-evidence-v2
            typespec: contracts/rpc-version/main.tsp
            schema: contracts/rpc-version/authored.schema.json
            expected: '["SonusAurisAdminVersion.VersionError","SonusAurisAdminVersion.VersionResponse","SonusAurisAdminVersion.FindUsersHeaders","SonusAurisAdminVersion.FindUsersRequest","SonusAurisAdminVersion.FindUsersResponse","SonusAurisAdminVersion.FindUsersError"]'
            target_owner: sonus-auris
            target_repo: sonus-auris-admin-api-server.rs
            need_canonical_deps: false
            need_k8s: false

    steps:
      - name: Mint target repository token
        id: target-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.PORTFOLIO_GITHUB_APP_ID }}
          private-key: ${{ secrets.PORTFOLIO_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ matrix.target_owner }}
          repositories: ${{ matrix.target_repo }}
          permission-contents: write

      - name: Mint shared-auth dependency token
        id: shared-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.PORTFOLIO_GITHUB_APP_ID }}
          private-key: ${{ secrets.PORTFOLIO_GITHUB_APP_PRIVATE_KEY }}
          owner: shared-auth
          repositories: shared-auth-clients
          permission-contents: read

      - name: Mint Canonical dependency token
        if: ${{ matrix.need_canonical_deps }}
        id: canonical-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.PORTFOLIO_GITHUB_APP_ID }}
          private-key: ${{ secrets.PORTFOLIO_GITHUB_APP_PRIVATE_KEY }}
          owner: canonical-cloud
          repositories: canonical-lib-core,canonical-interfaces
          permission-contents: read

      - name: Mint k8s dependency token
        if: ${{ matrix.need_k8s }}
        id: k8s-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.PORTFOLIO_GITHUB_APP_ID }}
          private-key: ${{ secrets.PORTFOLIO_GITHUB_APP_PRIVATE_KEY }}
          owner: ORESoftware
          repositories: k8s-libs-and-shared-defs
          permission-contents: read

      - name: Check out clean evidence branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.branch }}
          token: ${{ steps.target-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure exact private dependency credentials
        shell: bash
        env:
          SHARED_TOKEN: ${{ steps.shared-token.outputs.token }}
          CANONICAL_TOKEN: ${{ steps.canonical-token.outputs.token }}
          K8S_TOKEN: ${{ steps.k8s-token.outputs.token }}
        run: |
          set -euo pipefail
          git config --global url."https://x-access-token:${SHARED_TOKEN}@github.com/shared-auth/shared-auth-clients".insteadOf "https://github.com/shared-auth/shared-auth-clients"
          if [[ -n "${CANONICAL_TOKEN:-}" ]]; then
            git config --global url."https://x-access-token:${CANONICAL_TOKEN}@github.com/canonical-cloud/canonical-lib-core".insteadOf "https://github.com/canonical-cloud/canonical-lib-core"
            git config --global url."https://x-access-token:${CANONICAL_TOKEN}@github.com/canonical-cloud/canonical-interfaces".insteadOf "https://github.com/canonical-cloud/canonical-interfaces"
          fi
          if [[ -n "${K8S_TOKEN:-}" ]]; then
            git config --global url."https://x-access-token:${K8S_TOKEN}@github.com/ORESoftware/k8s-libs-and-shared-defs".insteadOf "https://github.com/ORESoftware/k8s-libs-and-shared-defs"
          fi

      - name: Pin Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable

      - name: Regenerate Cargo.lock from manifests
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: cargo generate-lockfile

      - name: Generate parity-approved Contract IR
        uses: ORESoftware/typespec-json-schema-validator@bd503465dab8c5148fee722b443ed04ff126c9bf
        with:
          typespec: ${{ matrix.typespec }}
          schema: ${{ matrix.schema }}
          report: .typespec-json-schema-validator/report.json
          contract_ir: .typespec-json-schema-validator/contract-ir.json
          output_dir: .typespec-json-schema-validator/generated
          max_probes: "128"

      - name: Require consumer admission
        uses: ORESoftware/typespec-json-schema-validator/actions/test-consumer-admission@bd503465dab8c5148fee722b443ed04ff126c9bf
        with:
          contract_ir: .typespec-json-schema-validator/contract-ir.json
          report: .typespec-json-schema-validator/report.json
          typespec: ${{ matrix.typespec }}
          schema: ${{ matrix.schema }}
          generated_schema: .typespec-json-schema-validator/generated/typespec.generated.schema.json
          expected_declarations: ${{ matrix.expected }}

      - name: Verify authored authorities unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- "${{ matrix.typespec }}" "${{ matrix.schema }}"

      - name: Commit only reproducibility evidence
        shell: bash
        env:
          TARGET_TOKEN: ${{ steps.target-token.outputs.token }}
          TARGET_REPO: ${{ matrix.repo }}
          TARGET_BRANCH: ${{ matrix.branch }}
        run: |
          set -euo pipefail
          rm -rf .typespec-json-schema-validator/generated
          rm -f .typespec-json-schema-validator/report.sarif
          git add Cargo.lock
          git add -f .typespec-json-schema-validator/report.json .typespec-json-schema-validator/contract-ir.json

          unexpected="$(git status --porcelain | awk '{print $2}' | grep -v -E '^(Cargo.lock|\.typespec-json-schema-validator/(report|contract-ir)\.json)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "::error::unexpected materialization changes:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "source reproducibility evidence already current"
            exit 0
          fi

          git config user.name "ores-stack-rpc-bot"
          git config user.email "ores-stack-rpc-bot@users.noreply.github.com"
          git commit -m "chore(rpc): materialize lock and contract evidence"
          git push "https://x-access-token:${TARGET_TOKEN}@github.com/${TARGET_REPO}.git" "HEAD:${TARGET_BRANCH}"

      - name: Retain exact materialization evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rpc-source-evidence-${{ matrix.target_repo }}-${{ github.run_id }}
          path: |
            Cargo.lock
            .typespec-json-schema-validator/report.json
            .typespec-json-schema-validator/contract-ir.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Remove temporary credential rewrites
        if: ${{ always() }}
        shell: bash
        run: |
          git config --global --unset-all url."https://x-access-token:${{ steps.shared-token.outputs.token }}@github.com/shared-auth/shared-auth-clients".insteadOf || true
          if [[ -n "${{ steps.canonical-token.outputs.token }}" ]]; then
            git config --global --unset-all url."https://x-access-token:${{ steps.canonical-token.outputs.token }}@github.com/canonical-cloud/canonical-lib-core".insteadOf || true
            git config --global --unset-all url."https://x-access-token:${{ steps.canonical-token.outputs.token }}@github.com/canonical-cloud/canonical-interfaces".insteadOf || true
          fi
          if [[ -n "${{ steps.k8s-token.outputs.token }}" ]]; then
            git config --global --unset-all url."https://x-access-token:${{ steps.k8s-token.outputs.token }}@github.com/ORESoftware/k8s-libs-and-shared-defs".insteadOf || true
          fi
