name: Temporary Rustfmt Branch Fix

on:
  push:
    branches: [agent/den-453-signed-push-intake]

permissions:
  contents: write

concurrency:
  group: temporary-rustfmt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.event.head_commit.message != 'DEN-453 apply canonical rustfmt'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/den-453-signed-push-intake
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.97.0'
          components: rustfmt
      - name: Format and commit the branch
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          if git diff --quiet -- src tests; then
            echo 'Rust source is already formatted.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src tests
          git commit -m 'DEN-453 apply canonical rustfmt'
          git push origin HEAD:agent/den-453-signed-push-intake
