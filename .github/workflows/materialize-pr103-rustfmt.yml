name: Materialize PR103 rustfmt evidence

on:
  push:
    branches:
      - DEN-390-pr103-format-artifact
  pull_request:
    branches:
      - DEN-390-ores-cli-pr103-workflow-permissions-probe
    paths:
      - ".github/workflows/materialize-pr103-rustfmt.yml"
      - "evidence/ores-cli-pr103/**"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact formatter head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          show-progress: false
      - name: Install exact Rust formatter
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Materialize canonical format
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          cargo fmt --manifest-path evidence/ores-cli-pr103/Cargo.toml --all
          git diff --check
          actual="$(git diff --name-only | sort)"
          allowed='evidence/ores-cli-pr103/src/audit/workflow_permissions.rs'
          test "$actual" = "$allowed" || {
            printf 'unexpected formatter drift:\n%s\n' "$actual" >&2
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/pr103-format"
          cp evidence/ores-cli-pr103/src/audit/workflow_permissions.rs "$RUNNER_TEMP/pr103-format/workflow_permissions.rs"
          git diff --binary -- evidence/ores-cli-pr103/src/audit/workflow_permissions.rs > "$RUNNER_TEMP/pr103-format/rustfmt.patch"
          sha256sum "$RUNNER_TEMP/pr103-format/workflow_permissions.rs" > "$RUNNER_TEMP/pr103-format/SHA256SUMS"
          git hash-object "$RUNNER_TEMP/pr103-format/workflow_permissions.rs" > "$RUNNER_TEMP/pr103-format/GIT_BLOB"
      - name: Upload canonical formatted bytes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ores-cli-pr103-rustfmt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr103-format
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
