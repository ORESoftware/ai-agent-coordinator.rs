name: DEN-1874 Fanwaave routing migration

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/den-1874-fanwaave-routing.yml
      - .github/den-1874-trigger

permissions:
  contents: write

concurrency:
  group: den-1874-fanwaave-routing
  cancel-in-progress: false

jobs:
  migrate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/DEN-1874-fanwaave-routing'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: agent/DEN-1874-fanwaave-routing

      - name: Apply the fail-closed Fanwaave registry migration
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path


          registry_path = Path("config/org-project-registry.yaml")
          registry = json.loads(registry_path.read_text(encoding="utf-8"))

          mappings = registry["mappings"]
          if any(item["github"]["login"].casefold() == "fanwaave" for item in mappings):
              raise SystemExit("fanwaave mapping already exists; refusing an ambiguous migration")

          fanwaave_mapping = {
              "github": {
                  "login": "fanwaave",
                  "account_id": 311152026,
                  "account_type": "Organization",
                  "aliases": ["fanwaave", "github.com/fanwaave"],
              },
              "github_app": {
                  "installation_id": 151253995,
                  "observed_at": "2026-08-04",
              },
              "linear": {
                  "project_id": "d765e227-5726-42c8-8643-a8bd9e5a9a8c",
                  "project_name": "github.com/fanwaave",
                  "project_url": "https://linear.app/denman/project/githubcomfanwaave-6ba038b59dbc",
              },
              "runtime_route": None,
          }
          insert_at = next(
              index
              for index, item in enumerate(mappings)
              if item["github"]["login"].casefold() > "fanwaave"
          )
          mappings.insert(insert_at, fanwaave_mapping)
          registry["observed_at"] = "2026-08-04"

          old_overrides = registry["repository_overrides"]
          retained_overrides = [
              item
              for item in old_overrides
              if item["repository"] != "ORESoftware/push-notification-server.rs"
          ]
          if len(old_overrides) - len(retained_overrides) != 1:
              raise SystemExit("expected exactly one obsolete ORESoftware push-server override")
          registry["repository_overrides"] = retained_overrides

          registry_path.write_text(
              json.dumps(registry, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          project_tests_path = Path("tests/test_org_project_registry.py")
          project_tests = project_tests_path.read_text(encoding="utf-8")
          replacements = {
              '        self.assertEqual(counts["mappings"], 30)': '        self.assertEqual(counts["mappings"], 31)',
              '        self.assertEqual(counts["repository_overrides"], 6)': '        self.assertEqual(counts["repository_overrides"], 5)',
          }
          for old, new in replacements.items():
              if project_tests.count(old) != 1:
                  raise SystemExit(f"expected one project-test match for {old!r}")
              project_tests = project_tests.replace(old, new, 1)

          fanwaave_test = (
              "    def test_fanwaave_push_server_uses_owner_project(self) -> None:\n"
              "        project = registry_module.resolve_project(\n"
              "            self.registry,\n"
              "            \"fanwaave\",\n"
              "            \"fanwaave/push-notification-server.rs\",\n"
              "        )\n"
              "        self.assertEqual(\n"
              "            project[\"project_id\"],\n"
              "            \"d765e227-5726-42c8-8643-a8bd9e5a9a8c\",\n"
              "        )\n"
              "\n"
          )
          project_marker = "    def test_repository_cannot_escape_resolved_owner(self) -> None:\n"
          if project_tests.count(project_marker) != 1:
              raise SystemExit("could not locate project-registry test insertion point")
          project_tests = project_tests.replace(
              project_marker,
              fanwaave_test + project_marker,
              1,
          )
          project_tests_path.write_text(project_tests, encoding="utf-8")

          relationship_tests_path = Path("tests/test_org_repository_relationships.py")
          relationship_tests = relationship_tests_path.read_text(encoding="utf-8")
          relationship_replacements = {
              '                "eligible_organizations": 29,': '                "eligible_organizations": 30,',
              '                "missing": 26,': '                "missing": 27,',
              '        self.assertEqual(report["registry"]["mapped_owners"], 30)': '        self.assertEqual(report["registry"]["mapped_owners"], 31)',
              '        self.assertEqual(len(overrides), 6)': '        self.assertEqual(len(overrides), 5)',
              '                "ORESoftware/push-notification-server.rs",\n': '',
              '        self.assertEqual(index["owner_count"], 30)': '        self.assertEqual(index["owner_count"], 31)',
              '        self.assertEqual(len(index["files"]), 30)': '        self.assertEqual(len(index["files"]), 31)',
          }
          for old, new in relationship_replacements.items():
              if relationship_tests.count(old) != 1:
                  raise SystemExit(f"expected one relationship-test match for {old!r}")
              relationship_tests = relationship_tests.replace(old, new, 1)
          relationship_tests_path.write_text(relationship_tests, encoding="utf-8")
          PY

      - name: Validate the migrated registry and focused suites
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool config/org-project-registry.yaml >/dev/null
          python3 -m py_compile \
            scripts/validate_org_project_registry.py \
            scripts/render_org_project_context.py \
            scripts/render_org_repository_relationships.py \
            scripts/audit_org_context_rollout.py \
            tests/test_org_project_registry.py \
            tests/test_org_repository_relationships.py
          python3 -m unittest -v \
            tests/test_org_project_registry.py \
            tests/test_org_repository_relationships.py
          python3 scripts/validate_org_project_registry.py

      - name: Commit the validated migration and remove one-shot artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/den-1874-fanwaave-routing.yml \
            .github/den-1874-trigger
          git add \
            config/org-project-registry.yaml \
            tests/test_org_project_registry.py \
            tests/test_org_repository_relationships.py
          git diff --cached --check
          git commit -m "DEN-1874 route push server through Fanwaave"
          git push origin HEAD:agent/DEN-1874-fanwaave-routing
