name: format ores-cli PR150 once

on:
  push:
    branches:
      - DEN-390-ores-cli-pr150-sidecar-hardening-probe
    paths:
      - .github/workflows/format-ores-cli-pr150-once.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.88.0'
          components: rustfmt
      - name: Format evidence crate
        run: cargo fmt --manifest-path evidence/ores-cli-pr150/Cargo.toml --all
      - name: Require bounded change
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = 'evidence/ores-cli-pr150/src/audit/runtime_toml_sidecar.rs'
      - name: Commit formatting-only source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/ores-cli-pr150/src/audit/runtime_toml_sidecar.rs
          git commit -m 'style: rustfmt PR150 exact source'
          git push origin HEAD:DEN-390-ores-cli-pr150-sidecar-hardening-probe
