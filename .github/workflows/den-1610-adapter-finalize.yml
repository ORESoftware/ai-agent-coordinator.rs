name: DEN-1610 one-shot adapter finalizer

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/den-1610-adapter-finalize.yml

permissions:
  contents: write

concurrency:
  group: den-1610-adapter-finalize
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/den-1610-authenticated-adapters-current-main-20260804'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact adapter branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1610-authenticated-adapters-current-main-20260804
          fetch-depth: 0
          persist-credentials: true

      - name: Install repository validation toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.97.0'
          components: rustfmt,clippy

      - name: Apply the exact Clippy correction
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/prompt_reconciliation_adapters.rs')
          source = path.read_text(encoding='utf-8')
          old = '''    envelope
              .get("data")
              .cloned()
              .ok_or_else(|| {
          '''
          new = '''    envelope
              .get("data")
              .cloned()
              .ok_or({
          '''
          if source.count(old) != 1:
              raise SystemExit(
                  f'expected one GraphQL data conversion, found {source.count(old)}'
              )
          path.write_text(source.replace(old, new, 1), encoding='utf-8')

      - name: Format and validate the permanent product tree
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all
          cargo doc --locked --no-deps
          cargo build --locked --release
          git diff --check
          if grep -R --line-number -E '^(<{7}|={7}|>{7})' \
            src tests docs/prompt-reconciliation-adapters.md; then
            echo 'Git conflict markers are forbidden.' >&2
            exit 1
          fi

      - name: Remove helper, commit, and push the exact review head
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/den-1610-adapter-finalize.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(DEN-1610): format adapters and satisfy strict Clippy'
          git push origin HEAD:agent/den-1610-authenticated-adapters-current-main-20260804

# retry-generation: 2
