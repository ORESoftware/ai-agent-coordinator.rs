name: generate-recent-org-audit

on:
  push:
    branches: [audit/recent-orgs-2026-08-01]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/recent-orgs-2026-08-01
      - name: Query authoritative organization metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib
          import urllib.request

          orgs = [
              'channelsiege', 'OmniBlitz', 'streamkore', 'hypeblitz',
              '3FA-app', 'messaging-intel', 'akrion-sim', 'athlet-o',
              'benefactor-cc', 'canonical-cloud', 'claritas-viz', 'cliptown',
              'daedalus-fab', 'declarative-migrations', 'fiducia-cloud',
              'anticaptrad', 'opto-sync', 'quaestor-ledger', 'sagitta-stack',
              'shared-auth', 'scintilla-run', 'rust-ssr-demos', 'sonus-auris',
              'usa-acc', 'voxletra', 'zed-pkg', 'zed-pkg-test', 'memebank',
              'meta-agents-demo', 'networking-components', 'StreemPilot',
              'unreal-unity-poc', 'file-tunnel', 'hypesiege',
              'discrete-event-systems', 'drone-mngr'
          ]
          cutoff = dt.datetime.fromisoformat('2026-07-28T01:52:00+00:00')
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'ai-agent-coordinator-org-audit',
          }
          rows = []
          for org in orgs:
              request = urllib.request.Request(f'https://api.github.com/orgs/{org}', headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  data = json.load(response)
              created = dt.datetime.fromisoformat(data['created_at'].replace('Z', '+00:00'))
              rows.append({
                  'login': data['login'],
                  'id': data['id'],
                  'created_at': data['created_at'],
                  'updated_at': data['updated_at'],
                  'public_repos': data['public_repos'],
                  'created_within_five_days': created >= cutoff,
              })
          rows.sort(key=lambda row: row['created_at'])
          recent = [row for row in rows if row['created_within_five_days']]
          report = {
              'generated_at': dt.datetime.now(dt.timezone.utc).isoformat().replace('+00:00', 'Z'),
              'cutoff_utc': cutoff.isoformat().replace('+00:00', 'Z'),
              'cutoff_local': '2026-07-27T20:52:00-05:00',
              'source': 'GitHub REST GET /orgs/{org}',
              'recent_count': len(recent),
              'recent_organizations': recent,
              'all_installed_organizations': rows,
              'note': 'public_repos is public-only; installation-scoped repository counts are audited separately.',
          }
          output = pathlib.Path('reports')
          output.mkdir(exist_ok=True)
          (output / 'recent-github-orgs-2026-08-01.json').write_text(json.dumps(report, indent=2) + '\n')
          lines = [
              '# GitHub organizations created in the previous five days',
              '',
              f"Cutoff: `{report['cutoff_utc']}` (`{report['cutoff_local']}` America/Lima).",
              '',
              '| Organization | Created (UTC) | Public repos |',
              '|---|---:|---:|',
          ]
          for row in recent:
              lines.append(f"| `{row['login']}` | {row['created_at']} | {row['public_repos']} |")
          lines += ['', '> `public_repos` excludes private repositories; use installation-scoped inventory for provisioning status.', '']
          (output / 'recent-github-orgs-2026-08-01.md').write_text('\n'.join(lines))
          PY
      - name: Commit generated audit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/recent-github-orgs-2026-08-01.*
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "audit: record exact recent organization creation dates"
          git push origin HEAD:audit/recent-orgs-2026-08-01
