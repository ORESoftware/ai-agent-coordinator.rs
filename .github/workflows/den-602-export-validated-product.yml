name: Export DEN-602 validated product tree

on:
  push:
    branches:
      - agent/den-602-github-admin-browser-hardening
    paths:
      - '.github/workflows/den-602-export-validated-product.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '.github/workflows/den-602-export-validated-product.yml'

permissions:
  contents: read

concurrency:
  group: den-602-export-validated-product
  cancel-in-progress: false

jobs:
  export:
    if: >-
      github.repository == 'ORESoftware/ai-agent-coordinator.rs' &&
      (github.event_name == 'push' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.head_ref == 'agent/den-602-github-admin-browser-hardening'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the exact hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/den-602-github-admin-browser-hardening
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Refuse stale or retargeted export
        shell: bash
        run: |
          set -euo pipefail
          expected_main='ae2f12e760b5f78326b8cef5ed301f066229ebd5'
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$expected_main"
          test "$(git merge-base HEAD origin/main)" = "$expected_main"
          test "$(git branch --show-current)" = 'agent/den-602-github-admin-browser-hardening'
          test -z "$(git status --porcelain)"

      - name: Validate exporter workflow
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/den-602-export-validated-product.yml

      - name: Verify and apply the reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          encoded="$RUNNER_TEMP/den602.patch.gz.b64"
          archive="$RUNNER_TEMP/den602.patch.gz"
          patch="$RUNNER_TEMP/den602.patch"
          cat .github/staging/den602.patch.gz.b64.part-* > "$encoded"
          base64 --decode "$encoded" > "$archive"
          printf '%s  %s\n' \
            'a1e489042a71c2ffba0b28b18197e8c4069fea9b478086d365e6f76feb8cac2b' \
            "$archive" | sha256sum --check --strict -
          gzip --decompress --stdout "$archive" > "$patch"
          printf '%s  %s\n' \
            '8b649d9c1e0cffe9162d47d70313544d376e19842c39d191a7f1ae7dd842127f' \
            "$patch" | sha256sum --check --strict -
          git apply --3way "$patch"
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('src/github_admin.rs')
          source = source_path.read_text(encoding='utf-8')
          old_source = (
              "    RepositoryCreationResult {\n"
              "        dry_run: false,\n"
              "        created,\n"
              "        existing,\n"
              "        full_name: repository.full_name,\n"
              "        visibility: request.visibility,\n"
              "        initialization: request.initialization,\n"
              "        description: request.description,\n"
              "        api_url,\n"
              "        html_url: canonical_repository_html_url(api_base_url, &repository.full_name),\n"
          )
          new_source = (
              "    let html_url = canonical_repository_html_url(api_base_url, &repository.full_name);\n"
              "    RepositoryCreationResult {\n"
              "        dry_run: false,\n"
              "        created,\n"
              "        existing,\n"
              "        full_name: repository.full_name,\n"
              "        visibility: request.visibility,\n"
              "        initialization: request.initialization,\n"
              "        description: request.description,\n"
              "        api_url,\n"
              "        html_url,\n"
          )
          if source.count(old_source) != 1:
              raise SystemExit('repository result ownership repair anchor drifted')
          source_path.write_text(source.replace(old_source, new_source, 1), encoding='utf-8')

          workflow_path = Path('.github/workflows/github-repository-admin-browser.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          old_artifact_env = (
              "      PLAYWRIGHT_ARTIFACT_DIR: $"
              + "{{ runner.temp }}/github-repository-admin-browser\n"
          )
          old_init = (
              "          umask 077\n"
              "          mkdir -p \"$PLAYWRIGHT_ARTIFACT_DIR\"\n"
              "          chmod 700 \"$PLAYWRIGHT_ARTIFACT_DIR\"\n"
          )
          new_init = (
              "          umask 077\n"
              "          artifact_dir=\"$RUNNER_TEMP/github-repository-admin-browser\"\n"
              "          mkdir -p \"$artifact_dir\"\n"
              "          chmod 700 \"$artifact_dir\"\n"
              "          echo \"PLAYWRIGHT_ARTIFACT_DIR=$artifact_dir\" >> \"$GITHUB_ENV\"\n"
          )
          if workflow.count(old_artifact_env) != 1 or workflow.count(old_init) != 1:
              raise SystemExit('browser artifact-directory repair anchor drifted')
          workflow = workflow.replace(old_artifact_env, '', 1)
          workflow = workflow.replace(old_init, new_init, 1)
          workflow_path.write_text(workflow, encoding='utf-8')
          PY

      - name: Install the pinned Rust validation toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.97.1'
          components: rustfmt, clippy

      - name: Reproduce the exact validated product tree
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked github_admin -- --nocapture
          python3 -m py_compile tests/browser/test_github_repository_admin.py
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo" \
            --workdir /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            .github/workflows/ci.yml \
            .github/workflows/github-repository-admin-browser.yml \
            .github/workflows/den-602-materialize-hardening.yml \
            .github/workflows/den-602-export-validated-product.yml
          rm -rf .github/staging
          rm .github/workflows/den-602-materialize-hardening.yml
          rm .github/workflows/den-602-export-validated-product.yml
          git add -A
          git diff --cached --check
          test "$(git write-tree)" = '56c2ca97aa9d907043e817257c4d3bf75bae905c'

      - name: Archive the exact product files
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/den602-validated-product.tar.gz" \
            .cli-flags.toml \
            .env.example \
            .github/workflows/ci.yml \
            .github/workflows/github-repository-admin-browser.yml \
            deploy/k8s/deployment.yaml \
            docs/cli-flags.md \
            docs/github-repository-administration-security.md \
            src/github_admin.rs \
            tests/browser/__init__.py \
            tests/browser/github-admin-coordinator.yaml \
            tests/browser/requirements.txt \
            tests/browser/test_github_repository_admin.py
          sha256sum "$RUNNER_TEMP/den602-validated-product.tar.gz" \
            > "$RUNNER_TEMP/den602-validated-product.tar.gz.sha256"

      - name: Upload the validated product tree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: den602-validated-product-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/den602-validated-product.tar.gz
            ${{ runner.temp }}/den602-validated-product.tar.gz.sha256
          retention-days: 1
          if-no-files-found: error
