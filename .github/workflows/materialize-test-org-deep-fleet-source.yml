name: Materialize reviewed deep-fleet source bundle

on:
  push:
    branches:
      - agent/deep-test-org-fleet-20260808
    paths:
      - .github/repository-bootstrap-source/deep-test-fleet-source-payload.json

permissions:
  contents: write

concurrency:
  group: materialize-test-org-deep-fleet-source
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out one-time staging branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: ''

      - name: Verify and materialize exact source archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import io
          import json
          import os
          import tarfile
          import tempfile
          from pathlib import Path, PurePosixPath

          payload_path = Path('.github/repository-bootstrap-source/deep-test-fleet-source-payload.json')
          payload = json.loads(payload_path.read_text())
          required = {
              'schema_version',
              'operation',
              'archive_sha256',
              'archive_b64_sha256',
              'part_count',
              'part_prefix',
          }
          if set(payload) != required:
              raise SystemExit('unexpected source payload keys')
          if payload['schema_version'] != 1 or payload['operation'] != 'deep-test-fleet-20260808':
              raise SystemExit('source payload identity drift')
          if payload['part_prefix'] != '.github/repository-bootstrap-source/deep-test-fleet-source-payload.part':
              raise SystemExit('source payload prefix drift')
          part_count = payload['part_count']
          if not isinstance(part_count, int) or not 1 <= part_count <= 20:
              raise SystemExit('source payload part count is outside bounds')
          part_paths = [Path(f"{payload['part_prefix']}{index:02d}") for index in range(part_count)]
          if any(not path.is_file() or path.stat().st_size > 6_000 for path in part_paths):
              raise SystemExit('source payload part is missing or exceeds bounds')
          archive_b64 = ''.join(path.read_text() for path in part_paths)
          if hashlib.sha256(archive_b64.encode()).hexdigest() != payload['archive_b64_sha256']:
              raise SystemExit('source payload base64 digest mismatch')
          archive = base64.b64decode(archive_b64, validate=True)
          if hashlib.sha256(archive).hexdigest() != payload['archive_sha256']:
              raise SystemExit('source archive digest mismatch')
          if len(archive) > 100_000:
              raise SystemExit('source archive exceeds bound')

          expected = {
              '.github/workflows/live-test-org-deep-fleet-bootstrap.yml',
              '.github/workflows/test-org-deep-fleet-contract.yml',
              'docs/test-org-deep-fleet-bootstrap-2026-08-08.md',
              'repository-fleets/test-org-deep-fleets.json',
              'scripts/bootstrap_test_org_deep_fleets_live.py',
              'scripts/deep_test_fleet_templates.py',
              'scripts/test_test_org_deep_fleets.py',
          }
          raw_tar = gzip.decompress(archive)
          with tempfile.TemporaryDirectory(prefix='deep-fleet-source-') as raw:
              root = Path(raw)
              with tarfile.open(fileobj=io.BytesIO(raw_tar), mode='r:') as bundle:
                  names = set(bundle.getnames())
                  if names != expected:
                      raise SystemExit(f'archive path set drift: {sorted(names ^ expected)}')
                  for member in bundle.getmembers():
                      path = PurePosixPath(member.name)
                      if not member.isfile() or path.is_absolute() or '..' in path.parts:
                          raise SystemExit(f'unsafe archive member: {member.name}')
                      if member.size > 100_000:
                          raise SystemExit(f'archive member exceeds bound: {member.name}')
                      source = bundle.extractfile(member)
                      if source is None:
                          raise SystemExit(f'missing archive data: {member.name}')
                      destination = root / member.name
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      destination.write_bytes(source.read())
              for relative in sorted(expected):
                  source = root / relative
                  destination = Path(relative)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  temporary = destination.with_suffix(destination.suffix + '.materializing')
                  temporary.write_bytes(source.read_bytes())
                  os.replace(temporary, destination)
              for script in (
                  Path('scripts/bootstrap_test_org_deep_fleets_live.py'),
                  Path('scripts/deep_test_fleet_templates.py'),
                  Path('scripts/test_test_org_deep_fleets.py'),
              ):
                  script.chmod(0o755)
          PY

      - name: Apply bounded repository-layout correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path

          path = Path('scripts/test_test_org_deep_fleets.py')
          old_digest = '055f45d96072ac5e1291197abcd5f14e6bdd0f54910a37111970750db2e7156c'
          new_digest = '3e6e6d2de8cf56589b5214f850c38380d62d0ffe186feca334f2df5137aba871'
          old = (
              'ROOT = Path(__file__).resolve().parent\n'
              'MANIFEST = ROOT / "test-org-deep-fleets.json"\n'
          )
          new = (
              'ROOT = Path(__file__).resolve().parents[1]\n'
              'MANIFEST = ROOT / "repository-fleets" / "test-org-deep-fleets.json"\n'
          )
          content = path.read_text()
          if hashlib.sha256(content.encode()).hexdigest() != old_digest:
              raise SystemExit('unexpected pre-correction test-source digest')
          if content.count(old) != 1:
              raise SystemExit('repository-layout correction anchor drift')
          corrected = content.replace(old, new)
          if hashlib.sha256(corrected.encode()).hexdigest() != new_digest:
              raise SystemExit('unexpected post-correction test-source digest')
          path.write_text(corrected)
          PY

      - name: Validate materialized publisher and every foundation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/deep_test_fleet_templates.py \
            scripts/bootstrap_test_org_deep_fleets_live.py \
            scripts/test_test_org_deep_fleets.py
          PYTHONPATH=scripts python -m unittest -v scripts/test_test_org_deep_fleets.py
          PYTHONPATH=scripts python scripts/bootstrap_test_org_deep_fleets_live.py \
            --manifest repository-fleets/test-org-deep-fleets.json \
            --validate-only
          credential_pattern='gh[pousr]_[A-Za-z0-9]{20,}|lin_'"'"'api_[A-Za-z0-9]{20,}|BEGIN [A-Z ]*PRIVATE KEY'
          files=(
            repository-fleets/test-org-deep-fleets.json
            scripts/deep_test_fleet_templates.py
            scripts/bootstrap_test_org_deep_fleets_live.py
            scripts/test_test_org_deep_fleets.py
            docs/test-org-deep-fleet-bootstrap-2026-08-08.md
            .github/workflows/test-org-deep-fleet-contract.yml
            .github/workflows/live-test-org-deep-fleet-bootstrap.yml
          )
          if grep -nE "$credential_pattern" "${files[@]}"; then
            echo 'Credential-shaped source is forbidden.' >&2
            exit 1
          fi
          if grep -nE '^(<{7}|={7}|>{7})' "${files[@]}"; then
            echo 'Conflict markers are forbidden.' >&2
            exit 1
          fi

      - name: Commit reviewed source and retire materializer
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/repository-bootstrap-source/deep-test-fleet-source-payload.json \
            .github/repository-bootstrap-source/deep-test-fleet-source-payload.part* \
            .github/workflows/materialize-test-org-deep-fleet-source.yml
          rmdir .github/repository-bootstrap-source 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: stage exact deep-test fleet publisher and relay'
          git push origin "HEAD:${GITHUB_REF_NAME}"
