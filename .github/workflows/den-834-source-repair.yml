name: DEN-834 source repair

on:
  push:
    branches:
      - agent/den-834-prompt-intake-dry-run

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/den-834-prompt-intake-dry-run
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.97.0'
          components: rustfmt, clippy
      - name: Apply bounded semantic repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/prompt_intake.rs')
          text = path.read_text()

          old_call = '''        decisions.push(decide_prompt(
              export,
              prompt,
              source_identity,
              &catalog_index,
          ));'''
          new_call = '''        decisions.push(decide_prompt(
              prompt,
              source_identity,
              &catalog_index,
          ));'''
          if old_call not in text:
              raise SystemExit('expected decide_prompt call was not found')
          text = text.replace(old_call, new_call, 1)

          old_signature = '''fn decide_prompt(
              export: &PromptExport,
              prompt: &PromptRecord,'''
          new_signature = '''fn decide_prompt(
              prompt: &PromptRecord,'''
          if old_signature not in text:
              raise SystemExit('expected decide_prompt signature was not found')
          text = text.replace(old_signature, new_signature, 1)

          old_stop_words = '''            "about", "after", "again", "also", "been", "before", "being", "branch",
              "chat", "check", "could", "from", "have", "into", "issue", "linear", "make",'''
          new_stop_words = '''            "about", "after", "again", "also", "been", "before", "being", "branch",
              "chat", "check", "could", "day", "days", "from", "have", "hour", "hours",
              "into", "issue", "linear", "make",'''
          if old_stop_words not in text:
              raise SystemExit('expected stop-word block was not found')
          text = text.replace(old_stop_words, new_stop_words, 1)

          old_then = '''            (source_identities.len() > 1).then(|| DuplicateGroup {
                  content_fingerprint: fingerprint.to_owned(),
                  source_identities,
              })'''
          new_then = '''            (source_identities.len() > 1).then_some(DuplicateGroup {
                  content_fingerprint: fingerprint.to_owned(),
                  source_identities,
              })'''
          if old_then not in text:
              raise SystemExit('expected duplicate grouping expression was not found')
          text = text.replace(old_then, new_then, 1)

          path.write_text(text)
          PY
      - name: Format and validate
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all
      - name: Remove one-shot workflow and publish repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/den-834-source-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/prompt_intake.rs .github/workflows/den-834-source-repair.yml
          git diff --cached --check
          git commit -m 'fix(DEN-834): stabilize refinement grouping and formatting'
          git push origin HEAD:agent/den-834-prompt-intake-dry-run
