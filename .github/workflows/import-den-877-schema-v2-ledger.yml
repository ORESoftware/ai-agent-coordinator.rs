name: Import reviewed DEN-877 schema-v2 ledger

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: den-877-ledger-import-${{ github.ref }}
  cancel-in-progress: true

jobs:
  import-ledger:
    if: github.head_ref == 'agent/den-877-fleet-merge-repair-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out clean replacement branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/den-877-fleet-merge-repair-v2
          fetch-depth: 0
      - name: Import only the reviewed schema-v2 ledger from the superseded branch
        shell: bash
        run: |
          set -euo pipefail
          git show \
            origin/agent/den-877-fleet-merge-repair:repository-fleets/hypesiege-streempilot.json \
            > repository-fleets/hypesiege-streempilot.json
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('repository-fleets/hypesiege-streempilot.json')
          manifest = json.loads(path.read_text(encoding='utf-8'))
          assert manifest['schema_version'] == 2
          assert manifest['repository_count'] == 32
          assert manifest['total_tracked_files'] == 888
          assert manifest['total_gitlinks'] == 30
          assert manifest['organizations'] == {'hypesiege': 15, 'streempilot': 17}
          assert len(manifest['repositories']) == 32
          assert all('gitlinks' in record for record in manifest['repositories'])
          assert all(len(record['commit']) == 40 for record in manifest['repositories'])
          PY
          rm .github/workflows/import-den-877-schema-v2-ledger.yml
          git diff --check
      - name: Commit reviewed ledger onto current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "DEN-877 import reviewed schema-v2 fleet ledger"
          git push origin "HEAD:agent/den-877-fleet-merge-repair-v2"
