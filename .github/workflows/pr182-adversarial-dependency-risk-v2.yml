name: one-shot PR 182 adversarial dependency-risk tests v2

on:
  push:
    branches:
      - feat/den-3449-dependency-risk-envelope-2026-09-03

permissions:
  contents: write

concurrency:
  group: one-shot-pr182-adversarial-dependency-risk-v2
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/den-3449-dependency-risk-envelope-2026-09-03
          fetch-depth: 0

      - name: replay the reviewed patch with non-semver pin semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path(".github/workflows/pr182-adversarial-dependency-risk.yml")
          source = workflow.read_text(encoding="utf-8")
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = source.find(start_marker)
          if start < 0:
              raise SystemExit("reviewed patch script start marker missing")
          start += len(start_marker)
          end = source.find(end_marker, start)
          if end < 0:
              raise SystemExit("reviewed patch script end marker missing")
          script = textwrap.dedent(source[start:end])

          needle = """fn inconsistent_change_evidence(input: &DependencyRiskInput) -> bool {
              let manifest_changed = matches!("""
          replacement = """fn inconsistent_change_evidence(input: &DependencyRiskInput) -> bool {
              if matches!(
                  input.ecosystem,
                  Some(Ecosystem::GitSubmodule | Ecosystem::ZedPackage)
              ) {
                  return false;
              }

              let manifest_changed = matches!("""
          if script.count(needle) != 1:
              raise SystemExit(
                  f"expected one semantic-version guard target, found {script.count(needle)}"
              )
          script = script.replace(needle, replacement, 1)
          exec(compile(script, str(workflow), "exec"), {"__name__": "__main__"})
          PY

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      - name: format, lint, and test exact branch
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features
          cargo doc --locked --no-deps
          git diff --check

      - name: commit the tested changes and remove both one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr182-adversarial-dependency-risk.yml
          rm .github/workflows/pr182-adversarial-dependency-risk-v2.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dependency_risk.rs \
            .github/workflows/pr182-adversarial-dependency-risk.yml \
            .github/workflows/pr182-adversarial-dependency-risk-v2.yml
          git commit -m "test: block contradictory and unbounded dependency evidence"
          git push origin HEAD:feat/den-3449-dependency-risk-envelope-2026-09-03
