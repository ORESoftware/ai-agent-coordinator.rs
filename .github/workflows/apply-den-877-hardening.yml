name: Apply audited DEN-877 hardening payload

on:
  push:
    branches:
      - agent/den-877-fleet-publisher-hardening
    paths:
      - repository-fleets/hypesiege-streempilot/den877-hardening.trigger

permissions:
  contents: write

concurrency:
  group: apply-den-877-hardening
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.repository == 'ORESoftware/ai-agent-coordinator.rs' &&
      github.event.head_commit.message == 'chore(DEN-877): stage audited hardening payload'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the exact hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/den-877-fleet-publisher-hardening
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Verify and extract the reviewed payload
        shell: bash
        run: |
          set -euo pipefail
          payload_dir='repository-fleets/hypesiege-streempilot'
          encoded="$RUNNER_TEMP/den877-hardening.tar.gz.b64"
          archive="$RUNNER_TEMP/den877-hardening.tar.gz"
          staging="$RUNNER_TEMP/den877-hardening"
          parts=(
            "$payload_dir/den877-hardening.tar.gz.b64.part-00"
            "$payload_dir/den877-hardening.tar.gz.b64.part-01"
            "$payload_dir/den877-hardening.tar.gz.b64.part-02"
            "$payload_dir/den877-hardening.tar.gz.b64.part-03"
            "$payload_dir/den877-hardening.tar.gz.b64.part-04"
          )
          for part in "${parts[@]}"; do
            test -s "$part"
          done
          cat "${parts[@]}" > "$encoded"
          printf '%s  %s\n' \
            'c38153b78d9556fe0266ba9b53a3216ad1c216654aa4f495cb8e72e0f02181c7' \
            "$encoded" | sha256sum --check --strict -
          base64 --decode "$encoded" > "$archive"
          printf '%s  %s\n' \
            'ec6d3a51b1d32e191b94237582a52af058e49b61b1fae873e2e0ec41d402ff39' \
            "$archive" | sha256sum --check --strict -
          mkdir -p "$staging"
          ARCHIVE="$archive" STAGING="$staging" python - <<'PY'
          from __future__ import annotations

          import os
          import pathlib
          import tarfile

          archive = pathlib.Path(os.environ['ARCHIVE'])
          staging = pathlib.Path(os.environ['STAGING'])
          allowed = {
              'scripts/publish_hypesiege_streempilot_fleet.py',
              'scripts/test_publish_hypesiege_streempilot_fleet.py',
              'scripts/test_hypesiege_streempilot_publisher_hardening.py',
              'scripts/render_hypesiege_streempilot_plan.py',
              'scripts/test_hypesiege_streempilot_plan_browser.py',
              'docs/hypesiege-streempilot-publisher-hardening.md',
          }
          with tarfile.open(archive, mode='r:gz') as bundle:
              members = bundle.getmembers()
              names = {member.name for member in members}
              if names != allowed:
                  raise SystemExit(f'payload path set drifted: {sorted(names ^ allowed)}')
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  if not member.isfile() or path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe payload member: {member.name}')
                  if member.size > 128 * 1024:
                      raise SystemExit(f'payload member is unexpectedly large: {member.name}')
              bundle.extractall(staging, filter='data')
          PY
          for path in \
            scripts/publish_hypesiege_streempilot_fleet.py \
            scripts/test_publish_hypesiege_streempilot_fleet.py \
            scripts/test_hypesiege_streempilot_publisher_hardening.py \
            scripts/render_hypesiege_streempilot_plan.py \
            scripts/test_hypesiege_streempilot_plan_browser.py \
            docs/hypesiege-streempilot-publisher-hardening.md; do
            install -D -m 0644 "$staging/$path" "$path"
          done
          chmod 0755 \
            scripts/publish_hypesiege_streempilot_fleet.py \
            scripts/render_hypesiege_streempilot_plan.py

      - name: Validate the hardened publisher before committing it
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/reconstruct_hypesiege_streempilot_fleet.py \
            scripts/publish_hypesiege_streempilot_fleet.py \
            scripts/test_publish_hypesiege_streempilot_fleet.py \
            scripts/test_hypesiege_streempilot_publisher_hardening.py \
            scripts/render_hypesiege_streempilot_plan.py \
            scripts/test_hypesiege_streempilot_plan_browser.py
          python -m unittest -v \
            scripts/test_publish_hypesiege_streempilot_fleet.py \
            scripts/test_hypesiege_streempilot_publisher_hardening.py
          python scripts/render_hypesiege_streempilot_plan.py \
            --output "$RUNNER_TEMP/hypesiege-streempilot-plan.html"
          test -s "$RUNNER_TEMP/hypesiege-streempilot-plan.html"
          git diff --check

      - name: Commit only the audited product and test files
        shell: bash
        run: |
          set -euo pipefail
          rm \
            repository-fleets/hypesiege-streempilot/den877-hardening.trigger \
            repository-fleets/hypesiege-streempilot/den877-hardening.tar.gz.b64.part-00 \
            repository-fleets/hypesiege-streempilot/den877-hardening.tar.gz.b64.part-01 \
            repository-fleets/hypesiege-streempilot/den877-hardening.tar.gz.b64.part-02 \
            repository-fleets/hypesiege-streempilot/den877-hardening.tar.gz.b64.part-03 \
            repository-fleets/hypesiege-streempilot/den877-hardening.tar.gz.b64.part-04
          git add \
            scripts/publish_hypesiege_streempilot_fleet.py \
            scripts/test_publish_hypesiege_streempilot_fleet.py \
            scripts/test_hypesiege_streempilot_publisher_hardening.py \
            scripts/render_hypesiege_streempilot_plan.py \
            scripts/test_hypesiege_streempilot_plan_browser.py \
            docs/hypesiege-streempilot-publisher-hardening.md \
            repository-fleets/hypesiege-streempilot/den877-hardening.trigger \
            repository-fleets/hypesiege-streempilot/den877-hardening.tar.gz.b64.part-00 \
            repository-fleets/hypesiege-streempilot/den877-hardening.tar.gz.b64.part-01 \
            repository-fleets/hypesiege-streempilot/den877-hardening.tar.gz.b64.part-02 \
            repository-fleets/hypesiege-streempilot/den877-hardening.tar.gz.b64.part-03 \
            repository-fleets/hypesiege-streempilot/den877-hardening.tar.gz.b64.part-04
          git diff --cached --check
          git config user.name 'ORESoftware'
          git config user.email '11139560+ORESoftware@users.noreply.github.com'
          git commit -m 'fix(DEN-877): harden fleet publication trust boundaries'
          git push origin HEAD:agent/den-877-fleet-publisher-hardening
