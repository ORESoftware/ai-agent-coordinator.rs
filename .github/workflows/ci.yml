name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate GitHub Actions
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/ci.yml
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.97.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        id: test
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --all 2>&1 | tee test-output.log
      - name: Upload failing test output
        if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-test-output
          path: test-output.log
          retention-days: 1
          if-no-files-found: error
      - name: Documentation
        run: cargo doc --locked --no-deps
      - name: Release build
        run: cargo build --locked --release

  flags-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout coordinator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Checkout pinned flags-2-env source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ORESoftware/flags-2-env
          ref: 7f72052994c71e68bcb28c322f0c2e3bac54e544
          path: vendor/flags-2-env
          persist-credentials: false
      - name: Build pinned flags2env
        run: make -B -C vendor/flags-2-env all
      - name: Audit the non-secret CLI contract
        env:
          FLAGS2ENV_BIN: ${{ github.workspace }}/vendor/flags-2-env/build/flags2env
        run: bash scripts/with-flags audit
      - name: Verify representative CLI-to-environment mappings
        env:
          FLAGS2ENV_BIN: ${{ github.workspace }}/vendor/flags-2-env/build/flags2env
        run: |
          bash scripts/with-flags \
            --config=coordinator.example.yaml \
            --json-logs=true \
            --repository-admin-enabled=false \
            --repository-admin-allowed-orgs=fiducia-cloud,sonus-auris \
            --github-api-base-url=https://api.github.com \
            --github-api-version=2022-11-28 \
            --github-api-user-agent=ai-agent-coordinator-ci \
            --rust-log=warn \
            -- bash -euo pipefail -c '
              test "$COORDINATOR_CONFIG" = "coordinator.example.yaml"
              test "$COORDINATOR_JSON_LOGS" = "true"
              test "$GITHUB_REPOSITORY_ADMIN_ENABLED" = "false"
              test "$GITHUB_REPOSITORY_ADMIN_ALLOWED_ORGS" = "fiducia-cloud,sonus-auris"
              test "$GITHUB_API_BASE_URL" = "https://api.github.com"
              test "$GITHUB_API_VERSION" = "2022-11-28"
              test "$GITHUB_API_USER_AGENT" = "ai-agent-coordinator-ci"
              test "$RUST_LOG" = "warn"
            '
      - name: Prove secret command-line flags are rejected
        env:
          FLAGS2ENV_BIN: ${{ github.workspace }}/vendor/flags-2-env/build/flags2env
        shell: bash
        run: |
          set +e
          output="$(bash scripts/with-flags --coordinator-api-token=must-not-be-accepted -- true 2>&1)"
          status=$?
          set -e
          test "$status" -eq 64
          ! grep -Fq 'must-not-be-accepted' <<<"$output"

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd # v2
        with:
          tool: cargo-audit@0.22.2
      - name: Dependency audit
        run: cargo audit --deny warnings
