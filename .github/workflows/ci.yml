name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flags2env:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check out pinned flags-2-env source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ORESoftware/flags-2-env
          ref: 0c7c1ab91fa55aadab4be9a61c3b5dd3b963201d
          path: tools/flags-2-env
          persist-credentials: false
      - name: Build pinned flags2env CLI
        run: make -C tools/flags-2-env all
      - name: Audit CLI-to-environment contract
        run: tools/flags-2-env/build/flags2env audit .cli-flags.toml
      - name: Verify representative exports and strict parsing
        shell: bash
        env:
          FLAGS2ENV_BIN: ${{ github.workspace }}/tools/flags-2-env/build/flags2env
        run: |
          set -euo pipefail
          bash scripts/with-flags2env.sh \
            --config=/tmp/coordinator-ci.yaml \
            --json-logs \
            --log-filter=ai_agent_coordinator=debug,tower_http=info \
            --github-repository-admin-enabled=false \
            --github-repository-admin-allowed-orgs=declarative-migrations,rust-ssr-demos \
            --github-api-user-agent=ai-agent-coordinator-ci \
            -- \
            bash -eu -o pipefail -c '
              test "$COORDINATOR_CONFIG" = /tmp/coordinator-ci.yaml
              test "$COORDINATOR_JSON_LOGS" = true
              test "$RUST_LOG" = ai_agent_coordinator=debug,tower_http=info
              test "$GITHUB_REPOSITORY_ADMIN_ENABLED" = false
              test "$GITHUB_REPOSITORY_ADMIN_ALLOWED_ORGS" = declarative-migrations,rust-ssr-demos
              test "$GITHUB_API_BASE_URL" = https://api.github.com
              test "$GITHUB_API_VERSION" = 2022-11-28
              test "$GITHUB_API_USER_AGENT" = ai-agent-coordinator-ci
              test -z "${COORDINATOR_API_TOKEN+x}"
              test -z "${GITHUB_WEBHOOK_SECRET+x}"
              test -z "${GITHUB_REPOSITORY_ADMIN_TOKEN+x}"
            '

          if bash scripts/with-flags2env.sh --not-a-declared-option -- true; then
            echo "unknown flags must fail closed" >&2
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate GitHub Actions
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/ci.yml
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.97.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        id: test
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --all 2>&1 | tee test-output.log
      - name: Upload failing test output
        if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-test-output
          path: test-output.log
          retention-days: 1
          if-no-files-found: error
      - name: Release build
        run: cargo build --locked --release

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd # v2
        with:
          tool: cargo-audit@0.22.2
      - name: Dependency audit
        run: cargo audit --deny warnings
