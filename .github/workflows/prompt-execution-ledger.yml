name: Prompt execution ledger

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prompt-execution-ledger.yml'
      - 'docs/prompt-execution-ledger-*.md'
      - 'fixtures/prompt-execution-ledger-*.json'
      - 'scripts/prompt_execution_ledger*.py'
      - 'scripts/test_validate_prompt_execution_ledger.py'
      - 'scripts/validate_prompt_execution_ledger.py'
  pull_request:
    paths:
      - '.github/workflows/prompt-execution-ledger.yml'
      - 'docs/prompt-execution-ledger-*.md'
      - 'fixtures/prompt-execution-ledger-*.json'
      - 'scripts/prompt_execution_ledger*.py'
      - 'scripts/test_validate_prompt_execution_ledger.py'
      - 'scripts/validate_prompt_execution_ledger.py'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate this workflow
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo" \
            --workdir /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            .github/workflows/prompt-execution-ledger.yml

      - name: Compile validators and tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/prompt_execution_ledger.py \
            scripts/prompt_execution_ledger_validation.py \
            scripts/validate_prompt_execution_ledger.py \
            scripts/test_validate_prompt_execution_ledger.py

      - name: Run adversarial unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v scripts/test_validate_prompt_execution_ledger.py

      - name: Verify planning receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_prompt_execution_ledger.py \
            fixtures/prompt-execution-ledger-2026-09-03.json \
            --mode planning --json > planning-report.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("planning-report.json").read_text(encoding="utf-8"))
          assert report["valid"] is True
          assert report["closure_ready"] is False
          assert report["workstream_count"] == 15
          assert report["incomplete_segments"] == [
              "chat-2026-08-25-through-2026-09-04"
          ]
          assert report["ledger_sha256"] == (
              "e2ea566eb781b3a7174be4ec2ab06f5c5cb6c4c2047375d9ca541264952117c1"
          )
          PY

      - name: Prove closure fails closed while source evidence is incomplete
        shell: bash
        run: |
          set -uo pipefail
          status=0
          python3 scripts/validate_prompt_execution_ledger.py \
            fixtures/prompt-execution-ledger-2026-09-03.json \
            --mode closure --json > closure-report.json || status=$?
          test "$status" -eq 3
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("closure-report.json").read_text(encoding="utf-8"))
          assert report["valid"] is False
          assert report["closure_ready"] is False
          assert report["errors"] == [
              "closure mode requires complete source coverage and zero blockers"
          ]
          PY

      - name: Require an unchanged tracked worktree
        shell: bash
        run: git diff --exit-code
