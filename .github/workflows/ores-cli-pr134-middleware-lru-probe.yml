name: ores-cli PR134 exact-source Middleware LRU probe

on:
  pull_request:
    paths:
      - "evidence/ores-cli-pr134/**"
      - ".github/workflows/ores-cli-pr134-middleware-lru-probe.yml"
  push:
    branches:
      - DEN-390-ores-cli-pr134-middleware-lru-probe
    paths:
      - "evidence/ores-cli-pr134/**"
      - ".github/workflows/ores-cli-pr134-middleware-lru-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify revision, exact product blobs, and clean conflict state
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git hash-object evidence/ores-cli-pr134/src/audit/runtime_toml_middleware.rs)" = "bc0aaba10a37e93fea3fb6a359c2b088484e1f76"
          test "$(git hash-object evidence/ores-cli-pr134/src/audit/runtime_toml_lru.rs)" = "82da6c6971f21f4111aa4267190649a5ac204bab"
          git diff --check
          status=0
          git grep -n -I -E '^(<<<<<<< .+|=======|>>>>>>> .+)$' -- evidence/ores-cli-pr134 || status=$?
          test "$status" -eq 1
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy
      - name: Verify formatting
        run: cargo fmt --manifest-path evidence/ores-cli-pr134/Cargo.toml --all -- --check
      - name: Compile all targets
        run: cargo check --manifest-path evidence/ores-cli-pr134/Cargo.toml --all-targets
      - name: Run exact-source tests
        run: cargo test --manifest-path evidence/ores-cli-pr134/Cargo.toml --all-targets
      - name: Reject Clippy warnings
        run: cargo clippy --manifest-path evidence/ores-cli-pr134/Cargo.toml --all-targets -- -D warnings
