name: DEN-2334 format and validate delivery state

on:
  push:
    branches:
      - agent/den-2334-daily-briefing-delivery-state
    paths:
      - '.github/workflows/den-2334-rustfmt.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: den-2334-rustfmt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/den-2334-daily-briefing-delivery-state
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.97.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Apply repository rustfmt
        run: cargo fmt --all
      - name: Compile and run focused regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --test daily_portfolio_delivery_state --no-run
          cargo test --locked --test daily_portfolio_delivery_state -- --nocapture
          cargo clippy --locked --lib --test daily_portfolio_delivery_state -- -D warnings
      - name: Commit only formatted delivery-state source
        shell: bash
        run: |
          set -euo pipefail
          git add \
            src/daily_portfolio_delivery.rs \
            src/lib.rs \
            tests/daily_portfolio_delivery_state.rs
          git diff --cached --check
          test -z "$(git diff --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'rustfmt made no changes' >&2
            exit 1
          fi
          git commit -m 'DEN-2334: format delivery state implementation'
          git push origin HEAD:agent/den-2334-daily-briefing-delivery-state
