name: Rustls lock refresh once

on:
  push:
    branches: [hardening/tracked-ores-lint-prepush]
    paths:
      - '.github/workflows/rustls-lock-refresh-once.yml'

permissions:
  contents: write

concurrency:
  group: rustls-lock-refresh-once-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: hardening/tracked-ores-lint-prepush
          persist-credentials: true
      - name: Refresh only rustls
        run: |
          set -euo pipefail
          cargo update -p rustls --precise 0.23.45
          grep -A3 'name = "rustls"' Cargo.lock | grep -F 'version = "0.23.45"'
          ! grep -A3 'name = "rustls"' Cargo.lock | grep -F 'version = "0.23.42"'
          cargo check --locked --all-targets
      - name: Commit exact lockfile delta
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain -- ':!Cargo.lock')"
          if git diff --quiet -- Cargo.lock; then
            echo 'Cargo.lock already contains rustls 0.23.45'
            exit 0
          fi
          git config user.name 'ores-lock-refresh'
          git config user.email 'noreply@oresoftware.dev'
          git add Cargo.lock
          git commit -m 'fix(security): update rustls to 0.23.45'
          git push origin HEAD:hardening/tracked-ores-lint-prepush
