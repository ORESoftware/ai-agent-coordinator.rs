name: DEN-1610 structural adapter finalizer

on:
  push:
    branches:
      - agent/den-1610-authenticated-adapters-current-main-20260804
    paths:
      - .github/workflows/den-1610-adapter-finalize-v2.yml

permissions:
  contents: write

concurrency:
  group: den-1610-structural-adapter-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact adapter branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1610-authenticated-adapters-current-main-20260804
          fetch-depth: 0
          persist-credentials: true

      - name: Install repository validation toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.97.0'
          components: rustfmt,clippy

      - name: Apply only the structurally identified Clippy correction
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/prompt_reconciliation_adapters.rs')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
          matches = []
          for index in range(len(lines) - 3):
              if (
                  lines[index].strip() == 'envelope'
                  and lines[index + 1].strip() == '.get("data")'
                  and lines[index + 2].strip() == '.cloned()'
                  and lines[index + 3].strip() == '.ok_or_else(|| {'
              ):
                  matches.append(index + 3)
          if len(matches) != 1:
              raise SystemExit(f'expected one GraphQL data conversion, found {len(matches)}')
          target = matches[0]
          indentation = lines[target][: len(lines[target]) - len(lines[target].lstrip())]
          newline = '\n' if lines[target].endswith('\n') else ''
          lines[target] = f'{indentation}.ok_or({{{newline}'
          path.write_text(''.join(lines), encoding='utf-8')

      - name: Format and validate the permanent product tree
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all
          cargo doc --locked --no-deps
          cargo build --locked --release
          git diff --check
          if grep -R --line-number -E '^(<{7}|={7}|>{7})' \
            src tests docs/prompt-reconciliation-adapters.md; then
            echo 'Git conflict markers are forbidden.' >&2
            exit 1
          fi

      - name: Remove helper, commit, and push exact review head
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/den-1610-adapter-finalize-v2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(DEN-1610): format adapters and satisfy strict Clippy'
          git push origin HEAD:agent/den-1610-authenticated-adapters-current-main-20260804
