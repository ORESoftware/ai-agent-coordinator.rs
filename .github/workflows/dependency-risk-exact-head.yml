name: Dependency risk exact-head gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dependency-risk-exact-head.yml'
      - 'src/dependency_risk.rs'
      - 'tests/fixtures/dependency-risk/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - '.github/workflows/dependency-risk-exact-head.yml'
      - 'src/dependency_risk.rs'
      - 'tests/fixtures/dependency-risk/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate this workflow
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo" \
            --workdir /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            .github/workflows/dependency-risk-exact-head.yml

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.97.0'
          components: rustfmt, clippy

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Prove the classifier boundary remains pure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("src/dependency_risk.rs")
          if not path.is_file() or path.is_symlink():
              raise SystemExit("src/dependency_risk.rs must be a regular file")
          raw = path.read_bytes()
          if len(raw) > 512 * 1024:
              raise SystemExit("dependency-risk module exceeds the review bound")
          text = raw.decode("utf-8")
          forbidden = {
              "filesystem": r"\bstd::fs\b|\btokio::fs\b",
              "network": r"\bstd::net\b|\breqwest\b|\bhyper::client\b|\btonic::transport\b",
              "process": r"\bstd::process\b|\btokio::process\b|\bCommand\s*::",
              "environment": r"\bstd::env\b|\benv!\s*\(|\boption_env!\s*\(",
              "clock": r"\bSystemTime\b|\bInstant\b|\bUtc::now\b|\bLocal::now\b",
              "randomness": r"\brand::|\bgetrandom\b|\bUuid::new_v4\b",
              "database": r"\bsea_orm\b|\bsqlx\b|\bdiesel\b",
              "runtime": r"\btokio::spawn\b|\bstd::thread\b",
          }
          failures = [
              name
              for name, pattern in forbidden.items()
              if re.search(pattern, text)
          ]
          if failures:
              raise SystemExit(
                  "dependency-risk classifier crossed purity boundaries: "
                  + ", ".join(sorted(failures))
              )
          # These are the canonical Rust evidence names. Keep this gate aligned
          # with the serialized classifier contract instead of accepting vague
          # aliases such as candidate_head or policy_digest.
          required = (
              "auto_merge_authorized",
              "candidate_head_sha",
              "evidence_head_sha",
              "policy_sha256",
          )
          missing = [token for token in required if token not in text]
          if missing:
              raise SystemExit(
                  "dependency-risk evidence contract is missing: "
                  + ", ".join(missing)
              )
          if not re.search(r"auto_merge_authorized\s*:\s*false\b", text):
              raise SystemExit("auto_merge_authorized must be emitted as false")
          PY

      - name: Verify canonical formatting
        shell: bash
        run: cargo fmt --all -- --check

      - name: Run strict Clippy
        shell: bash
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run dependency-risk tests
        shell: bash
        run: cargo test --locked --all dependency_risk -- --nocapture

      - name: Run the complete repository test gate
        shell: bash
        run: cargo test --locked --all

      - name: Parse canonical dependency-risk fixture corpus
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          path = Path("tests/fixtures/dependency-risk/test-org-canaries.json")
          if not path.is_file() or path.is_symlink():
              raise SystemExit(f"fixture corpus must be a regular file: {path}")
          raw = path.read_bytes()
          if len(raw) > 256 * 1024:
              raise SystemExit(f"fixture corpus exceeds size bound: {path}")
          fixtures = json.loads(raw.decode("utf-8"))
          if not isinstance(fixtures, list) or len(fixtures) < 7:
              raise SystemExit(
                  f"expected at least seven dependency-risk fixture receipts; found {len(fixtures) if isinstance(fixtures, list) else 'non-list'}"
              )
          repositories = []
          ecosystems = []
          for index, fixture in enumerate(fixtures):
              if not isinstance(fixture, dict) or not isinstance(fixture.get("input"), dict):
                  raise SystemExit(f"fixture {index} must contain an input object")
              item = fixture["input"]
              repository = item.get("repository")
              ecosystem = item.get("ecosystem")
              if not isinstance(repository, str) or not repository.endswith("-test/" + repository.split("/", 1)[-1]):
                  # Every canary is intentionally scoped to a test organization.
                  if not isinstance(repository, str) or "-test/" not in repository:
                      raise SystemExit(f"fixture {index} is not scoped to a test org: {repository!r}")
              if not isinstance(ecosystem, str) or not ecosystem:
                  raise SystemExit(f"fixture {index} has no ecosystem")
              repositories.append(repository)
              ecosystems.append(ecosystem)
          if len(set(repositories)) != len(repositories):
              raise SystemExit("dependency-risk fixture repositories must be unique")
          if len(set(ecosystems)) < 7:
              raise SystemExit("dependency-risk corpus must cover at least seven ecosystems")
          print(
              f"validated {len(fixtures)} dependency-risk receipts across {len(set(ecosystems))} ecosystems"
          )
          PY

      - name: Require an unchanged tracked worktree
        shell: bash
        run: git diff --exit-code
