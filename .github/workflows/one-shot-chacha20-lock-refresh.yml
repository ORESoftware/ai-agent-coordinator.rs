name: one-shot chacha20 lock refresh

on:
  push:
    branches:
      - agent/recovery-chacha20-0-10-2
    paths:
      - .github/workflows/one-shot-chacha20-lock-refresh.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select repository Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0

      - name: Resolve the non-yanked compatible release
        shell: bash
        run: |
          set -euo pipefail
          cargo update -p chacha20 --precise 0.10.2
          python3 - <<'PY'
          from pathlib import Path

          lock = Path("Cargo.lock").read_text(encoding="utf-8")
          expected = '''[[package]]
          name = "chacha20"
          version = "0.10.2"
          '''.replace("          ", "")
          if expected not in lock:
              raise SystemExit("Cargo.lock did not resolve chacha20 0.10.2")
          if 'name = "chacha20"\nversion = "0.10.1"' in lock:
              raise SystemExit("yanked chacha20 0.10.1 remains in Cargo.lock")
          PY

      - name: Compile the exact locked graph
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --all-targets

      - name: Export reviewed lockfile candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chacha20-0.10.2-lockfile
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 3
