name: format-den-319

on:
  push:
    branches:
      - agent/den-319-github-repository-bootstrap

permissions:
  contents: write

concurrency:
  group: format-den-319
  cancel-in-progress: true

jobs:
  rustfmt:
    if: github.actor == 'ORESoftware'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/den-319-github-repository-bootstrap
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.97.0'
          components: rustfmt
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Commit formatted files
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src
          git commit -m 'Apply rustfmt to repository bootstrap capability'
          git push origin HEAD:agent/den-319-github-repository-bootstrap
