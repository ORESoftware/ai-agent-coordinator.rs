name: Temporary sealed fleet contract reconciliation

on:
  push:
    branches:
      - fix/hypesiege-api-error-redaction
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact branch state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Remove mutable settings path and preserve fail-closed recertification
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/publish_hypesiege_streempilot_fleet.py')
          source = path.read_text()

          replacements = (
              (
                  'if method not in {"GET", "POST", "PATCH"}:',
                  'if method not in {"GET", "POST"}:',
                  'API method allow-list',
              ),
              (
                  'f"GitHub API unavailable for {method} {path}: "',
                  'f"GitHub API {error.code} for {method} {path}: "',
                  'bounded HTTP error identity',
              ),
              (
                  'return validate_repository_metadata(record, current, require_settings=False), created',
                  'return validate_repository_metadata(\n        record, current, require_settings=not created\n    ), created',
                  'existing repository settings validation',
              ),
          )
          for old, new, label in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one replacement target, found {count}')
              source = source.replace(old, new, 1)

          old_configure = '''def configure_repository(record: dict[str, Any], token: str) -> dict[str, Any]:
              status, current = request_json(
                  "PATCH",
                  f"/repos/{record['full_name']}",
                  token,
                  {
                      "description": record["description"],
                      "default_branch": "main",
                      **REPOSITORY_SETTINGS,
                  },
              )
              if status != 200:
                  raise PublicationError(f"unexpected repository configuration status: {status}")
              return validate_repository_metadata(record, current, require_settings=True)
          '''
          new_configure = '''def configure_repository(record: dict[str, Any], token: str) -> dict[str, Any]:
              """Re-read and certify settings without mutating an existing repository."""
              status, current = request_json(
                  "GET",
                  f"/repos/{record['full_name']}",
                  token,
              )
              if status != 200:
                  raise PublicationError(f"unexpected repository recertification status: {status}")
              return validate_repository_metadata(record, current, require_settings=True)
          '''
          if source.count(old_configure) != 1:
              raise SystemExit('expected exactly one mutable repository configuration function')
          source = source.replace(old_configure, new_configure, 1)

          if '"PATCH"' in source or "'PATCH'" in source:
              raise SystemExit('publisher still contains a PATCH mutation path')
          path.write_text(source)
          PY

      - name: Run every sealed fleet contract
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/publish_hypesiege_streempilot_fleet.py \
            scripts/test_publish_hypesiege_streempilot_fleet.py \
            scripts/test_publish_hypesiege_streempilot_execution.py \
            scripts/test_hypesiege_streempilot_publisher_hardening.py
          python scripts/test_publish_hypesiege_streempilot_fleet.py -v
          python scripts/test_publish_hypesiege_streempilot_execution.py -v
          python -m unittest -v scripts/test_hypesiege_streempilot_publisher_hardening.py

      - name: Commit the focused publisher reconciliation
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/publish_hypesiege_streempilot_fleet.py; then
            echo 'publisher contract is already reconciled'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/publish_hypesiege_streempilot_fleet.py
          git commit -m 'fix(fleet): remove mutable repository settings path'
          git push origin "HEAD:${GITHUB_REF_NAME}"
