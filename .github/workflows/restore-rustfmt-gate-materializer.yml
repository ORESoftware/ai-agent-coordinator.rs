name: Restore canonical Rust formatting gate

on:
  push:
    branches:
      - agent/restore-rustfmt-gate-20260810
    paths:
      - '.github/workflows/restore-rustfmt-gate-materializer.yml'

permissions:
  contents: write

concurrency:
  group: restore-rustfmt-gate-materializer
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.repository == 'ORESoftware/ai-agent-coordinator.rs' &&
      github.ref == 'refs/heads/agent/restore-rustfmt-gate-20260810'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact carrier commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Install pinned Rust formatter
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.0
          components: rustfmt

      - name: Format exact known source and verify scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REPOSITORY" = ORESoftware/ai-agent-coordinator.rs
          test "$GITHUB_REF_NAME" = agent/restore-rustfmt-gate-20260810
          test "$(git hash-object src/bin/prompt-reconciliation-adapter-policy.rs)" = 65554d4ea4c7d80d78e68222e4f4874471e57cce
          cargo fmt --all
          git diff --check
          git status --porcelain=v1 | cut -c4- | LC_ALL=C sort > "$RUNNER_TEMP/actual-changed"
          printf '%s\n' 'src/bin/prompt-reconciliation-adapter-policy.rs' > "$RUNNER_TEMP/expected-changed"
          diff -u "$RUNNER_TEMP/expected-changed" "$RUNNER_TEMP/actual-changed"
          cargo fmt --all --check

      - name: Stage validated formatted bytes outside workflow paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .format-staging/src/bin
          cp src/bin/prompt-reconciliation-adapter-policy.rs .format-staging/src/bin/prompt-reconciliation-adapter-policy.rs
          git checkout -- src/bin/prompt-reconciliation-adapter-policy.rs
          git status --porcelain=v1 --untracked-files=all | cut -c4- | LC_ALL=C sort > "$RUNNER_TEMP/actual-changed"
          printf '%s\n' '.format-staging/src/bin/prompt-reconciliation-adapter-policy.rs' > "$RUNNER_TEMP/expected-changed"
          diff -u "$RUNNER_TEMP/expected-changed" "$RUNNER_TEMP/actual-changed"
          git add .format-staging
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: stage canonical Rust formatting bytes'
          git push origin "HEAD:${GITHUB_REF_NAME}"
