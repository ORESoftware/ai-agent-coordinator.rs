name: ores-cli Chat v2 exact-source probe

on:
  pull_request:
    paths:
      - "evidence/ores-cli-chat-v2/**"
      - ".github/workflows/ores-cli-chat-v2-probe.yml"
  push:
    branches:
      - DEN-390-ores-cli-chat-v2-probe
    paths:
      - "evidence/ores-cli-chat-v2/**"
      - ".github/workflows/ores-cli-chat-v2-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ores-cli-chat-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source bytes and conflict-free state
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          production='evidence/ores-cli-chat-v2/src/audit/runtime_toml_chat.rs'
          tests='evidence/ores-cli-chat-v2/src/audit/runtime_toml_chat_tests.rs'
          test "$(git hash-object "$production")" = '1d067c8a2bd9dcfd79fd5a1a0e996473664e01ef'
          test "$(git hash-object "$tests")" = '6ed6709951ffc59860d29215b1dc8823802e6c02'
          test "$(git hash-object "$production")" = "$(git hash-object --no-filters "$production")"
          test "$(git hash-object "$tests")" = "$(git hash-object --no-filters "$tests")"
          git diff --check
          status=0
          git grep -n -I -E '^(<<<<<<< .+|=======|>>>>>>> .+)$' -- evidence/ores-cli-chat-v2 || status=$?
          test "$status" -eq 1

      - name: Install tested Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy

      - name: Verify canonical formatting
        run: cargo fmt --manifest-path evidence/ores-cli-chat-v2/Cargo.toml --all -- --check

      - name: Compile all targets
        run: cargo check --manifest-path evidence/ores-cli-chat-v2/Cargo.toml --all-targets

      - name: Run exact-source tests
        run: cargo test --manifest-path evidence/ores-cli-chat-v2/Cargo.toml

      - name: Reject Clippy warnings
        run: cargo clippy --manifest-path evidence/ores-cli-chat-v2/Cargo.toml --all-targets -- -D warnings
