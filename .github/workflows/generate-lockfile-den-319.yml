name: generate-lockfile-den-319

on:
  push:
    branches:
      - agent/den-319-github-repository-bootstrap

permissions:
  contents: write

concurrency:
  group: generate-lockfile-den-319
  cancel-in-progress: true

jobs:
  lockfile:
    if: github.actor == 'ORESoftware'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/den-319-github-repository-bootstrap
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.97.0'
      - name: Generate lockfile
        run: cargo generate-lockfile
      - name: Commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            echo 'Cargo.lock is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'Add reproducible dependency lockfile'
          git push origin HEAD:agent/den-319-github-repository-bootstrap
