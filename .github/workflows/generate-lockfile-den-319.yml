name: normalize-den-319

on:
  push:
    branches:
      - agent/den-319-github-repository-bootstrap

permissions:
  contents: write

concurrency:
  group: normalize-den-319
  cancel-in-progress: true

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/den-319-github-repository-bootstrap
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.97.0'
          components: rustfmt
      - name: Normalize sources and lock dependencies
        run: |
          cargo fmt --all
          cargo generate-lockfile
      - name: Commit normalized state
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- src Cargo.lock)" ]]; then
            echo 'Sources and Cargo.lock are already normalized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src Cargo.lock
          git commit -m 'Normalize DEN-319 Rust sources and lock dependencies'
          git push origin HEAD:agent/den-319-github-repository-bootstrap
