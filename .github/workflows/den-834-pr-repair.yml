name: DEN-834 PR repair

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/den-834-pr-repair.yml'
      - 'src/prompt_intake.rs'

permissions:
  contents: write
  pull-requests: read

jobs:
  repair:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.97.0'
          components: rustfmt, clippy
      - name: Apply checksum-gated semantic repair
        shell: bash
        run: |
          set -euo pipefail
          expected_source_blob='bea3b0bfd79ca3c4794439a6c5192f3104e6578f'
          actual_source_blob="$(git hash-object src/prompt_intake.rs)"
          test "$actual_source_blob" = "$expected_source_blob" || {
            echo "refusing repair: expected source blob $expected_source_blob, found $actual_source_blob" >&2
            exit 1
          }
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/prompt_intake.rs')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  "            export,\n            prompt,\n            source_identity,\n",
                  "            prompt,\n            source_identity,\n",
              ),
              (
                  "fn decide_prompt(\n    export: &PromptExport,\n    prompt: &PromptRecord,",
                  "fn decide_prompt(\n    prompt: &PromptRecord,",
              ),
              (
                  ".then(|| DuplicateGroup {",
                  ".then_some(DuplicateGroup {",
              ),
              (
                  '"chat", "check", "could", "from", "have", "into", "issue", "linear", "make",',
                  '"chat", "check", "could", "day", "days", "from", "have", "hour", "hours",\n            "into", "issue", "linear", "make",',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f'expected exactly one source fragment, found {count}: {old[:80]!r}'
                  )
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Format and validate complete Rust suite
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          test "$(git hash-object src/prompt_intake.rs)" = '605a6ead932f95c016b391f18bbaa41ff32c28a4'
          test "$(git hash-object src/bin/prompt-intake.rs)" = '3b8924188474e65903234304c9f2e74e7a1a2ca3'
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all
          cargo doc --locked --no-deps
          cargo build --locked --release
      - name: Remove one-shot carriers and publish repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/den-834-repair-trigger \
            .github/workflows/den-834-source-repair.yml \
            .github/workflows/den-834-pr-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A \
            src/prompt_intake.rs \
            src/bin/prompt-intake.rs \
            .github/den-834-repair-trigger \
            .github/workflows/den-834-source-repair.yml \
            .github/workflows/den-834-pr-repair.yml
          git diff --cached --check
          git commit -m 'fix(DEN-834): stabilize refinement grouping and formatting'
          git push origin HEAD:${{ github.head_ref }}
