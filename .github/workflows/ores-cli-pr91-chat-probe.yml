name: ores-cli PR91 exact-source Chat probe

on:
  pull_request:
    paths:
      - "evidence/ores-cli-pr91/**"
      - ".github/workflows/ores-cli-pr91-chat-probe.yml"
  push:
    branches:
      - DEN-390-ores-cli-pr91-chat-probe
    paths:
      - "evidence/ores-cli-pr91/**"
      - ".github/workflows/ores-cli-pr91-chat-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ores-cli-pr91-chat-probe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify revision, source bytes, and clean conflict state
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          source='evidence/ores-cli-pr91/src/audit/runtime_toml_chat.rs'
          test "$(git hash-object "$source")" = "85fbd2077600f10fc80a5b6f4333d8d65042a2ad"
          test "$(sha256sum "$source" | cut -d' ' -f1)" = "daf6daf1eadaedee2b3debe3fe3a5ae85b84eeb443a648ebbdc8b5a8d74108ab"
          git diff --check
          status=0
          git grep -n -I -E '^(<<<<<<< .+|=======|>>>>>>> .+)$' -- evidence/ores-cli-pr91 || status=$?
          test "$status" -eq 1

      - name: Install the tested Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy

      - name: Verify formatting
        run: cargo fmt --manifest-path evidence/ores-cli-pr91/Cargo.toml --all -- --check

      - name: Compile all targets
        run: cargo check --manifest-path evidence/ores-cli-pr91/Cargo.toml --all-targets

      - name: Run exact-source tests
        run: cargo test --manifest-path evidence/ores-cli-pr91/Cargo.toml

      - name: Reject Clippy warnings
        run: cargo clippy --manifest-path evidence/ores-cli-pr91/Cargo.toml --all-targets -- -D warnings
