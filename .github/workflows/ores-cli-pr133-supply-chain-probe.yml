name: ores-cli PR133 supply-chain exact-source probe

on:
  pull_request:
    paths:
      - "evidence/ores-cli-pr133-supply-chain/**"
      - ".github/workflows/ores-cli-pr133-supply-chain-probe.yml"
  push:
    branches:
      - DEN-390-ores-cli-pr133-supply-chain-probe
    paths:
      - "evidence/ores-cli-pr133-supply-chain/**"
      - ".github/workflows/ores-cli-pr133-supply-chain-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ores-cli-pr133-supply-chain-probe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact private-source blobs
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          docker='evidence/ores-cli-pr133-supply-chain/src/audit/docker_base_pins.rs'
          cargo='evidence/ores-cli-pr133-supply-chain/src/audit/cargo_git_pins.rs'
          test "$(git hash-object "$docker")" = 1facf8469824ba5170d4b421969639394bdf9629
          test "$(git hash-object "$cargo")" = 0a64afbc770bec944c95a8c188e252ee083de120
          test "$(git hash-object "$docker")" = "$(git hash-object --no-filters "$docker")"
          test "$(git hash-object "$cargo")" = "$(git hash-object --no-filters "$cargo")"
          git diff --check
          status=0
          git grep -n -I -E '^(<<<<<<< .+|=======|>>>>>>> .+)$' -- evidence/ores-cli-pr133-supply-chain || status=$?
          test "$status" -eq 1

      - name: Install tested Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy

      - name: Verify formatting
        run: cargo fmt --manifest-path evidence/ores-cli-pr133-supply-chain/Cargo.toml --all -- --check

      - name: Compile all targets
        run: cargo check --manifest-path evidence/ores-cli-pr133-supply-chain/Cargo.toml --all-targets

      - name: Run exact-source tests
        run: cargo test --manifest-path evidence/ores-cli-pr133-supply-chain/Cargo.toml

      - name: Reject Clippy warnings
        run: cargo clippy --manifest-path evidence/ores-cli-pr133-supply-chain/Cargo.toml --all-targets -- -D warnings
