name: Temporary DEN-1610 verified-source transplant

on:
  push:
    branches:
      - agent/den-1610-authenticated-adapters-current-main-20260804
    paths:
      - .github/workflows/tmp-den-1610-transplant.yml

permissions:
  contents: write

concurrency:
  group: den-1610-verified-source-transplant
  cancel-in-progress: false

jobs:
  transplant:
    if: github.repository == 'ORESoftware/ai-agent-coordinator.rs'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Reconstruct, verify, and commit reviewed implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF_NAME" = 'agent/den-1610-authenticated-adapters-current-main-20260804'
          git fetch --no-tags --depth=1 origin \
            refs/heads/main:refs/remotes/origin/main \
            refs/heads/agent/den-1610-authenticated-adapters-v2:refs/remotes/origin/den-1610-source

          work="$RUNNER_TEMP/den-1610"
          mkdir -p "$work/parts" "$work/source"
          for part in 00 01 02 03 04 05 06; do
            git show "refs/remotes/origin/den-1610-source:.github/den-1610-patch/part-${part}" \
              > "$work/parts/part-${part}"
          done
          cat "$work"/parts/part-* > "$work/source.tar.gz.b64"
          base64 --decode "$work/source.tar.gz.b64" > "$work/source.tar.gz"
          printf '%s  %s\n' \
            'ee72cc9919ec7b5efbdbdecfa1c3b7ddb40db3dcc3f9bbb0f446260e122e916b' \
            "$work/source.tar.gz" | sha256sum --check -
          tar -xzf "$work/source.tar.gz" -C "$work/source"

          sha256sum --check <<CHECKSUMS
          bd534651a15a650012a06f5d33776da8f4e1faa8588103191cb4b29982f21d87  $work/source/src/prompt_reconciliation_adapters.rs
          1317f9ee404312d9b007531efbc794c7c8d27270c3e1bbdfc92c262bcee7b217  $work/source/src/bin/prompt-reconciliation-apply.rs
          a62df7e64bb4e63d1b4b4c20b8044654c69ee21e7714072adcb9b686561f166d  $work/source/src/prompt_reconciliation/model.rs
          35003ee088ecedfebfcf825bffbd288d2d2a0df073808c62eb8d1a0b96fd8306  $work/source/src/lib.rs
          f420ddf3a71f5562acc7fc46d970e39f82556442fa15398374218945226dbeaa  $work/source/docs/prompt-reconciliation-adapters.md
          ce7d84defd8bfe868d412aee2193e9f0435054df4b0d4c084456f50cf5e486e3  $work/source/docs/prompt-reconciliation-apply-guard.md
          CHECKSUMS

          install -m 0644 "$work/source/src/prompt_reconciliation_adapters.rs" src/prompt_reconciliation_adapters.rs
          install -m 0644 "$work/source/src/bin/prompt-reconciliation-apply.rs" src/bin/prompt-reconciliation-apply.rs
          install -m 0644 "$work/source/src/prompt_reconciliation/model.rs" src/prompt_reconciliation/model.rs
          install -m 0644 "$work/source/src/lib.rs" src/lib.rs
          install -m 0644 "$work/source/docs/prompt-reconciliation-adapters.md" docs/prompt-reconciliation-adapters.md
          install -m 0644 "$work/source/docs/prompt-reconciliation-apply-guard.md" docs/prompt-reconciliation-apply-guard.md

          git show refs/remotes/origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f .github/workflows/den-1610-source-reference.yml
          rm -f .github/workflows/tmp-den-1610-transplant.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(DEN-1610): add authenticated reconciliation adapters'
          git push origin "HEAD:${GITHUB_REF_NAME}"

          rm -rf "$work"
