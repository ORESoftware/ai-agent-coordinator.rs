name: DEN-2797 validate cumulative recovery wave 2 v3

on:
  push:
    branches:
      - agent/den-2797-backfill-wave-2
    paths:
      - .github/workflows/den-2797-backfill-wave-2-v3.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: den-2797-backfill-wave-2-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact recovery branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-2797-backfill-wave-2
          fetch-depth: 0
          persist-credentials: true

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Verify current-main ancestry and carrier-only scope
        shell: bash
        run: |
          set -euo pipefail
          base=624c2bae2ac92f65a3a0e86a842fed83758d0972
          test "$(git branch --show-current)" = agent/den-2797-backfill-wave-2
          test "$(git merge-base HEAD "$base")" = "$base"
          git diff --name-only "$base"...HEAD | sort > /tmp/carriers.actual
          cat > /tmp/carriers.expected <<'EOF'
          .github/recovery/DEN-2797-backfill-wave-2.patch
          .github/workflows/den-2797-backfill-wave-2-v2.yml
          .github/workflows/den-2797-backfill-wave-2-v3.yml
          .github/workflows/den-2797-backfill-wave-2.yml
          EOF
          diff -u /tmp/carriers.expected /tmp/carriers.actual

      - name: Apply workflow, tests, and docs from normalized patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/recovery/DEN-2797-backfill-wave-2.patch')
          lines = path.read_text(encoding='utf-8').splitlines()
          header = re.compile(r'^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@(.*)$')
          output: list[str] = []
          index = 0
          while index < len(lines):
              match = header.match(lines[index])
              if not match:
                  output.append(lines[index])
                  index += 1
                  continue
              end = index + 1
              while end < len(lines):
                  if lines[end].startswith('diff --git ') or header.match(lines[end]):
                      break
                  end += 1
              body = lines[index + 1:end]
              old_count = sum(
                  line.startswith((' ', '-')) and not line.startswith('--- ')
                  for line in body
              )
              new_count = sum(
                  line.startswith((' ', '+')) and not line.startswith('+++ ')
                  for line in body
              )
              old_start, _, new_start, _, suffix = match.groups()
              output.append(f'@@ -{old_start},{old_count} +{new_start},{new_count} @@{suffix}')
              output.extend(body)
              index = end
          path.write_text('\n'.join(output) + '\n', encoding='utf-8')
          PY
          git apply --check --3way \
            --exclude=scripts/build_artifact_recovery_backfill.py \
            .github/recovery/DEN-2797-backfill-wave-2.patch
          git apply --3way --index \
            --exclude=scripts/build_artifact_recovery_backfill.py \
            .github/recovery/DEN-2797-backfill-wave-2.patch

      - name: Update the generator through exact anchored transformations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/build_artifact_recovery_backfill.py')
          text = path.read_text(encoding='utf-8')

          replacements = {
              'GENERATED_AT = "2026-08-07T20:10:00Z"':
                  'GENERATED_AT = "2026-08-08T04:16:00Z"',
              '    kind = "archive" if repository == "slack-ores-integrations" else "git_bundle"':
                  '    kind = value.get("kind", "archive" if repository == "slack-ores-integrations" else "git_bundle")',
              '            "commit_sha": value["artifact_commit"], "paths": []}, "git_repository": True, "remote_present": True,':
                  '            "commit_sha": value["artifact_commit"], "paths": value.get("paths", [])}, "git_repository": True, "remote_present": True,',
              '        "batch": {"id": "initial-accessible-library-backfill-2026-08-07-b", "complete": False,':
                  '        "batch": {"id": "accessible-library-backfill-2026-08-08-wave-2", "complete": False,',
              '            "source_window": "accessible ChatGPT file-library artifacts and refreshed GitHub evidence through 2026-08-07"},':
                  '            "source_window": "accessible ChatGPT file-library artifacts and refreshed GitHub evidence through 2026-08-08"},',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'generator anchor count for {old!r}: {text.count(old)}')
              text = text.replace(old, new)

          recovered_entry = '''    {
              "owner": "ORESoftware", "repository": "ai-agent-coordinator.rs", "visibility": "public",
              "origin": "file_00000000efc0820e870395d40af3be7f", "observed_at": "2026-08-08T04:00:00Z",
              "artifact": "DEN-602-github-admin-browser-hardening.patch",
              "digest": "8b649d9c1e0cffe9162d47d70313544d376e19842c39d191a7f1ae7dd842127f",
              "locator": "library:file_00000000efc0820e870395d40af3be7f", "kind": "file",
              "paths": ["DEN-602-github-admin-browser-hardening.patch"],
              "artifact_commit": "0fee30e469f99d2e5cefc66b1389298dc3c33e30",
              "main": "624c2bae2ac92f65a3a0e86a842fed83758d0972", "pr": 56,
              "pr_head": "agent/den-602-github-admin-browser-hardening", "pr_state": "merged",
          },
          '''
          recovered_marker = ')\nFLUTTER = {'
          if text.count(recovered_marker) != 1:
              raise SystemExit('RECOVERED tuple marker is not unique')
          text = text.replace(recovered_marker, recovered_entry + recovered_marker)

          open_recoveries = '''
          OPEN_RECOVERIES = (
              {
                  "owner": "zed-pkg", "repository": "zed-api-server.rs", "visibility": "public",
                  "origin": "file_00000000810481f78c4cd3b1052881c9", "observed_at": "2026-08-08T04:09:00Z",
                  "artifact": "DEN-99-dependency-resolution.patch",
                  "digest": "c183d8e12225776537b03c9d3720984804f360f88a4793b3646abe4dd7ea12b2",
                  "locator": "library:file_00000000810481f78c4cd3b1052881c9",
                  "main": "9d019325d42508aec883cfe86f59ce1461063b9c",
                  "branch": "agent/den-99-dependency-resolution-model",
                  "branch_sha": "b80f728dfed8f6cb005846015300a3ee19e01678", "pr": 16,
                  "note": "Recovered to a green current-main draft PR; retain product-owner review.",
              },
              {
                  "owner": "fiducia-cloud", "repository": "fiducia-brain.rs", "visibility": "public",
                  "origin": "file_00000000119081f7b244394be85b4569", "observed_at": "2026-08-08T04:15:00Z",
                  "artifact": "DEN-569-composition-model.patch",
                  "digest": "184c4e58cbf047ee81d2cd1923285036f615d8462ed491c52f2ba0366bed358d",
                  "locator": "library:file_00000000119081f7b244394be85b4569",
                  "main": "4ef54fc5431793623c868de2ac0f4887858885de",
                  "branch": "agent/den-569-quint-composition-model",
                  "branch_sha": "c90cf14db6609ab550444af64200e22c8ee19327", "pr": 26,
                  "note": "Recovered to a green current-main draft PR without overlapping the merged DEN-1516 Rust model.",
              },
          )
          '''
          origin_marker = '\n\ndef origin('
          if text.count(origin_marker) != 1:
              raise SystemExit('origin function marker is not unique')
          text = text.replace(origin_marker, open_recoveries + origin_marker)

          helper = '''
          def open_recovery(value: dict[str, Any]) -> dict[str, Any]:
              owner, repository, branch = value["owner"], value["repository"], value["branch"]
              url = f"https://github.com/{owner}/{repository}"
              evidence = pr(owner, repository, value["pr"], branch, "open", True)
              return {
                  "origin": origin(value["origin"], value["observed_at"]),
                  "target": {"owner": owner, "repository": repository, "visibility": value["visibility"], "artifact_kind": "code", "ownership_resolved": True},
                  "intent": {"artifact_expected": True, "base_branch": "main", "branch": branch, "pull_request_required": True, "allow_repository_creation": False},
                  "local": {"artifact": {"kind": "file", "name": value["artifact"], "sha256": value["digest"], "locator": value["locator"],
                      "commit_sha": value["branch_sha"], "paths": [value["artifact"]]}, "git_repository": True, "remote_present": True,
                      "branch": branch, "branches": [branch], "head_sha": value["branch_sha"], "dirty_paths": []},
                  "remote": remote(owner, repository, value["visibility"], value["main"], branch=branch, branch_sha=value["branch_sha"], pull_requests=(evidence,)),
                  "claims": {"repository_url": url, "commit_sha": value["branch_sha"], "branch": branch, "pull_request_url": evidence["url"]},
                  "note": value["note"],
              }


          '''
          build_marker = 'def build_fixture() -> dict[str, Any]:\n'
          if text.count(build_marker) != 1:
              raise SystemExit('build_fixture marker is not unique')
          text = text.replace(build_marker, helper + build_marker)

          item_marker = '    items.append(flutter())\n'
          if text.count(item_marker) != 1:
              raise SystemExit('fixture append marker is not unique')
          text = text.replace(
              item_marker,
              item_marker + '    items.extend(open_recovery(value) for value in OPEN_RECOVERIES)\n',
          )
          path.write_text(text, encoding='utf-8')
          PY
          git add scripts/build_artifact_recovery_backfill.py
          git diff --cached --check
          ! grep -RInE '^(<<<<<<<|=======|>>>>>>>)' \
            scripts/build_artifact_recovery_backfill.py \
            tests/test_artifact_recovery_ledger.py \
            .github/workflows/nightly-artifact-recovery.yml \
            docs/artifact-recovery-initial-backfill.md

      - name: Compile and run the complete recovery suite
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/build_artifact_recovery_backfill.py \
            tools/artifact_recovery_ledger.py \
            tools/artifact_recovery/*.py \
            tools/enqueue_artifact_recovery.py \
            tests/test_artifact_recovery_ledger.py \
            tests/test_enqueue_artifact_recovery.py
          python3 -m unittest -v \
            tests/test_artifact_recovery_ledger.py \
            tests/test_enqueue_artifact_recovery.py

      - name: Validate permanent workflow and cumulative deterministic evidence
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            .github/workflows/nightly-artifact-recovery.yml
          evidence="$RUNNER_TEMP/artifact-recovery-wave-2"
          mkdir -p "$evidence"
          python3 scripts/build_artifact_recovery_backfill.py --output "$evidence/backfill.json"
          python3 tools/artifact_recovery_ledger.py validate "$evidence/backfill.json"
          python3 tools/artifact_recovery_ledger.py reconcile \
            --input "$evidence/backfill.json" --output "$evidence/ledger-first.json" \
            --cli-queue "$evidence/queue-first.json" --batch-size 50 --now 2026-08-08T04:30:00Z
          python3 tools/artifact_recovery_ledger.py reconcile \
            --input "$evidence/backfill.json" --ledger "$evidence/ledger-first.json" \
            --output "$evidence/ledger-second.json" --cli-queue "$evidence/queue-second.json" \
            --batch-size 50 --now 2026-08-08T04:30:00Z
          cmp "$evidence/ledger-first.json" "$evidence/ledger-second.json"
          cmp "$evidence/queue-first.json" "$evidence/queue-second.json"
          EVIDENCE="$evidence" python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['EVIDENCE'])
          ledger = json.loads((root / 'ledger-second.json').read_text())
          queue = json.loads((root / 'queue-second.json').read_text())
          assert ledger['summary']['entries'] == 20
          assert ledger['summary']['complete'] == 12
          assert ledger['summary']['actionable'] == 8
          assert ledger['summary']['blocked'] == 0
          assert queue['summary'] == {'items': 8, 'create_repository': 8, 'recover_local': 0}
          entries = {
              entry['observation']['target']['identity']: entry
              for entry in ledger['entries'].values()
          }
          for identity, expected_pr in {
              'oresoftware/ai-agent-coordinator.rs': 56,
              'zed-pkg/zed-api-server.rs': 16,
              'fiducia-cloud/fiducia-brain.rs': 26,
          }.items():
              entry = entries[identity]
              assert entry['classification']['status'] == 'complete'
              assert any(link.endswith(f'/pull/{expected_pr}') for link in entry['evidence_links'])
          assert entries['zed-pkg/zed-api-server.rs']['observation']['remote']['pull_requests'][0]['draft'] is True
          assert entries['fiducia-cloud/fiducia-brain.rs']['observation']['remote']['pull_requests'][0]['draft'] is True
          PY

      - name: Scan intended scope for credentials and private material
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE \
            '(gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,}|cfat_[A-Za-z0-9_-]{20,}|-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----)' \
            scripts/build_artifact_recovery_backfill.py \
            tests/test_artifact_recovery_ledger.py \
            .github/workflows/nightly-artifact-recovery.yml \
            docs/artifact-recovery-initial-backfill.md; then
            echo 'credential-shaped material found in intended product scope' >&2
            exit 1
          fi

      - name: Commit product-only cumulative backfill and export it
        shell: bash
        run: |
          set -euo pipefail
          base=624c2bae2ac92f65a3a0e86a842fed83758d0972
          git rm \
            .github/recovery/DEN-2797-backfill-wave-2.patch \
            .github/workflows/den-2797-backfill-wave-2-v2.yml \
            .github/workflows/den-2797-backfill-wave-2-v3.yml \
            .github/workflows/den-2797-backfill-wave-2.yml
          git add \
            scripts/build_artifact_recovery_backfill.py \
            tests/test_artifact_recovery_ledger.py \
            .github/workflows/nightly-artifact-recovery.yml \
            docs/artifact-recovery-initial-backfill.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(DEN-2797): extend artifact recovery backfill through wave 2'
          product_commit="$(git rev-parse HEAD)"
          product_tree="$(git rev-parse 'HEAD^{tree}')"
          echo "PRODUCT_COMMIT=$product_commit"
          echo "PRODUCT_TREE=$product_tree"
          git diff --name-only "$base"...HEAD | sort > /tmp/product.actual
          cat > /tmp/product.expected <<'EOF'
          .github/workflows/nightly-artifact-recovery.yml
          docs/artifact-recovery-initial-backfill.md
          scripts/build_artifact_recovery_backfill.py
          tests/test_artifact_recovery_ledger.py
          EOF
          diff -u /tmp/product.expected /tmp/product.actual

          root="$RUNNER_TEMP/den-2797-wave-2-product"
          mkdir -p "$root/.github/workflows" "$root/docs" "$root/scripts" "$root/tests"
          cp .github/workflows/nightly-artifact-recovery.yml "$root/.github/workflows/nightly-artifact-recovery.yml"
          cp docs/artifact-recovery-initial-backfill.md "$root/docs/artifact-recovery-initial-backfill.md"
          cp scripts/build_artifact_recovery_backfill.py "$root/scripts/build_artifact_recovery_backfill.py"
          cp tests/test_artifact_recovery_ledger.py "$root/tests/test_artifact_recovery_ledger.py"
          cp -R "$RUNNER_TEMP/artifact-recovery-wave-2" "$root/evidence"
          (
            cd "$root"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          cat > "$root/RECOVERY_EVIDENCE.json" <<EOF
          {
            "schema_version": 1,
            "source_branch_head": "${GITHUB_SHA}",
            "base_commit": "$base",
            "product_commit": "$product_commit",
            "product_tree": "$product_tree",
            "ledger_rows": 20,
            "complete": 12,
            "actionable": 8,
            "cli_repository_creates": 8
          }
          EOF

          set +e
          push_output="$(git push origin HEAD:agent/den-2797-backfill-wave-2 2>&1)"
          push_status=$?
          set -e
          printf '%s\n' "$push_output"
          test "$push_status" -ne 0
          grep -F 'refusing to allow a GitHub App to create or update workflow' <<<"$push_output"

      - name: Upload product tree and cumulative evidence for App publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: den-2797-wave-2-product-${{ github.sha }}
          path: ${{ runner.temp }}/den-2797-wave-2-product
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
