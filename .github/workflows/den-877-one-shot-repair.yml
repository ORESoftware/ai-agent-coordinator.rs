name: DEN-877 one-shot semantic fleet repair

on:
  push:
    branches:
      - agent/den-877-fleet-merge-repair
    paths:
      - .github/workflows/den-877-one-shot-repair.yml
      - repository-fleets/hypesiege-streempilot/RECONCILE-TRIGGER-20260731

permissions:
  contents: write

concurrency:
  group: den-877-one-shot-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'ORESoftware/ai-agent-coordinator.rs'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/den-877-fleet-merge-repair
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Reconcile the payload identity and deterministic ledger
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          old = '50629a57beca1ac85928cfae8fbebbca4f62a6455a7013016f92b1203dcbbd1f'
          new = 'a57b00961ee57ae09bf3bb2e2d09afbdd1ddbbbde832b027802f82a1fc5dfa84'
          paths = [
              Path('scripts/reconstruct_hypesiege_streempilot_fleet.py'),
              Path('scripts/publish_hypesiege_streempilot_fleet.py'),
              Path('docs/hypesiege-streempilot-repository-publication.md'),
              Path('repository-fleets/hypesiege-streempilot.json'),
          ]
          for path in paths:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one old digest, found {count}')
              path.write_text(text.replace(old, new), encoding='utf-8')
          PY

          # The Kubernetes batch job embodied the superseded all-at-once,
          # broad-admin-token publication path. Removing the whole isolated
          # overlay preserves the canonical one-repository-at-a-time boundary.
          test -f deploy/k8s/bootstrap/hypesiege-streempilot-bootstrap-job.yaml
          test -f deploy/k8s/bootstrap/kustomization.yaml
          rm -rf deploy/k8s/bootstrap

          output_root="$RUNNER_TEMP/hypesiege-streempilot-fleet"
          manifest_out="$RUNNER_TEMP/hypesiege-streempilot-manifest.json"
          python scripts/reconstruct_hypesiege_streempilot_fleet.py \
            --output-root "$output_root" \
            --manifest-out "$manifest_out"

          MANIFEST_OUT="$manifest_out" python - <<'PY'
          import json
          import os
          from pathlib import Path

          checked_path = Path('repository-fleets/hypesiege-streempilot.json')
          generated_path = Path(os.environ['MANIFEST_OUT'])
          previous = json.loads(checked_path.read_text(encoding='utf-8'))
          generated = json.loads(generated_path.read_text(encoding='utf-8'))

          invariant_keys = (
              'schema_version',
              'default_branch',
              'repository_count',
              'total_tracked_files',
              'total_gitlinks',
              'organizations',
          )
          for key in invariant_keys:
              if previous[key] != generated[key]:
                  raise SystemExit(f'fleet invariant changed for {key}: {previous[key]!r} != {generated[key]!r}')

          previous_names = [item['full_name'] for item in previous['repositories']]
          generated_names = [item['full_name'] for item in generated['repositories']]
          if previous_names != generated_names:
              raise SystemExit('repository identity or order changed during reconstruction')

          previous_by_name = {item['full_name']: item for item in previous['repositories']}
          generated_by_name = {item['full_name']: item for item in generated['repositories']}
          for full_name in previous_names:
              before = previous_by_name[full_name]
              after = generated_by_name[full_name]
              for key in ('org', 'name', 'kind', 'files', 'remote', 'description', 'visibility', 'default_branch', 'gitlinks'):
                  if before[key] != after[key]:
                      raise SystemExit(f'{full_name}: non-commit contract changed for {key}')

          checked_path.write_text(json.dumps(generated, indent=2) + '\n', encoding='utf-8')

          representative = {
              'hypesiege/hypesiege-api-server.rs': {
                  'test': 1,
                  'workflow': 1,
              },
              'streempilot/streempilot-monorepo': {
                  'test': 2,
                  'workflow': 1,
              },
          }
          target_paths = {
              'test': Path('scripts/test_publish_hypesiege_streempilot_fleet.py'),
              'workflow': Path('.github/workflows/repository-fleets.yml'),
          }
          for full_name, expectations in representative.items():
              old_commit = previous_by_name[full_name]['commit']
              new_commit = generated_by_name[full_name]['commit']
              for target_name, expected_count in expectations.items():
                  path = target_paths[target_name]
                  text = path.read_text(encoding='utf-8')
                  count = text.count(old_commit)
                  if count != expected_count:
                      raise SystemExit(
                          f'{path}: expected {expected_count} references to {full_name} commit, found {count}'
                      )
                  if old_commit != new_commit:
                      path.write_text(text.replace(old_commit, new_commit), encoding='utf-8')
          PY

          python -m py_compile \
            scripts/reconstruct_hypesiege_streempilot_fleet.py \
            scripts/publish_hypesiege_streempilot_fleet.py \
            scripts/test_publish_hypesiege_streempilot_fleet.py
          python -m unittest -v scripts/test_publish_hypesiege_streempilot_fleet.py
          python scripts/publish_hypesiege_streempilot_fleet.py \
            --repository hypesiege/hypesiege-api-server.rs >/tmp/hypesiege-plan.json
          python scripts/publish_hypesiege_streempilot_fleet.py \
            --repository streempilot/streempilot-monorepo >/tmp/streempilot-plan.json

          if git grep -n '50629a57beca1ac85928cfae8fbebbca4f62a6455a7013016f92b1203dcbbd1f' -- . ':!*.lock'; then
            echo 'stale generator digest remains' >&2
            exit 1
          fi
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- .; then
            echo 'conflict markers remain' >&2
            exit 1
          fi
          git diff --check

          rm .github/workflows/den-877-one-shot-repair.yml
          git add -A
          git diff --cached --check
          git config user.name 'ORESoftware'
          git config user.email '11139560+ORESoftware@users.noreply.github.com'
          git commit -m 'fix(DEN-877): align the sealed fleet identity and remove unsafe bootstrap'
          git push origin HEAD:agent/den-877-fleet-merge-repair
