name: ores-cli PR130 provider-state exact-source probe

on:
  pull_request:
    paths:
      - "evidence/ores-cli-pr130/**"
      - ".github/workflows/ores-cli-pr130-provider-state-probe.yml"
  push:
    branches:
      - DEN-2843-ores-cli-pr130-provider-state-probe
    paths:
      - "evidence/ores-cli-pr130/**"
      - ".github/workflows/ores-cli-pr130-provider-state-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ores-cli-pr130-provider-state-probe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact provider-state source and clean conflict state
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          source='evidence/ores-cli-pr130/src/audit/infra_provider_state.rs'
          test "$(git hash-object "$source")" = d9b5d51427226cdd18b0cdc73cfd9db072e93fe5
          test "$(git hash-object "$source")" = "$(git hash-object --no-filters "$source")"
          git diff --check
          status=0
          git grep -n -I -E '^(<<<<<<< .+|=======|>>>>>>> .+)$' -- evidence/ores-cli-pr130 || status=$?
          test "$status" -eq 1

      - name: Install tested Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy

      - name: Verify formatting
        run: cargo fmt --manifest-path evidence/ores-cli-pr130/Cargo.toml --all -- --check

      - name: Compile all targets
        run: cargo check --manifest-path evidence/ores-cli-pr130/Cargo.toml --all-targets

      - name: Run exact-source tests
        run: cargo test --manifest-path evidence/ores-cli-pr130/Cargo.toml

      - name: Reject Clippy warnings
        run: cargo clippy --manifest-path evidence/ores-cli-pr130/Cargo.toml --all-targets -- -D warnings
