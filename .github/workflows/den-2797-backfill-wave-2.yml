name: DEN-2797 validate cumulative recovery wave 2

on:
  push:
    branches:
      - agent/den-2797-backfill-wave-2
    paths:
      - .github/workflows/den-2797-backfill-wave-2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: den-2797-backfill-wave-2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact recovery branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-2797-backfill-wave-2
          fetch-depth: 0
          persist-credentials: true

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Verify current-main ancestry and carrier-only scope
        shell: bash
        run: |
          set -euo pipefail
          base=624c2bae2ac92f65a3a0e86a842fed83758d0972
          test "$(git branch --show-current)" = agent/den-2797-backfill-wave-2
          test "$(git merge-base HEAD "$base")" = "$base"
          git diff --name-only "$base"...HEAD | sort > /tmp/carriers.actual
          cat > /tmp/carriers.expected <<'EOF'
          .github/recovery/DEN-2797-backfill-wave-2.patch
          .github/workflows/den-2797-backfill-wave-2.yml
          EOF
          diff -u /tmp/carriers.expected /tmp/carriers.actual

      - name: Apply cumulative backfill patch with three-way safety
        shell: bash
        run: |
          set -euo pipefail
          git apply --check --3way .github/recovery/DEN-2797-backfill-wave-2.patch
          git apply --3way --index .github/recovery/DEN-2797-backfill-wave-2.patch
          git diff --cached --check
          ! grep -RInE '^(<<<<<<<|=======|>>>>>>>)' \
            scripts/build_artifact_recovery_backfill.py \
            tests/test_artifact_recovery_ledger.py \
            .github/workflows/nightly-artifact-recovery.yml \
            docs/artifact-recovery-initial-backfill.md

      - name: Compile and run the full focused recovery suite
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/build_artifact_recovery_backfill.py \
            tools/artifact_recovery_ledger.py \
            tools/artifact_recovery/*.py \
            tools/enqueue_artifact_recovery.py \
            tests/test_artifact_recovery_ledger.py \
            tests/test_enqueue_artifact_recovery.py
          python3 -m unittest -v \
            tests/test_artifact_recovery_ledger.py \
            tests/test_enqueue_artifact_recovery.py

      - name: Validate permanent workflow and cumulative deterministic evidence
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            .github/workflows/nightly-artifact-recovery.yml
          evidence="$RUNNER_TEMP/artifact-recovery-wave-2"
          mkdir -p "$evidence"
          python3 scripts/build_artifact_recovery_backfill.py --output "$evidence/backfill.json"
          python3 tools/artifact_recovery_ledger.py validate "$evidence/backfill.json"
          python3 tools/artifact_recovery_ledger.py reconcile \
            --input "$evidence/backfill.json" \
            --output "$evidence/ledger-first.json" \
            --cli-queue "$evidence/queue-first.json" \
            --batch-size 50 \
            --now 2026-08-08T04:20:00Z
          python3 tools/artifact_recovery_ledger.py reconcile \
            --input "$evidence/backfill.json" \
            --ledger "$evidence/ledger-first.json" \
            --output "$evidence/ledger-second.json" \
            --cli-queue "$evidence/queue-second.json" \
            --batch-size 50 \
            --now 2026-08-08T04:20:00Z
          cmp "$evidence/ledger-first.json" "$evidence/ledger-second.json"
          cmp "$evidence/queue-first.json" "$evidence/queue-second.json"
          EVIDENCE="$evidence" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['EVIDENCE'])
          ledger = json.loads((root / 'ledger-second.json').read_text())
          queue = json.loads((root / 'queue-second.json').read_text())
          assert ledger['summary']['entries'] == 20
          assert ledger['summary']['complete'] == 12
          assert ledger['summary']['actionable'] == 8
          assert ledger['summary']['blocked'] == 0
          assert queue['summary'] == {
              'items': 8,
              'create_repository': 8,
              'recover_local': 0,
          }
          entries = {
              entry['observation']['target']['identity']: entry
              for entry in ledger['entries'].values()
          }
          for identity, expected_pr in {
              'oresoftware/ai-agent-coordinator.rs': 56,
              'zed-pkg/zed-api-server.rs': 16,
              'fiducia-cloud/fiducia-brain.rs': 26,
          }.items():
              entry = entries[identity]
              assert entry['classification']['status'] == 'complete'
              assert any(link.endswith(f'/pull/{expected_pr}') for link in entry['evidence_links'])
          assert entries['zed-pkg/zed-api-server.rs']['observation']['remote']['pull_requests'][0]['draft'] is True
          assert entries['fiducia-cloud/fiducia-brain.rs']['observation']['remote']['pull_requests'][0]['draft'] is True
          PY

      - name: Scan intended content for credentials and private key material
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE \
            '(gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,}|cfat_[A-Za-z0-9_-]{20,}|-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----)' \
            scripts/build_artifact_recovery_backfill.py \
            tests/test_artifact_recovery_ledger.py \
            .github/workflows/nightly-artifact-recovery.yml \
            docs/artifact-recovery-initial-backfill.md; then
            echo 'credential-shaped material found in intended product scope' >&2
            exit 1
          fi

      - name: Commit the product-only cumulative backfill
        shell: bash
        run: |
          set -euo pipefail
          base=624c2bae2ac92f65a3a0e86a842fed83758d0972
          git rm \
            .github/recovery/DEN-2797-backfill-wave-2.patch \
            .github/workflows/den-2797-backfill-wave-2.yml
          git add \
            scripts/build_artifact_recovery_backfill.py \
            tests/test_artifact_recovery_ledger.py \
            .github/workflows/nightly-artifact-recovery.yml \
            docs/artifact-recovery-initial-backfill.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(DEN-2797): extend artifact recovery backfill through wave 2'
          product_commit="$(git rev-parse HEAD)"
          product_tree="$(git rev-parse 'HEAD^{tree}')"
          echo "PRODUCT_COMMIT=$product_commit"
          echo "PRODUCT_TREE=$product_tree"
          git diff --name-only "$base"...HEAD | sort > /tmp/product.actual
          cat > /tmp/product.expected <<'EOF'
          .github/workflows/nightly-artifact-recovery.yml
          docs/artifact-recovery-initial-backfill.md
          scripts/build_artifact_recovery_backfill.py
          tests/test_artifact_recovery_ledger.py
          EOF
          diff -u /tmp/product.expected /tmp/product.actual

          root="$RUNNER_TEMP/den-2797-wave-2-product"
          mkdir -p "$root/.github/workflows" "$root/docs" "$root/scripts" "$root/tests"
          cp .github/workflows/nightly-artifact-recovery.yml "$root/.github/workflows/nightly-artifact-recovery.yml"
          cp docs/artifact-recovery-initial-backfill.md "$root/docs/artifact-recovery-initial-backfill.md"
          cp scripts/build_artifact_recovery_backfill.py "$root/scripts/build_artifact_recovery_backfill.py"
          cp tests/test_artifact_recovery_ledger.py "$root/tests/test_artifact_recovery_ledger.py"
          cp -R "$RUNNER_TEMP/artifact-recovery-wave-2" "$root/evidence"
          (
            cd "$root"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          cat > "$root/RECOVERY_EVIDENCE.json" <<EOF
          {
            "schema_version": 1,
            "source_branch_head": "${GITHUB_SHA}",
            "base_commit": "$base",
            "product_commit": "$product_commit",
            "product_tree": "$product_tree",
            "ledger_rows": 20,
            "complete": 12,
            "actionable": 8,
            "cli_repository_creates": 8
          }
          EOF

          set +e
          push_output="$(git push origin HEAD:agent/den-2797-backfill-wave-2 2>&1)"
          push_status=$?
          set -e
          printf '%s\n' "$push_output"
          test "$push_status" -ne 0
          grep -F 'refusing to allow a GitHub App to create or update workflow' <<<"$push_output"

      - name: Upload product tree and cumulative evidence for App publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: den-2797-wave-2-product-${{ github.sha }}
          path: ${{ runner.temp }}/den-2797-wave-2-product
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
