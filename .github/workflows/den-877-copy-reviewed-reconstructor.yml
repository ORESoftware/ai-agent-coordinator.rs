name: DEN-877 copy reviewed reconstructor

on:
  push:
    branches:
      - agent/den-877-final-reconciliation-v3
    paths:
      - .github/workflows/den-877-copy-reviewed-reconstructor.yml

permissions:
  contents: write

concurrency:
  group: den-877-copy-reviewed-reconstructor
  cancel-in-progress: false

jobs:
  copy:
    if: github.repository == 'ORESoftware/ai-agent-coordinator.rs'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/den-877-final-reconciliation-v3
          fetch-depth: 0
          persist-credentials: true

      - name: Copy and verify the reviewed deterministic reconstructor
        shell: bash
        run: |
          set -euo pipefail
          source_ref='refs/heads/agent/den-877-fleet-merge-repair'
          source_remote='refs/remotes/origin/agent/den-877-fleet-merge-repair'
          expected_blob='c21b5c1b727ae572750728bab9c54e62f68ff8f9'

          git fetch --no-tags origin "$source_ref:$source_remote"
          git show "$source_remote:scripts/reconstruct_hypesiege_streempilot_fleet.py" \
            > scripts/reconstruct_hypesiege_streempilot_fleet.py

          observed_blob="$(git hash-object scripts/reconstruct_hypesiege_streempilot_fleet.py)"
          test "$observed_blob" = "$expected_blob"
          python -m py_compile scripts/reconstruct_hypesiege_streempilot_fleet.py
          git diff --check

          git config user.name 'ORESoftware'
          git config user.email '11139560+ORESoftware@users.noreply.github.com'
          git add scripts/reconstruct_hypesiege_streempilot_fleet.py
          git commit -m 'fix(DEN-877): reject generated data loss while sealing histories'
          git push origin HEAD:agent/den-877-final-reconciliation-v3
