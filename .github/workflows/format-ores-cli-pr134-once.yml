name: format ores-cli PR134 once

on:
  push:
    branches:
      - DEN-390-ores-cli-pr134-middleware-lru-probe
    paths:
      - .github/workflows/format-ores-cli-pr134-once.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.88.0'
          components: rustfmt
      - name: Format evidence crate
        run: cargo fmt --manifest-path evidence/ores-cli-pr134/Cargo.toml --all
      - name: Require bounded changes
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only | sort)
          test "${#changed[@]}" -ge 1
          for path in "${changed[@]}"; do
            case "$path" in
              evidence/ores-cli-pr134/src/audit/runtime_toml_lru.rs|evidence/ores-cli-pr134/src/audit/runtime_toml_middleware.rs) ;;
              *) echo "unexpected rustfmt output: $path" >&2; exit 1 ;;
            esac
          done
      - name: Commit formatting-only sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/ores-cli-pr134/src/audit/runtime_toml_lru.rs evidence/ores-cli-pr134/src/audit/runtime_toml_middleware.rs
          git commit -m 'style: rustfmt PR134 exact sources'
          git push origin HEAD:DEN-390-ores-cli-pr134-middleware-lru-probe
