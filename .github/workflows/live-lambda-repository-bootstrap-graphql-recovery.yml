name: Recover ten-organization Lambda bootstrap through GraphQL

on:
  pull_request:
    paths:
      - "scripts/gh-graphql-rate-limit-fallback.sh"
      - "scripts/test-gh-graphql-rate-limit-fallback.py"
      - "scripts/cargo-canonical-format-shim.sh"
      - "scripts/test-cargo-canonical-format-shim.py"
      - ".github/repository-bootstrap-trigger/lambda-repositories-20260903-graphql-recovery.txt"
      - ".github/workflows/live-lambda-repository-bootstrap-graphql-recovery.yml"
  push:
    branches: [main]
    paths:
      - "scripts/gh-graphql-rate-limit-fallback.sh"
      - "scripts/test-gh-graphql-rate-limit-fallback.py"
      - "scripts/cargo-canonical-format-shim.sh"
      - "scripts/test-cargo-canonical-format-shim.py"
      - ".github/repository-bootstrap-trigger/lambda-repositories-20260903-graphql-recovery.txt"
      - ".github/workflows/live-lambda-repository-bootstrap-graphql-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: lambda-repository-bootstrap
  cancel-in-progress: false

env:
  TRACKING_ISSUE: "183"
  EXPECTED_MANIFEST_SHA256: d5025256feb8834a258199052f1b261358a0ee8cecce4b266b91eab00d7e3df3
  TRIGGER_PATH: .github/repository-bootstrap-trigger/lambda-repositories-20260903-graphql-recovery.txt

jobs:
  validate:
    name: validate-graphql-rustfmt-recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate immutable plan and recovery source
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat "$TRIGGER_PATH")" = $'issue=183\nmanifest_sha256=d5025256feb8834a258199052f1b261358a0ee8cecce4b266b91eab00d7e3df3\nrecovery=graphql-rate-limit-rustfmt-normalization\nattempt=3\narmed=true\none_time=true'
          test "$(sha256sum repository-fleets/lambda-repositories-2026-09-03.tsv | awk '{print $1}')" = "$EXPECTED_MANIFEST_SHA256"
          bash -n scripts/bootstrap-lambda-repositories-live.sh
          bash -n scripts/gh-graphql-rate-limit-fallback.sh
          bash -n scripts/cargo-canonical-format-shim.sh
          python3 scripts/test-gh-graphql-rate-limit-fallback.py
          python3 scripts/test-cargo-canonical-format-shim.py
          WORK_ROOT="$RUNNER_TEMP/lambda-plan" \
            bash scripts/bootstrap-lambda-repositories-live.sh validate

      - name: Exercise GraphQL viewer and repository reads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          real_gh="$(command -v gh)"
          viewer="$(REAL_GH="$real_gh" bash scripts/gh-graphql-rate-limit-fallback.sh api user --jq .login)"
          test -n "$viewer"
          observed="$(REAL_GH="$real_gh" bash scripts/gh-graphql-rate-limit-fallback.sh api "repos/$GITHUB_REPOSITORY" --jq .nameWithOwner)"
          test "$observed" = "$GITHUB_REPOSITORY"

      - name: Reject credentials and unresolved merge markers
        shell: bash
        run: |
          set -euo pipefail
          credential_paths=(
            scripts/gh-graphql-rate-limit-fallback.sh
            scripts/cargo-canonical-format-shim.sh
            .github/repository-bootstrap-trigger/lambda-repositories-20260903-graphql-recovery.txt
          )
          all_paths=(
            "${credential_paths[@]}"
            scripts/test-gh-graphql-rate-limit-fallback.py
            scripts/test-cargo-canonical-format-shim.py
            .github/workflows/live-lambda-repository-bootstrap-graphql-recovery.yml
          )
          credential_pattern='gh[pousr]_[A-Za-z0-9]{20,}|lin_api_[A-Za-z0-9]{20,}|CHAT_BRIDGE_TOKEN|BEGIN [A-Z ]*PRIVATE KEY'
          if grep -nE "$credential_pattern" "${credential_paths[@]}"; then
            echo 'Credential-shaped content is forbidden.' >&2
            exit 1
          fi
          if grep -nE '^(<{7}|={7}|>{7})' "${all_paths[@]}"; then
            echo 'Unresolved merge marker found.' >&2
            exit 1
          fi

  apply:
    name: resume-create-test-pr-merge-ten-repositories
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out exact merged source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Revalidate recovery source
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat "$TRIGGER_PATH")" = $'issue=183\nmanifest_sha256=d5025256feb8834a258199052f1b261358a0ee8cecce4b266b91eab00d7e3df3\nrecovery=graphql-rate-limit-rustfmt-normalization\nattempt=3\narmed=true\none_time=true'
          test "$(sha256sum repository-fleets/lambda-repositories-2026-09-03.tsv | awk '{print $1}')" = "$EXPECTED_MANIFEST_SHA256"
          bash -n scripts/gh-graphql-rate-limit-fallback.sh
          bash -n scripts/cargo-canonical-format-shim.sh
          python3 scripts/test-gh-graphql-rate-limit-fallback.py
          python3 scripts/test-cargo-canonical-format-shim.py
          WORK_ROOT="$RUNNER_TEMP/lambda-plan" \
            bash scripts/bootstrap-lambda-repositories-live.sh validate

      - name: Install pinned Rust toolchain and targets
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt --no-self-update
          rustup target add --toolchain 1.88.0 x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu

      - name: Generate run-bound public encryption key
        id: key
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          key_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}"
          private_key="$RUNNER_TEMP/lambda-bootstrap-${key_id}.pem"
          public_key="$RUNNER_TEMP/lambda-bootstrap-${key_id}.pub.pem"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$private_key" >/dev/null 2>&1
          chmod 0600 "$private_key"
          openssl pkey -in "$private_key" -pubout -out "$public_key" >/dev/null 2>&1
          public_key_b64="$(base64 -w0 < "$public_key")"
          body="$(jq -n -r \
            --arg marker "<!-- lambda-bootstrap-key:${key_id} -->" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg source_sha "$GITHUB_SHA" \
            --arg manifest "$EXPECTED_MANIFEST_SHA256" \
            --arg public_key_b64 "$public_key_b64" \
            '$marker + "\n\nA run-bound public key is ready for the idempotent GraphQL/Rustfmt recovery of the exact reviewed Lambda repository rollout.\n\n- run_id: `" + $run_id + "`\n- source_sha: `" + $source_sha + "`\n- manifest_sha256: `" + $manifest + "`\n- transport: `GraphQL plus Git`\n- formatting: `normalize, then fail-closed check`\n- public_key_b64: `" + $public_key_b64 + "`\n\nReply once with the matching ciphertext marker. The private key exists only in runner-temporary storage for this run."')"
          jq -n --arg body "$body" '{body:$body}' | \
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$TRACKING_ISSUE/comments" --input - >/dev/null
          printf 'key_id=%s\n' "$key_id" >> "$GITHUB_OUTPUT"
          printf 'private_key=%s\n' "$private_key" >> "$GITHUB_OUTPUT"

      - name: Receive and decrypt exactly one operator credential
        id: credential
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KEY_ID: ${{ steps.key.outputs.key_id }}
          PRIVATE_KEY: ${{ steps.key.outputs.private_key }}
        run: |
          set -euo pipefail
          marker="<!-- lambda-bootstrap-ciphertext:${KEY_ID} -->"
          deadline=$(( $(date +%s) + 2400 ))
          ciphertext=''
          while (( $(date +%s) < deadline )); do
            comments="$(gh api "repos/$GITHUB_REPOSITORY/issues/$TRACKING_ISSUE/comments?per_page=100")"
            matches="$(jq -c --arg marker "$marker" \
              '[.[] | select(.user.login == "ORESoftware" and (.body | contains($marker)))]' \
              <<<"$comments")"
            count="$(jq 'length' <<<"$matches")"
            if [[ "$count" -gt 1 ]]; then
              echo 'More than one matching ciphertext comment exists.' >&2
              exit 1
            fi
            if [[ "$count" -eq 1 ]]; then
              body="$(jq -r '.[0].body' <<<"$matches")"
              ciphertext="$(sed -n 's/^ciphertext_b64: //p' <<<"$body")"
              break
            fi
            sleep 10
          done
          [[ -n "$ciphertext" ]] || { echo 'Timed out waiting for run-bound ciphertext.' >&2; exit 1; }
          [[ "$ciphertext" =~ ^[A-Za-z0-9+/=]+$ ]] || { echo 'Ciphertext is not canonical base64.' >&2; exit 1; }
          cipher_file="$RUNNER_TEMP/lambda-bootstrap-${KEY_ID}.cipher"
          token_file="$RUNNER_TEMP/lambda-bootstrap-${KEY_ID}.token"
          printf '%s' "$ciphertext" | base64 -d > "$cipher_file"
          openssl pkeyutl -decrypt \
            -inkey "$PRIVATE_KEY" \
            -in "$cipher_file" \
            -out "$token_file" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256
          chmod 0600 "$token_file"
          token="$(cat "$token_file")"
          [[ "$token" == gh* ]] || { echo 'Decrypted value is not a GitHub token.' >&2; exit 1; }
          echo "::add-mask::$token"
          printf 'token_file=%s\n' "$token_file" >> "$GITHUB_OUTPUT"
          printf 'cipher_file=%s\n' "$cipher_file" >> "$GITHUB_OUTPUT"

      - name: Resume repositories, tested branches, PRs, and exact green merges
        shell: bash
        env:
          TOKEN_FILE: ${{ steps.credential.outputs.token_file }}
          RECEIPT: ${{ runner.temp }}/lambda-rollout-receipt.json
          WORK_ROOT: ${{ runner.temp }}/lambda-repository-work
          KEEP_WORK_ROOT: "0"
          CHECK_TIMEOUT_SECONDS: "2700"
        run: |
          set -euo pipefail
          token="$(cat "$TOKEN_FILE")"
          echo "::add-mask::$token"
          real_gh="$(command -v gh)"
          real_cargo="$(command -v cargo)"
          shim_dir="$RUNNER_TEMP/lambda-bootstrap-command-shims"
          mkdir -p "$shim_dir"
          cat > "$shim_dir/gh" <<EOF
          #!/usr/bin/env bash
          exec bash "$GITHUB_WORKSPACE/scripts/gh-graphql-rate-limit-fallback.sh" "\$@"
          EOF
          cat > "$shim_dir/cargo" <<EOF
          #!/usr/bin/env bash
          exec bash "$GITHUB_WORKSPACE/scripts/cargo-canonical-format-shim.sh" "\$@"
          EOF
          chmod 0755 "$shim_dir/gh" "$shim_dir/cargo"
          PATH="$shim_dir:$PATH" \
            REAL_GH="$real_gh" \
            REAL_CARGO="$real_cargo" \
            GH_TOKEN="$token" \
            bash scripts/bootstrap-lambda-repositories-live.sh apply

      - name: Publish completion evidence to tracking issue
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RECEIPT: ${{ runner.temp }}/lambda-rollout-receipt.json
          KEY_ID: ${{ steps.key.outputs.key_id }}
        run: |
          set -euo pipefail
          complete="$(jq -r .complete "$RECEIPT")"
          count="$(jq '[.repositories[] | select(.state == "merged" or .state == "already_complete")] | length' "$RECEIPT")"
          table="$(jq -r '.repositories[] | "| `" + .repository + "` | " + .state + " | " + (.pr_url // "") + " | `" + (.merge_sha // "") + "` |"' "$RECEIPT")"
          body="$(printf '<!-- lambda-bootstrap-complete:%s -->\n\n## Ten-organization Lambda repository rollout\n\n- complete: `%s`\n- completed repositories: `%s`\n- source SHA: `%s`\n- manifest SHA-256: `%s`\n- transport: GraphQL plus Git\n- formatting: normalize then exact-head check\n\n| Repository | State | PR | Merge SHA |\n|---|---|---|---|\n%s\n' \
            "$KEY_ID" "$complete" "$count" "$GITHUB_SHA" "$EXPECTED_MANIFEST_SHA256" "$table")"
          jq -n --arg body "$body" '{body:$body}' | \
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$TRACKING_ISSUE/comments" --input - >/dev/null

      - name: Record failed recovery without exposing credentials
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KEY_ID: ${{ steps.key.outputs.key_id }}
        run: |
          set -euo pipefail
          body="<!-- lambda-bootstrap-failed:${KEY_ID} -->\n\nThe idempotent GraphQL/Rustfmt recovery did not complete. Inspect workflow run ${GITHUB_RUN_ID}; no credential is included in this comment. Reconcile existing repositories, branches, and PRs rather than recreating them."
          jq -n --arg body "$body" '{body:$body}' | \
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$TRACKING_ISSUE/comments" --input - >/dev/null

      - name: Upload machine-readable receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lambda-repository-rustfmt-recovery-${{ github.sha }}
          path: ${{ runner.temp }}/lambda-rollout-receipt.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Destroy run-bound credential material
        if: always()
        shell: bash
        env:
          PRIVATE_KEY: ${{ steps.key.outputs.private_key }}
          TOKEN_FILE: ${{ steps.credential.outputs.token_file }}
          CIPHER_FILE: ${{ steps.credential.outputs.cipher_file }}
        run: |
          set -euo pipefail
          for file in "$PRIVATE_KEY" "$TOKEN_FILE" "$CIPHER_FILE"; do
            [[ -n "$file" && -e "$file" ]] || continue
            chmod 0600 "$file" || true
            if command -v shred >/dev/null 2>&1; then
              shred -u "$file" || rm -f "$file"
            else
              rm -f "$file"
            fi
          done
