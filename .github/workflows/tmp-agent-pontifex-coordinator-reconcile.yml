name: Temporary Agent Pontifex coordinator reconciliation

on:
  push:
    branches:
      - agent/agent-pontifex-coordinator-discovery
    paths:
      - .github/workflows/tmp-agent-pontifex-coordinator-reconcile.yml

permissions:
  contents: write

concurrency:
  group: temporary-agent-pontifex-coordinator-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact trigger commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy

      - name: Apply bounded reconciliation
        run: python3 scripts/tmp-reconcile-agent-pontifex-coordinator.py

      - name: Format changed Rust modules
        run: rustfmt --edition 2021 src/agent_pontifex_discovery.rs src/lib.rs src/app.rs

      - name: Test discovery module in isolation
        run: |
          mkdir -p /tmp/agent-pontifex-coordinator-check/src
          cp src/agent_pontifex_discovery.rs /tmp/agent-pontifex-coordinator-check/src/lib.rs
          cat > /tmp/agent-pontifex-coordinator-check/Cargo.toml <<'EOF'
          [package]
          name = "agent-pontifex-coordinator-check"
          version = "0.0.0"
          edition = "2021"
          publish = false
          [dependencies]
          serde = { version = "1", features = ["derive"] }
          serde_json = "1"
          EOF
          cargo clippy --manifest-path /tmp/agent-pontifex-coordinator-check/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path /tmp/agent-pontifex-coordinator-check/Cargo.toml

      - name: Verify exact scope and remove temporary machinery
        run: |
          rm scripts/tmp-reconcile-agent-pontifex-coordinator.py
          rm .github/workflows/tmp-agent-pontifex-coordinator-reconcile.yml
          git diff --check
          git status --short

      - name: Commit only reviewed reconciliation
        env:
          BRANCH_NAME: agent/agent-pontifex-coordinator-discovery
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          git fetch origin "$BRANCH_NAME"
          test "$(git rev-parse "origin/$BRANCH_NAME")" = "$TRIGGER_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            .github/workflows/tmp-agent-pontifex-coordinator-reconcile.yml \
            scripts/tmp-reconcile-agent-pontifex-coordinator.py \
            README.md \
            src/agent_pontifex_discovery.rs \
            src/app.rs \
            src/lib.rs
          git commit -m "feat: expose Agent Pontifex coordinator discovery"
          git push origin "HEAD:$BRANCH_NAME"
