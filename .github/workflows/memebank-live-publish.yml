name: MemeBank source-v2 live publication

'on':
  push:
    branches:
      - agent/den-1005-memebank-live-publication-20260805
    paths:
      - .github/workflows/memebank-live-publish.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: memebank-source-v2-live-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact publication branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/memebank-live-publish.yml

      - name: Compile publisher and validation suites
        run: |
          python3 -m py_compile \
            scripts/publish_memebank_source_v2_live.py \
            scripts/test_publish_memebank_source_v2_live.py \
            tools/memebank_live/*.py \
            repository-fleets/validate_memebank_source_v2.py \
            repository-fleets/test_validate_memebank_source_v2.py

      - name: Run fail-closed publisher and carrier tests
        run: |
          python3 -m unittest -v \
            scripts/test_publish_memebank_source_v2_live.py \
            repository-fleets/test_validate_memebank_source_v2.py
          python3 repository-fleets/validate_memebank_source_v2.py

      - name: Create one-run encrypted credential handoff
        id: handoff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          private_key="$RUNNER_TEMP/memebank-handoff-private.pem"
          public_key="$RUNNER_TEMP/memebank-handoff-public.pem"
          token_file="$RUNNER_TEMP/memebank-publication-token"
          artifact_dir="$RUNNER_TEMP/memebank-live-publication"
          nonce="$(openssl rand -hex 24)"

          openssl genpkey \
            -algorithm RSA \
            -pkeyopt rsa_keygen_bits:3072 \
            -out "$private_key" >/dev/null 2>&1
          openssl pkey -in "$private_key" -pubout -out "$public_key"
          public_key_b64="$(base64 -w0 "$public_key")"

          body="$(jq -n \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg nonce "$nonce" \
            --arg public_key_b64 "$public_key_b64" \
            '{run_id:$run_id,nonce:$nonce,public_key_b64:$public_key_b64}' \
            | sed '1s/^/MEMEBANK_HANDOFF_V1\n/')"
          handoff_comment_id="$(gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/issues/94/comments" \
            -f body="$body" \
            --jq '.id')"

          echo "nonce=$nonce" >> "$GITHUB_OUTPUT"
          echo "handoff_comment_id=$handoff_comment_id" >> "$GITHUB_OUTPUT"
          echo "private_key=$private_key" >> "$GITHUB_OUTPUT"
          echo "token_file=$token_file" >> "$GITHUB_OUTPUT"
          echo "artifact_dir=$artifact_dir" >> "$GITHUB_OUTPUT"
          mkdir -p "$artifact_dir"
          chmod 700 "$artifact_dir"

      - name: Receive and decrypt one-run credential envelope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HANDOFF_NONCE: ${{ steps.handoff.outputs.nonce }}
          HANDOFF_PRIVATE_KEY: ${{ steps.handoff.outputs.private_key }}
          MEMEBANK_TOKEN_FILE: ${{ steps.handoff.outputs.token_file }}
        run: |
          set -euo pipefail
          umask 077
          deadline=$((SECONDS + 1800))
          envelope_comment_id=""
          envelope_body=""

          while (( SECONDS < deadline )); do
            comments="$(gh api "repos/$GITHUB_REPOSITORY/issues/94/comments?per_page=100")"
            envelope_comment_id="$(jq -r \
              --arg run_id "$GITHUB_RUN_ID" \
              --arg nonce "$HANDOFF_NONCE" \
              '[.[] | select(.body | startswith("MEMEBANK_ENVELOPE_V1\\n")) | select(.body | contains("run_id=" + $run_id)) | select(.body | contains("nonce=" + $nonce))] | last | .id // empty' \
              <<<"$comments")"
            if [[ -n "$envelope_comment_id" ]]; then
              envelope_body="$(jq -r \
                --argjson id "$envelope_comment_id" \
                '.[] | select(.id == $id) | .body' \
                <<<"$comments")"
              break
            fi
            sleep 5
          done

          if [[ -z "$envelope_comment_id" || -z "$envelope_body" ]]; then
            echo "Encrypted credential envelope was not received for this run." >&2
            exit 1
          fi

          ciphertext="$(sed -n 's/^ciphertext=//p' <<<"$envelope_body" | tail -n1)"
          if [[ -z "$ciphertext" ]]; then
            echo "Credential envelope is missing ciphertext." >&2
            exit 1
          fi

          printf '%s' "$ciphertext" | base64 -d > "$RUNNER_TEMP/memebank-envelope.bin"
          openssl pkeyutl \
            -decrypt \
            -inkey "$HANDOFF_PRIVATE_KEY" \
            -in "$RUNNER_TEMP/memebank-envelope.bin" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -out "$RUNNER_TEMP/memebank-envelope.json"

          provided_nonce="$(jq -r '.nonce // empty' "$RUNNER_TEMP/memebank-envelope.json")"
          token="$(jq -r '.token // empty' "$RUNNER_TEMP/memebank-envelope.json")"
          if [[ "$provided_nonce" != "$HANDOFF_NONCE" ]]; then
            echo "Credential envelope nonce mismatch." >&2
            exit 1
          fi
          if [[ ! "$token" =~ ^(ghp_|github_pat_)[A-Za-z0-9_]+$ ]]; then
            echo "Credential envelope did not contain a supported GitHub token shape." >&2
            exit 1
          fi

          echo "::add-mask::$token"
          printf '%s' "$token" > "$MEMEBANK_TOKEN_FILE"
          chmod 600 "$MEMEBANK_TOKEN_FILE"

          GH_TOKEN="$token" gh api /user >/dev/null
          is_admin="$(GH_TOKEN="$token" gh api /repos/memebank/.github --jq '.permissions.admin')"
          if [[ "$is_admin" != "true" ]]; then
            echo "Credential does not have administrator access to memebank/.github." >&2
            exit 1
          fi

          gh api --method DELETE \
            "repos/$GITHUB_REPOSITORY/issues/comments/$envelope_comment_id"
          rm -f \
            "$RUNNER_TEMP/memebank-envelope.bin" \
            "$RUNNER_TEMP/memebank-envelope.json"

      - name: Create repositories, push exact source, create Project and merge PRs
        shell: bash
        env:
          MEMEBANK_TOKEN_FILE: ${{ steps.handoff.outputs.token_file }}
          MEMEBANK_ARTIFACT_DIR: ${{ steps.handoff.outputs.artifact_dir }}
        run: |
          set -euo pipefail
          python3 scripts/publish_memebank_source_v2_live.py \
            --repository "$GITHUB_WORKSPACE" \
            --token-file "$MEMEBANK_TOKEN_FILE" \
            --output-directory "$MEMEBANK_ARTIFACT_DIR" \
            --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --check-wait-seconds 180

      - name: Publish live-publication summary
        if: always()
        shell: bash
        env:
          MEMEBANK_ARTIFACT_DIR: ${{ steps.handoff.outputs.artifact_dir }}
        run: |
          if [[ -f "$MEMEBANK_ARTIFACT_DIR/memebank-publication-ledger.json" ]]; then
            {
              echo '## MemeBank source-v2 live publication'
              echo
              jq -r '"- GitHub Project: [\(.project.title)](\(.project.url))\n- Tracking issue: \(.tracking_issue)\n- Source archive: `\(.source_archive_sha256)`\n- Repositories: \(.summary.repositories_total)\n- Created: \(.summary.repositories_created)\n- Initial source pushes: \(.summary.initial_source_pushes)\n- Provenance PRs: \(.summary.provenance_pull_requests)\n- Provenance PRs merged: \(.summary.provenance_pull_requests_merged)\n- Failures: \(.summary.failures)"' \
                "$MEMEBANK_ARTIFACT_DIR/memebank-publication-ledger.json"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload redacted publication ledger
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: memebank-live-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.handoff.outputs.artifact_dir }}
          retention-days: 14
          if-no-files-found: warn

      - name: Destroy one-run credential material
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HANDOFF_COMMENT_ID: ${{ steps.handoff.outputs.handoff_comment_id }}
          MEMEBANK_TOKEN_FILE: ${{ steps.handoff.outputs.token_file }}
          HANDOFF_PRIVATE_KEY: ${{ steps.handoff.outputs.private_key }}
        run: |
          set +e
          rm -f "$MEMEBANK_TOKEN_FILE" "$HANDOFF_PRIVATE_KEY"
          if [[ -n "$HANDOFF_COMMENT_ID" ]]; then
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/issues/comments/$HANDOFF_COMMENT_ID" \
              -f body="MEMEBANK_HANDOFF_V1_CONSUMED\nrun_id=$GITHUB_RUN_ID"
          fi

      - name: Remove successful one-shot workflow from the feature branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/memebank-live-publish.yml
          git add .github/workflows/memebank-live-publish.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(DEN-1005): remove successful one-shot publisher'
          git push origin HEAD:agent/den-1005-memebank-live-publication-20260805
