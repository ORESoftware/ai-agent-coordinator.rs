name: MemeBank source-v2 live publication

on:
  push:
    branches:
      - agent/den-1005-memebank-live-publication-20260805
    paths:
      - .github/workflows/memebank-live-publish.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: memebank-source-v2-live-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment:
      name: nightly-org-maintenance
      deployment: false
    steps:
      - name: Check out exact publication branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/memebank-live-publish.yml

      - name: Compile publisher and validation suites
        run: |
          python3 -m py_compile \
            scripts/publish_memebank_source_v2_live.py \
            scripts/test_publish_memebank_source_v2_live.py \
            tools/memebank_live/*.py \
            repository-fleets/validate_memebank_source_v2.py \
            repository-fleets/test_validate_memebank_source_v2.py

      - name: Run fail-closed publisher and carrier tests
        run: |
          python3 -m unittest -v \
            scripts/test_publish_memebank_source_v2_live.py \
            repository-fleets/test_validate_memebank_source_v2.py
          python3 repository-fleets/validate_memebank_source_v2.py

      - name: Mint owner-scoped MemeBank publication token
        id: memebank-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.PORTFOLIO_GITHUB_APP_ID }}
          private-key: ${{ secrets.PORTFOLIO_GITHUB_APP_PRIVATE_KEY }}
          owner: memebank
          skip-token-revoke: true
          permission-administration: write
          permission-checks: read
          permission-contents: write
          permission-issues: write
          permission-metadata: read
          permission-organization-projects: write
          permission-pull-requests: write
          permission-statuses: read
          permission-workflows: write

      - name: Materialize token and private artifact directory
        shell: bash
        env:
          MEMEBANK_TOKEN: ${{ steps.memebank-token.outputs.token }}
        run: |
          set -euo pipefail
          umask 077
          token_file="$RUNNER_TEMP/memebank-installation-token"
          artifact_dir="$RUNNER_TEMP/memebank-live-publication"
          printf '%s' "$MEMEBANK_TOKEN" > "$token_file"
          mkdir -p "$artifact_dir"
          chmod 600 "$token_file"
          chmod 700 "$artifact_dir"
          echo "MEMEBANK_TOKEN_FILE=$token_file" >> "$GITHUB_ENV"
          echo "MEMEBANK_ARTIFACT_DIR=$artifact_dir" >> "$GITHUB_ENV"

      - name: Create repositories, push exact source, create Project and merge PRs
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/publish_memebank_source_v2_live.py \
            --repository "$GITHUB_WORKSPACE" \
            --token-file "$MEMEBANK_TOKEN_FILE" \
            --output-directory "$MEMEBANK_ARTIFACT_DIR" \
            --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --check-wait-seconds 600

      - name: Publish live-publication summary
        if: always()
        shell: bash
        run: |
          if [[ -f "$MEMEBANK_ARTIFACT_DIR/memebank-publication-ledger.json" ]]; then
            {
              echo '## MemeBank source-v2 live publication'
              echo
              jq -r '"- GitHub Project: [\(.project.title)](\(.project.url))\n- Tracking issue: \(.tracking_issue)\n- Source archive: `\(.source_archive_sha256)`\n- Repositories: \(.summary.repositories_total)\n- Created: \(.summary.repositories_created)\n- Initial source pushes: \(.summary.initial_source_pushes)\n- Provenance PRs: \(.summary.provenance_pull_requests)\n- Provenance PRs merged: \(.summary.provenance_pull_requests_merged)\n- Failures: \(.summary.failures)"' \
                "$MEMEBANK_ARTIFACT_DIR/memebank-publication-ledger.json"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload redacted publication ledger
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: memebank-live-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/memebank-live-publication
          retention-days: 14
          if-no-files-found: warn

      - name: Revoke MemeBank installation token
        if: always() && steps.memebank-token.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.memebank-token.outputs.token }}
        run: |
          gh api --method DELETE /installation/token || true
          rm -f "$MEMEBANK_TOKEN_FILE"

      - name: Remove successful one-shot workflow from the feature branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/memebank-live-publish.yml
          git add .github/workflows/memebank-live-publish.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(DEN-1005): remove successful one-shot publisher'
          git push origin HEAD:agent/den-1005-memebank-live-publication-20260805
