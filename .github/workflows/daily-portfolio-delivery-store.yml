name: Daily portfolio delivery PostgreSQL repository

on:
  pull_request:
    paths:
      - '.github/workflows/daily-portfolio-delivery-store.yml'
      - 'docs/daily-portfolio-delivery-store.md'
      - 'src/daily_portfolio_delivery.rs'
      - 'src/daily_portfolio_delivery_store.rs'
      - 'src/lib.rs'
      - 'tests/daily_portfolio_delivery_state.rs'
      - 'tests/daily_portfolio_delivery_store.rs'
      - 'tests/fixtures/ai_agent_coordinator.schema.sql'
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-portfolio-delivery-store.yml'
      - 'docs/daily-portfolio-delivery-store.md'
      - 'src/daily_portfolio_delivery.rs'
      - 'src/daily_portfolio_delivery_store.rs'
      - 'src/lib.rs'
      - 'tests/daily_portfolio_delivery_state.rs'
      - 'tests/daily_portfolio_delivery_store.rs'
      - 'tests/fixtures/ai_agent_coordinator.schema.sql'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-portfolio-delivery-store-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.9-bookworm@sha256:47f917f7409eacd22fc5dfb1dee634e1b55cf0c01d1a7eb701be2227a03e0641
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coordinator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres --dbname coordinator"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/coordinator
      RUST_BACKTRACE: '1'
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout coordinator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/daily-portfolio-delivery-store.yml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.97.1'
          components: rustfmt, clippy

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Verify and apply the canonical schema fixture
        shell: bash
        run: |
          set -euo pipefail
          schema="$GITHUB_WORKSPACE/tests/fixtures/ai_agent_coordinator.schema.sql"
          test -f "$schema"
          actual="$(sha256sum "$schema" | awk '{print $1}')"
          expected='fa987f49dfa0342103689dd8cadee69984ea5248a0b399cd456bbb62c7a25e00'
          test "$actual" = "$expected"
          docker run --rm \
            --network host \
            --env PGPASSWORD=postgres \
            --volume "$schema:/schema.sql:ro" \
            postgres:17.9-bookworm@sha256:47f917f7409eacd22fc5dfb1dee634e1b55cf0c01d1a7eb701be2227a03e0641 \
            psql \
              --host 127.0.0.1 \
              --username postgres \
              --dbname coordinator \
              --set ON_ERROR_STOP=1 \
              --file /schema.sql

      - name: Enforce formatting
        run: cargo fmt --all -- --check

      - name: Compile focused delivery targets
        run: >-
          cargo test --locked
          --test daily_portfolio_delivery_state
          --test daily_portfolio_delivery_store
          --no-run

      - name: Run storage-independent delivery regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/daily-portfolio-delivery-store
          cargo test --locked --test daily_portfolio_delivery_state -- --nocapture \
            2>&1 | tee test-results/daily-portfolio-delivery-store/state.txt

      - name: Run PostgreSQL race, restart, receipt, and baseline regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --test daily_portfolio_delivery_store -- --nocapture \
            2>&1 | tee test-results/daily-portfolio-delivery-store/postgres.txt

      - name: Run focused Clippy
        run: >-
          cargo clippy --locked
          --lib
          --test daily_portfolio_delivery_state
          --test daily_portfolio_delivery_store
          -- -D warnings

      - name: Build release library
        run: cargo build --locked --release --lib

      - name: Record bounded repository evidence
        shell: bash
        run: |
          set -euo pipefail
          cat > test-results/daily-portfolio-delivery-store/summary.json <<EOF
          {
            "schema_version": "daily_portfolio_delivery_store_evidence.v1",
            "revision": "${GITHUB_SHA}",
            "postgres_image": "postgres:17.9-bookworm",
            "schema_fixture_sha256": "fa987f49dfa0342103689dd8cadee69984ea5248a0b399cd456bbb62c7a25e00",
            "result": "passed",
            "contracts": [
              "schema-verification",
              "immutable-plan",
              "concurrent-fenced-claim",
              "generation-cas",
              "restart-reload",
              "retry-accounting",
              "expired-send-ambiguity",
              "receipt-reconciliation",
              "scheduled-baseline-isolation",
              "stale-fence-rejection"
            ]
          }
          EOF

      - name: Upload exact-head repository evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: daily-portfolio-delivery-store-${{ github.sha }}
          path: test-results/daily-portfolio-delivery-store
          retention-days: 14
          if-no-files-found: error
