name: Publish HypeSiege and StreemPilot repository fleets

on:
  push:
    branches:
      - agent/hypesiege-streempilot-live-publish-20260731
    paths:
      - repository-fleets/hypesiege-streempilot/**
      - .github/workflows/hypesiege-streempilot-live-publish.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hypesiege-streempilot-live-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Reconstruct and validate the sealed fleet
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /mnt/data
          cat repository-fleets/hypesiege-streempilot/generator.py.gz.b64.part-* \
            | base64 --decode \
            | gzip --decompress > /tmp/generate_hypesiege_streempilot.py
          python3 -m py_compile /tmp/generate_hypesiege_streempilot.py
          python3 /tmp/generate_hypesiege_streempilot.py
          python3 /mnt/data/hypesiege-streempilot-fleet/publish.py
          test "$(git -C /mnt/data/hypesiege-streempilot-fleet/hypesiege/hypesiege-monorepo ls-files --stage apps | awk '$1 == 160000 {count++} END {print count+0}')" = 14
          test "$(git -C /mnt/data/hypesiege-streempilot-fleet/streempilot/streempilot-monorepo ls-files --stage apps | awk '$1 == 160000 {count++} END {print count+0}')" = 16

      - name: Publish HypeSiege
        id: hypesiege
        continue-on-error: true
        shell: bash
        env:
          GITHUB_REPOSITORY_ADMIN_TOKEN: ${{ secrets.HYPESIEGE_REPOSITORY_ADMIN_TOKEN || secrets.GITHUB_REPOSITORY_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GITHUB_REPOSITORY_ADMIN_TOKEN:-}" ]]; then
            echo "::error::No HypeSiege repository-administration token is configured."
            exit 78
          fi
          python3 /mnt/data/hypesiege-streempilot-fleet/publish.py --execute --org hypesiege

      - name: Publish StreemPilot
        id: streempilot
        continue-on-error: true
        shell: bash
        env:
          GITHUB_REPOSITORY_ADMIN_TOKEN: ${{ secrets.STREEMPILOT_REPOSITORY_ADMIN_TOKEN || secrets.GITHUB_REPOSITORY_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GITHUB_REPOSITORY_ADMIN_TOKEN:-}" ]]; then
            echo "::error::No StreemPilot repository-administration token is configured."
            exit 78
          fi
          python3 /mnt/data/hypesiege-streempilot-fleet/publish.py --execute --org streempilot

      - name: Verify every remote main head
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import urllib.error
          import urllib.request

          root = pathlib.Path('/mnt/data/hypesiege-streempilot-fleet')
          manifest = json.loads((root / 'MANIFEST.json').read_text())
          errors = []
          verified = 0
          for record in manifest['repositories']:
              url = f"https://api.github.com/repos/{record['full_name']}/commits/main"
              request = urllib.request.Request(url, headers={
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'hypesiege-streempilot-verifier',
              })
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      actual = json.load(response)['sha']
              except urllib.error.HTTPError as error:
                  errors.append(f"{record['full_name']}: HTTP {error.code}")
                  continue
              if actual != record['commit']:
                  errors.append(f"{record['full_name']}: {actual} != {record['commit']}")
              else:
                  verified += 1
          print(f'verified {verified}/{len(manifest["repositories"])} remote main heads')
          if errors:
              raise SystemExit('\n'.join(errors))
          PY

      - name: Require both organization publications
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.hypesiege.outcome }}" = success
          test "${{ steps.streempilot.outcome }}" = success
