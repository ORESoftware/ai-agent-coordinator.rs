name: Publish HypeSiege and StreemPilot repository fleets

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - repository-fleets/hypesiege-streempilot/**
      - .github/hypesiege-streempilot-device-publish.sh
      - .github/workflows/hypesiege-streempilot-live-publish.yml

permissions:
  contents: read
  statuses: write

concurrency:
  group: hypesiege-streempilot-live-publish-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the sealed fleet and publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Authorize the owner and publish all 32 repositories
        shell: bash
        env:
          GH_CONFIG_DIR: ${{ runner.temp }}/hypesiege-streempilot-gh-config
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COMMENT_TOKEN: ${{ github.token }}
          EXPECTED_LOGIN: ORESoftware
        run: bash .github/hypesiege-streempilot-device-publish.sh
