name: Temporary DEN-1610 canonical Clippy fix

on:
  push:
    branches:
      - agent/den-1610-authenticated-adapters-current-main-20260804
    paths:
      - .github/workflows/tmp-den-1610-clippy-fix.yml

permissions:
  contents: write

concurrency:
  group: den-1610-canonical-clippy-fix
  cancel-in-progress: false

jobs:
  fix:
    if: github.repository == 'ORESoftware/ai-agent-coordinator.rs'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1610-authenticated-adapters-current-main-20260804
          fetch-depth: 1
          persist-credentials: true

      - name: Apply the exact lint fix, format, and retire this workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/prompt_reconciliation_adapters.rs')
          text = path.read_text()
          old = '''    envelope
              .get("data")
              .cloned()
              .ok_or_else(|| {
                  if mutation {
                      AdapterError::AmbiguousMutation { operation }
                  } else {
                      AdapterError::Malformed { operation }
                  }
              })
          '''
          new = '''    envelope
              .get("data")
              .cloned()
              .ok_or({
                  if mutation {
                      AdapterError::AmbiguousMutation { operation }
                  } else {
                      AdapterError::Malformed { operation }
                  }
              })
          '''
          if text.count(old) != 1:
              raise SystemExit('expected exactly one DEN-1610 lint target')
          path.write_text(text.replace(old, new))
          PY

          rustup toolchain install 1.97.0 --component rustfmt --profile minimal --no-self-update
          cargo +1.97.0 fmt --all
          rm -f .github/workflows/tmp-den-1610-clippy-fix.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(DEN-1610): satisfy canonical Clippy semantics'
          git push origin HEAD:agent/den-1610-authenticated-adapters-current-main-20260804
