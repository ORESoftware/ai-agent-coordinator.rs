name: Ores CLI PR172 OTel peer-authority acceptance

on:
  push:
    branches:
      - DEN-4253-ores-cli-pr172-peer-authority-probe
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ores-cli-pr172-otel-peer-authority
  cancel-in-progress: true

env:
  ORES_CLI_MODULE_BLOB: 42eee2e4dea83a9852b3b89e31cf1df87bfab48f
  ORES_CLI_BASE_MODULE_BLOB: 03f6f150d7c0d721348e050ee0f7593da2b91bfb
  TJSV_SHA: 5bab34e08856c47af3600adf40a4aa860fa71c01
  OTEL_CANARY_SHA: a2776abb443b42fffacbb40c00a139029f22c0a9
  ORES_OTEL_RUNTIME_SHA: 277aa47c7da94da921070f1e202574222b383f90

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out probe control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: control
          show-progress: false

      - name: Validate probe workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: control/.github/workflows/ores-cli-pr172-peer-authority.yml

      - name: Check out exact canonical TJSV
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/typespec-json-schema-validator
          ref: ${{ env.TJSV_SHA }}
          persist-credentials: false
          fetch-depth: 1
          path: tjsv
          show-progress: false

      - name: Check out merged OTel test-org peer canary
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ores-otel-test/contract-conformance-tests
          ref: ${{ env.OTEL_CANARY_SHA }}
          persist-credentials: false
          fetch-depth: 1
          path: otel-canary
          show-progress: false

      - name: Check out exact public ORES OTEL runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ores-otel/ores.otel.log
          ref: ${{ env.ORES_OTEL_RUNTIME_SHA }}
          persist-credentials: false
          fetch-depth: 1
          path: ores-otel-runtime
          show-progress: false

      - name: Verify immutable public source identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C tjsv rev-parse HEAD)" = "$TJSV_SHA"
          test "$(git -C otel-canary rev-parse HEAD)" = "$OTEL_CANARY_SHA"
          test "$(git -C ores-otel-runtime rev-parse HEAD)" = "$ORES_OTEL_RUNTIME_SHA"
          git -C control diff --check
          git -C tjsv diff --check
          git -C otel-canary diff --check
          git -C ores-otel-runtime diff --check

      - name: Install Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          package-manager-cache: false

      - name: Install canonical validator from committed lockfile
        working-directory: tjsv
        run: npm ci

      - name: Re-run merged test-org TypeSpec to Schema-B parity canary
        working-directory: otel-canary
        env:
          OTEL_TJSV_REPORT: tmp/otel-peer/report.json
          OTEL_TJSV_GENERATED: tmp/otel-peer/generated
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/otel-peer/generated
          node "$GITHUB_WORKSPACE/tjsv/bin/typespec-json-schema-validator.mjs" check \
            --typespec=otel-peer-authority/main.tsp \
            --schema=otel-peer-authority/authored.schema.json \
            --instances=otel-peer-authority/instances \
            --report=tmp/otel-peer/report.json \
            --contract-ir=tmp/otel-peer/contract-ir.json \
            --output-dir=tmp/otel-peer/generated
          node otel-peer-authority/verify-receipt.mjs

      - name: Build exact public ORES OTEL runtime
        working-directory: ores-otel-runtime
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npx tsc -p tsconfig.build.json

      - name: Re-run test-org TOML runtime witness
        working-directory: otel-canary
        env:
          ORES_OTEL_RUNTIME: ${{ github.workspace }}/ores-otel-runtime
        run: node otel-peer-authority/runtime-canary.mjs

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt

      - name: Reconstruct exact ores-cli PR172 OTel audit module
        shell: bash
        run: |
          set -euo pipefail
          base=control/evidence/ores-cli-pr172/base/runtime_toml_otel.rs
          patch_file=control/evidence/ores-cli-pr172/ores-cli-pr172.diff
          harness="$RUNNER_TEMP/ores-cli-pr172-harness"
          test "$(git hash-object "$base")" = "$ORES_CLI_BASE_MODULE_BLOB"
          cp -R control/evidence/ores-cli-pr172/template "$harness"
          cp "$base" "$harness/src/audit/runtime_toml_otel.rs"
          (cd "$harness" && patch --batch --forward -p1 < "$GITHUB_WORKSPACE/$patch_file")
          test "$(git hash-object "$harness/src/audit/runtime_toml_otel.rs")" = "$ORES_CLI_MODULE_BLOB"
          printf '%s\n' "$harness" > "$RUNNER_TEMP/ores-cli-pr172-harness-path"

      - name: Compile and execute exact changed Rust module
        shell: bash
        run: |
          set -euo pipefail
          harness=$(cat "$RUNNER_TEMP/ores-cli-pr172-harness-path")
          cargo fmt --manifest-path "$harness/Cargo.toml" -- --check
          cargo test --manifest-path "$harness/Cargo.toml" -- --nocapture
          cargo clippy --manifest-path "$harness/Cargo.toml" --all-targets -- -D warnings

      - name: Prove peer-authority lint semantics are in exact blob
        shell: bash
        run: |
          set -euo pipefail
          harness=$(cat "$RUNNER_TEMP/ores-cli-pr172-harness-path")
          module="$harness/src/audit/runtime_toml_otel.rs"
          test "$(git hash-object "$module")" = "$ORES_CLI_MODULE_BLOB"
          grep -F 'otel-peer-authority-incomplete' "$module"
          grep -F 'otel-peer-authorities-wired' "$module"
          grep -F 'TypeSpec and authored JSON Schema are first-class independent peers' "$module"
          grep -F 'transpile TypeSpec to comparison Schema B' "$module"
          grep -F 'independently authored JSON Schema Draft 2020-12' "$module"

      - name: Prove tracked evidence stayed read-only
        shell: bash
        run: |
          set -euo pipefail
          git -C control diff --exit-code HEAD
          git -C tjsv diff --exit-code HEAD
          git -C otel-canary diff --exit-code HEAD
          git -C ores-otel-runtime diff --exit-code HEAD

      - name: Retain bounded parity evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ores-cli-pr172-peer-authority-${{ env.ORES_CLI_MODULE_BLOB }}
          path: otel-canary/tmp/otel-peer/
          if-no-files-found: warn
          retention-days: 30
