name: Ores CLI PR172 OTel peer-authority acceptance

on:
  push:
    branches:
      - DEN-4253-ores-cli-pr172-peer-authority-probe
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ores-cli-pr172-otel-peer-authority
  cancel-in-progress: true

env:
  ORES_CLI_SHA: 105404efb776e44b134ed1ac25228bbf30a0933e
  TJSV_SHA: 5bab34e08856c47af3600adf40a4aa860fa71c01
  OTEL_CANARY_SHA: a2776abb443b42fffacbb40c00a139029f22c0a9
  ORES_OTEL_RUNTIME_SHA: 277aa47c7da94da921070f1e202574222b383f90

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment: nightly-org-maintenance
    steps:
      - name: Check out probe control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: control

      - name: Validate probe workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: control/.github/workflows/ores-cli-pr172-peer-authority.yml

      - name: Mint least-privilege ores-cli read token
        id: ores-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.PORTFOLIO_GITHUB_APP_ID }}
          private-key: ${{ secrets.PORTFOLIO_GITHUB_APP_PRIVATE_KEY }}
          owner: ORESoftware
          repositories: ores-cli
          skip-token-revoke: true
          permission-contents: read
          permission-metadata: read

      - name: Check out exact private ores-cli candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/ores-cli
          ref: ${{ env.ORES_CLI_SHA }}
          token: ${{ steps.ores-token.outputs.token }}
          persist-credentials: false
          fetch-depth: 1
          path: ores-cli

      - name: Check out exact canonical TJSV
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/typespec-json-schema-validator
          ref: ${{ env.TJSV_SHA }}
          persist-credentials: false
          fetch-depth: 1
          path: tjsv

      - name: Check out merged OTel test-org peer canary
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ores-otel-test/contract-conformance-tests
          ref: ${{ env.OTEL_CANARY_SHA }}
          persist-credentials: false
          fetch-depth: 1
          path: otel-canary

      - name: Check out exact public ORES OTEL runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ores-otel/ores.otel.log
          ref: ${{ env.ORES_OTEL_RUNTIME_SHA }}
          persist-credentials: false
          fetch-depth: 1
          path: ores-otel-runtime

      - name: Verify immutable source identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C ores-cli rev-parse HEAD)" = "$ORES_CLI_SHA"
          test "$(git -C tjsv rev-parse HEAD)" = "$TJSV_SHA"
          test "$(git -C otel-canary rev-parse HEAD)" = "$OTEL_CANARY_SHA"
          test "$(git -C ores-otel-runtime rev-parse HEAD)" = "$ORES_OTEL_RUNTIME_SHA"
          grep -F '"repository": "ORESoftware/typespec-json-schema-validator"' ores-cli/tjsv/source-lock.json
          grep -F "\"revision\": \"$TJSV_SHA\"" ores-cli/tjsv/source-lock.json
          git -C ores-cli diff --check
          git -C tjsv diff --check
          git -C otel-canary diff --check
          git -C ores-otel-runtime diff --check

      - name: Install Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          package-manager-cache: false

      - name: Install canonical validator from committed lockfile
        working-directory: tjsv
        run: npm ci

      - name: Expose exact TJSV executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/tjsv" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          exec node "$GITHUB_WORKSPACE/tjsv/bin/typespec-json-schema-validator.mjs" "\$@"
          EOF
          chmod 0700 "$RUNNER_TEMP/bin/tjsv"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/tjsv" --version

      - name: Re-run merged test-org TypeSpec to Schema-B parity canary
        working-directory: otel-canary
        env:
          OTEL_TJSV_REPORT: tmp/otel-peer/report.json
          OTEL_TJSV_GENERATED: tmp/otel-peer/generated
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/otel-peer/generated
          "$RUNNER_TEMP/bin/tjsv" check \
            --typespec=otel-peer-authority/main.tsp \
            --schema=otel-peer-authority/authored.schema.json \
            --instances=otel-peer-authority/instances \
            --report=tmp/otel-peer/report.json \
            --contract-ir=tmp/otel-peer/contract-ir.json \
            --output-dir=tmp/otel-peer/generated
          node otel-peer-authority/verify-receipt.mjs

      - name: Build exact public ORES OTEL runtime
        working-directory: ores-otel-runtime
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npx tsc -p tsconfig.build.json

      - name: Re-run test-org TOML runtime witness
        working-directory: otel-canary
        env:
          ORES_OTEL_RUNTIME: ${{ github.workspace }}/ores-otel-runtime
        run: node otel-peer-authority/runtime-canary.mjs

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt

      - name: Run focused OTel peer-authority lint regressions
        working-directory: ores-cli
        run: |
          set -euo pipefail
          cargo test --locked runtime_toml_otel -- --nocapture

      - name: Verify complete ores-cli Rust application
        working-directory: ores-cli
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version=1 >/dev/null
          cargo fmt --all --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features
          cargo build --locked --bins

      - name: Prove new OTel lint is compiled into the exact candidate
        working-directory: ores-cli
        run: |
          set -euo pipefail
          grep -F 'otel-peer-authority-incomplete' src/audit/runtime_toml_otel.rs
          grep -F 'otel-peer-authorities-wired' src/audit/runtime_toml_otel.rs
          grep -F 'TypeSpec and authored JSON Schema are first-class independent peers' src/audit/runtime_toml_otel.rs
          grep -F 'output_dir:' src/audit/runtime_toml_otel.rs
          target/debug/oresc --no-json audit repo --path . --profile rust-cli > "$RUNNER_TEMP/repository-audit.txt"
          grep -F 'status=passed command=audit repo' "$RUNNER_TEMP/repository-audit.txt"

      - name: Exercise real oresc contract gate against the independent peers
        working-directory: ores-cli
        shell: bash
        run: |
          set -euo pipefail
          run_dir=$(mktemp -d "$RUNNER_TEMP/ores-cli-otel-peer.XXXXXXXX")
          target/debug/oresc --no-json audit contract \
            --typespec "$GITHUB_WORKSPACE/otel-canary/otel-peer-authority/main.tsp" \
            --schema "$GITHUB_WORKSPACE/otel-canary/otel-peer-authority/authored.schema.json" \
            --report "$run_dir/parity.json" \
            --validator "$RUNNER_TEMP/bin/tjsv" \
            > "$run_dir/result.txt"
          grep -F 'INFO contract-parity-passed' "$run_dir/result.txt"
          grep -F 'status=passed command=audit contract' "$run_dir/result.txt"
          test -s "$run_dir/parity.json"
          test -s "$run_dir/parity.contract-ir.json"
          test -s "$run_dir/parity.consumer-verification.json"

      - name: Reject real TypeSpec JSON-Schema drift fail closed
        working-directory: ores-cli
        shell: bash
        run: |
          set -euo pipefail
          run_dir=$(mktemp -d "$RUNNER_TEMP/ores-cli-drift.XXXXXXXX")
          set +e
          target/debug/oresc --no-json audit contract \
            --typespec "$GITHUB_WORKSPACE/tjsv/test/fixtures/drift/main.tsp" \
            --schema "$GITHUB_WORKSPACE/tjsv/test/fixtures/drift/authored.schema.json" \
            --report "$run_dir/parity.json" \
            --validator "$RUNNER_TEMP/bin/tjsv" \
            > "$run_dir/result.txt"
          status=$?
          set -e
          test "$status" -eq 2
          grep -F 'contract-parity-stopped-for-evaluation' "$run_dir/result.txt"
          grep -F 'status=stopped_for_evaluation command=audit contract' "$run_dir/result.txt"

      - name: Prove source checkouts stayed read-only
        shell: bash
        run: |
          set -euo pipefail
          git -C ores-cli diff --exit-code HEAD
          git -C tjsv diff --exit-code HEAD
          git -C otel-canary diff --exit-code HEAD
          git -C ores-otel-runtime diff --exit-code HEAD

      - name: Retain bounded parity evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ores-cli-pr172-peer-authority-${{ env.ORES_CLI_SHA }}
          path: otel-canary/tmp/otel-peer/
          if-no-files-found: warn
          retention-days: 30
