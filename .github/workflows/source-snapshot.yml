name: Source snapshot

on:
  push:
    branches:
      - agent/seaorm-reconcile-main-snapshot
      - agent/seaorm-reconcile-head-snapshot
  pull_request:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Archive repository source
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=source-snapshot.tar.gz -czf source-snapshot.tar.gz .
      - name: Upload repository source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-${{ github.sha }}
          path: source-snapshot.tar.gz
          retention-days: 1
          if-no-files-found: error
