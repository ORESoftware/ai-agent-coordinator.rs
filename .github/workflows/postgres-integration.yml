name: PostgreSQL integration

on:
  pull_request:
    paths:
      - '.github/workflows/postgres-integration.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/dpm.sh'
      - 'src/**'
      - 'tests/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/postgres-integration.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/dpm.sh'
      - 'src/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coordinator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres --dbname coordinator"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/coordinator
      RUST_BACKTRACE: '1'
    steps:
      - name: Checkout coordinator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate workflow
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/postgres-integration.yml
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.97.0'
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Verify the pinned canonical schema fixture
        shell: bash
        run: |
          set -euo pipefail
          schema="$GITHUB_WORKSPACE/tests/fixtures/ai_agent_coordinator.schema.sql"
          test -f "$schema"
          actual=$(sha256sum "$schema" | awk '{print $1}')
          expected=fa987f49dfa0342103689dd8cadee69984ea5248a0b399cd456bbb62c7a25e00
          test "$actual" = "$expected"
      - name: Apply the canonical ai_agent_coordinator schema fixture
        shell: bash
        run: |
          set -euo pipefail
          schema="$GITHUB_WORKSPACE/tests/fixtures/ai_agent_coordinator.schema.sql"
          docker run --rm \
            --network host \
            --env PGPASSWORD=postgres \
            --volume "$schema:/schema.sql:ro" \
            postgres:17 \
            psql \
              --host 127.0.0.1 \
              --username postgres \
              --dbname coordinator \
              --set ON_ERROR_STOP=1 \
              --file /schema.sql
      - name: Verify the schema boundary
        shell: bash
        run: |
          set -euo pipefail
          tables=$(docker run --rm \
            --network host \
            --env PGPASSWORD=postgres \
            postgres:17 \
            psql \
              --host 127.0.0.1 \
              --username postgres \
              --dbname coordinator \
              --tuples-only \
              --no-align \
              --command "select table_name from information_schema.tables where table_schema = 'ai_agent_coordinator' order by table_name")
          expected=$'daily_portfolio_delivery_baseline\ndaily_portfolio_delivery_runs\njobs\nlinear_mutations\nmodel_usage'
          test "$tables" = "$expected"
          public_tables=$(docker run --rm \
            --network host \
            --env PGPASSWORD=postgres \
            postgres:17 \
            psql \
              --host 127.0.0.1 \
              --username postgres \
              --dbname coordinator \
              --tuples-only \
              --no-align \
              --command "select count(*) from information_schema.tables where table_schema = 'public'")
          test "$public_tables" = '0'
          sequence_exists=$(docker run --rm \
            --network host \
            --env PGPASSWORD=postgres \
            postgres:17 \
            psql \
              --host 127.0.0.1 \
              --username postgres \
              --dbname coordinator \
              --tuples-only \
              --no-align \
              --command "select to_regclass('ai_agent_coordinator.daily_portfolio_delivery_fence_seq') is not null")
          test "$sequence_exists" = 't'
      - name: Exercise the durable briefing delivery SQL contract
        shell: bash
        run: |
          set -euo pipefail
          contract="$GITHUB_WORKSPACE/tests/fixtures/daily-portfolio-delivery.schema.test.sql"
          test -f "$contract"
          docker run --rm \
            --network host \
            --env PGPASSWORD=postgres \
            --volume "$contract:/contract.sql:ro" \
            postgres:17 \
            psql \
              --host 127.0.0.1 \
              --username postgres \
              --dbname coordinator \
              --set ON_ERROR_STOP=1 \
              --file /contract.sql
      - name: Verify exact durable-delivery constraints
        shell: bash
        run: |
          set -euo pipefail
          constraints=$(docker run --rm \
            --network host \
            --env PGPASSWORD=postgres \
            postgres:17 \
            psql \
              --host 127.0.0.1 \
              --username postgres \
              --dbname coordinator \
              --tuples-only \
              --no-align \
              --command "select conname from pg_constraint where connamespace = 'ai_agent_coordinator'::regnamespace and conrelid in ('ai_agent_coordinator.daily_portfolio_delivery_runs'::regclass, 'ai_agent_coordinator.daily_portfolio_delivery_baseline'::regclass) order by conname")
          for name in \
            daily_portfolio_delivery_runs_identity_chk \
            daily_portfolio_delivery_runs_lease_chk \
            daily_portfolio_delivery_runs_state_chk \
            daily_portfolio_delivery_runs_receipt_chk \
            daily_portfolio_delivery_baseline_singleton_chk
          do
            grep -qx "$name" <<<"$constraints"
          done
      - name: Run the complete coordinator-schema test suite
        run: >-
          cargo test --locked --all --
          --skip email_attention::tests::manual_preview_preserves_cursor_and_scheduled_runs_deduplicate_delivery
      - name: Re-run the concurrent claim proof explicitly
        run: >-
          cargo test --locked --test job_queue
          repository_concurrency_cap_prevents_overclaiming
          -- --exact --nocapture
