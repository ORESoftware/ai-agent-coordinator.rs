name: Daily portfolio result collector

on:
  pull_request:
    paths:
      - '.github/workflows/daily-portfolio-result-collector.yml'
      - 'docs/daily-portfolio-result-collector.md'
      - 'tools/collect_daily_portfolio_results.py'
      - 'tools/compose_daily_portfolio_briefing.py'
      - 'tests/test_daily_portfolio_result_collector.py'
      - 'tests/fixtures/daily_portfolio_briefing_input.json'
      - 'tests/fixtures/daily_portfolio_briefing_state.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-portfolio-result-collector.yml'
      - 'docs/daily-portfolio-result-collector.md'
      - 'tools/collect_daily_portfolio_results.py'
      - 'tools/compose_daily_portfolio_briefing.py'
      - 'tests/test_daily_portfolio_result_collector.py'
      - 'tests/fixtures/daily_portfolio_briefing_input.json'
      - 'tests/fixtures/daily_portfolio_briefing_state.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-portfolio-result-collector-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/daily-portfolio-result-collector.yml
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Compile collector, composer, and regressions
        run: >-
          python -m py_compile
          tools/collect_daily_portfolio_results.py
          tools/compose_daily_portfolio_briefing.py
          tests/test_daily_portfolio_result_collector.py
      - name: Run integrity, freshness, and path-safety regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/daily-portfolio-collector
          python -m unittest -v tests/test_daily_portfolio_result_collector.py \
            2>&1 | tee test-results/daily-portfolio-collector/tests.txt
      - name: Emit deterministic collector evidence twice
        shell: bash
        run: |
          set -euo pipefail
          python tests/test_daily_portfolio_result_collector.py \
            --emit-example test-results/daily-portfolio-collector/first
          python tests/test_daily_portfolio_result_collector.py \
            --emit-example test-results/daily-portfolio-collector/second
          cmp \
            test-results/daily-portfolio-collector/first/input.json \
            test-results/daily-portfolio-collector/second/input.json
          cmp \
            test-results/daily-portfolio-collector/first/provenance.json \
            test-results/daily-portfolio-collector/second/provenance.json
      - name: Feed the collected input through the briefing composer
        shell: bash
        run: |
          set -euo pipefail
          python tools/compose_daily_portfolio_briefing.py plan \
            --input test-results/daily-portfolio-collector/first/input.json \
            --state tests/fixtures/daily_portfolio_briefing_state.json \
            --run-mode scheduled \
            --run-key daily-portfolio:scheduled:2026-07-31 \
            --scheduled-run-key daily-portfolio:scheduled:2026-07-31 \
            --scheduled-for 2026-07-31T13:00:00Z \
            --generated-at 2026-07-31T13:02:00Z \
            --timezone America/Chicago \
            --output-json test-results/daily-portfolio-collector/plan.json \
            --output-markdown test-results/daily-portfolio-collector/briefing.md
      - name: Verify bounded provenance and composer compatibility
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('test-results/daily-portfolio-collector')
          briefing_input = json.loads((root / 'first/input.json').read_text())
          provenance = json.loads((root / 'first/provenance.json').read_text())
          plan = json.loads((root / 'plan.json').read_text())
          serialized = json.dumps(provenance, sort_keys=True)

          assert briefing_input['schema_version'] == 'portfolio_briefing_input.v1'
          assert set(briefing_input['lanes']) == {
              'must_act_today',
              'github_linear',
              'engineering_research',
              'ai_technology',
              'career',
              'inbox_relationships',
              'business_growth',
              'prompt_coverage',
          }
          assert provenance['schema_version'] == 'portfolio_briefing_provenance.v1'
          assert provenance['counts'] == {
              'lanes': 8,
              'collected': 8,
              'stale': 0,
              'missing': 0,
          }
          assert len(provenance['lanes']) == 8
          assert 'result_path' not in serialized
          assert 'Platform engineering role' not in serialized
          assert plan['schema_version'] == 'portfolio_briefing_plan.v1'
          assert plan['counts']['selected'] <= 12
          assert len(plan['priorities']) <= 3
          PY
      - name: Upload exact-head collector evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: daily-portfolio-result-collector-${{ github.sha }}
          path: test-results/daily-portfolio-collector
          retention-days: 14
          if-no-files-found: error
