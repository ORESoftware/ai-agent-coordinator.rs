name: DEN-877 root-tree semantic repair

on:
  push:
    branches:
      - agent/den-877-fleet-merge-repair
    paths:
      - .github/workflows/den-877-root-tree-repair.yml

permissions:
  contents: write

concurrency:
  group: den-877-root-tree-semantic-repair
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.repository == 'ORESoftware/ai-agent-coordinator.rs' &&
      github.ref == 'refs/heads/agent/den-877-fleet-merge-repair'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact writable repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/den-877-fleet-merge-repair
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Reconcile payload, final trees, and publication boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import gzip
          import hashlib
          import json
          import shutil
          from pathlib import Path

          root = Path.cwd()
          payload_dir = root / 'repository-fleets' / 'hypesiege-streempilot'
          manifest_path = root / 'repository-fleets' / 'hypesiege-streempilot.json'
          reconstructor_path = root / 'scripts' / 'reconstruct_hypesiege_streempilot_fleet.py'
          publisher_path = root / 'scripts' / 'publish_hypesiege_streempilot_fleet.py'
          fleet_workflow_path = root / '.github' / 'workflows' / 'repository-fleets.yml'
          docs_path = root / 'docs' / 'hypesiege-streempilot-repository-publication.md'

          old_digest = '50629a57beca1ac85928cfae8fbebbca4f62a6455a7013016f92b1203dcbbd1f'
          reviewed_digest = 'a57b00961ee57ae09bf3bb2e2d09afbdd1ddbbbde832b027802f82a1fc5dfa84'
          parts = [payload_dir / f'generator.py.gz.b64.part-{index:02d}' for index in range(6)]
          if not all(path.is_file() for path in parts):
              raise SystemExit('reviewed six-part generator payload is incomplete')
          encoded = ''.join(path.read_text(encoding='utf-8').strip() for path in parts)
          source = gzip.decompress(base64.b64decode(encoded, validate=True))
          actual_digest = hashlib.sha256(source).hexdigest()
          if actual_digest != reviewed_digest:
              raise SystemExit(
                  f'reviewed generator identity changed: {actual_digest} != {reviewed_digest}'
              )

          for path in (reconstructor_path, publisher_path, manifest_path, docs_path):
              text = path.read_text(encoding='utf-8')
              if old_digest in text:
                  text = text.replace(old_digest, reviewed_digest)
              if reviewed_digest not in text:
                  raise SystemExit(f'reviewed generator identity is absent from {path}')
              path.write_text(text, encoding='utf-8')

          reconstructor = reconstructor_path.read_text(encoding='utf-8')

          output_start_marker = (
              '    expected_literal = "ROOT = Path(\'/mnt/data/hypesiege-streempilot-fleet\')"\n'
          )
          output_end_marker = '    with tempfile.TemporaryDirectory('
          output_start = reconstructor.find(output_start_marker)
          output_end = reconstructor.find(output_end_marker, output_start)
          if output_start < 0 or output_end < 0:
              raise SystemExit('reconstructor generator-output boundary drifted')
          output_contract = '''    expected_literal = "ROOT = Path('/mnt/data/hypesiege-streempilot-fleet')"
              replacement = f"ROOT = Path({str(output_root)!r})"
              if source.count(expected_literal) != 1:
                  raise ReconstructionError("generator output-root contract changed")
              source = source.replace(expected_literal, replacement)

              archive_literal = "/mnt/data/hypesiege-streempilot-fleet.tar.gz"
              if source.count(archive_literal) != 1:
                  raise ReconstructionError("generator archive-output contract changed")
              archive_replacement = str(output_root.parent / f"{output_root.name}.tar.gz")
              source = source.replace(archive_literal, archive_replacement)

              checksum_literal = "/mnt/data/hypesiege-streempilot-fleet.SHA256"
              if source.count(checksum_literal) != 1:
                  raise ReconstructionError("generator checksum-output contract changed")
              checksum_replacement = str(output_root.parent / f"{output_root.name}.SHA256")
              source = source.replace(checksum_literal, checksum_replacement)

          '''
          reconstructor = (
              reconstructor[:output_start]
              + output_contract
              + reconstructor[output_end:]
          )

          cleanup_start_marker = (
              '    stale_archive = output_root.parent / f"{output_root.name}.tar.gz"\n'
          )
          cleanup_end_marker = '    (output_root / "publish.py").unlink(missing_ok=True)\n'
          cleanup_start = reconstructor.find(cleanup_start_marker)
          cleanup_end = reconstructor.find(cleanup_end_marker, cleanup_start)
          if cleanup_start < 0 or cleanup_end < 0:
              raise SystemExit('reconstructor generated-artifact cleanup boundary drifted')
          cleanup_end += len(cleanup_end_marker)
          cleanup_contract = '''    stale_archive = output_root.parent / f"{output_root.name}.tar.gz"
              stale_checksum = output_root.parent / f"{output_root.name}.SHA256"
              stale_archive.unlink(missing_ok=True)
              stale_checksum.unlink(missing_ok=True)
              (output_root / "publish.py").unlink(missing_ok=True)
          '''
          reconstructor = (
              reconstructor[:cleanup_start]
              + cleanup_contract
              + reconstructor[cleanup_end:]
          )

          function_end_marker = '\n\ndef write_gitmodules('
          function_start = reconstructor.find('def amend_root_commit(')
          if function_start < 0:
              function_start = reconstructor.find('def seal_root_commit(')
          function_end = reconstructor.find(function_end_marker, function_start)
          if function_start < 0 or function_end < 0:
              raise SystemExit('reconstructor root-sealing function boundary drifted')
          root_seal_contract = '''def seal_root_commit(repository: pathlib.Path) -> str:
              # Preserve the generator's final tree and latest semantic message while
              # discarding incidental multi-commit construction chronology.
              message = run(["git", "log", "-1", "--format=%B"], cwd=repository).strip()
              if not message:
                  message = f"Initialize {repository.name}"
              run(["git", "add", "-A"], cwd=repository)
              tree = run(["git", "write-tree"], cwd=repository).strip()
              commit = run(
                  ["git", "commit-tree", tree, "-m", message],
                  cwd=repository,
                  env=git_environment(),
              ).strip()
              run(["git", "reset", "--hard", commit], cwd=repository)
              if run(["git", "rev-list", "--count", "HEAD"], cwd=repository).strip() != "1":
                  raise ReconstructionError(f"{repository} was not sealed as one root commit")
              return commit
          '''
          reconstructor = (
              reconstructor[:function_start]
              + root_seal_contract
              + reconstructor[function_end:]
          )
          reconstructor = reconstructor.replace(
              'amend_root_commit(repository)',
              'seal_root_commit(repository)',
          )
          if 'amend_root_commit' in reconstructor:
              raise SystemExit('stale amend-only history assumption remains')
          if reconstructor.count('seal_root_commit(repository)') != 2:
              raise SystemExit('expected exactly two fleet root-sealing call sites')
          reconstructor_path.write_text(reconstructor, encoding='utf-8')

          docs = docs_path.read_text(encoding='utf-8')
          docs_marker = '## Reconstruct and validate locally\n'
          docs_paragraph = (
              'The semantic merge preserves the reviewed six-part generator’s final source '
              'trees while sealing each repository as a deterministic root commit. This '
              'retains the generator’s multi-step monorepo assembly—including exact child '
              'gitlinks—without allowing incidental construction chronology to make the '
              'published ledger nondeterministic.\n\n'
              'The superseded `deploy/k8s/bootstrap` all-at-once publisher was removed. '
              'The retained publisher requires one exact repository confirmation, complete '
              'local preflight, child-before-monorepo ordering, a short-lived installation '
              'token, and post-push remote-head verification.\n\n'
          )
          if docs_paragraph not in docs:
              if docs_marker not in docs:
                  raise SystemExit('publication documentation insertion point is missing')
              docs = docs.replace(docs_marker, docs_paragraph + docs_marker, 1)
          docs_path.write_text(docs, encoding='utf-8')

          unsafe_bootstrap = root / 'deploy' / 'k8s' / 'bootstrap'
          if unsafe_bootstrap.exists():
              expected_names = {
                  'hypesiege-streempilot-bootstrap-job.yaml',
                  'kustomization.yaml',
                  *{f'generate.py.gz.b64.part-{index:02d}' for index in range(7)},
              }
              actual_names = {
                  path.relative_to(unsafe_bootstrap).as_posix()
                  for path in unsafe_bootstrap.rglob('*')
                  if path.is_file()
              }
              if actual_names != expected_names:
                  raise SystemExit(
                      'refusing to remove bootstrap overlay with unrelated content: '
                      f'{sorted(actual_names ^ expected_names)}'
                  )
              shutil.rmtree(unsafe_bootstrap)

          fleet_workflow = fleet_workflow_path.read_text(encoding='utf-8')
          start_marker = '# BEGIN DEN877 FLEET SEAL RECONCILIATION\n'
          end_marker = '# END DEN877 FLEET SEAL RECONCILIATION\n'
          has_start = start_marker in fleet_workflow
          has_end = end_marker in fleet_workflow
          if has_start != has_end:
              raise SystemExit('temporary fleet-workflow marker pair is incomplete')
          if has_start:
              start = fleet_workflow.index(start_marker)
              end = fleet_workflow.index(end_marker, start) + len(end_marker)
              fleet_workflow = (
                  fleet_workflow[:start].rstrip()
                  + '\n'
                  + fleet_workflow[end:].lstrip('\n')
              )
          fleet_workflow_path.write_text(fleet_workflow, encoding='utf-8')

          temporary_paths = [
              root / '.github/workflows/den-877-final-semantic-repair.yml',
              root / '.github/workflows/den-877-fleet-repair.yml',
              root / '.github/workflows/den-877-one-shot-repair.yml',
              root / '.github/workflows/fix-den-877-fleet-payload.yml',
              root / '.github/workflows/temporary-den-877-checksum-repair.yml',
              root / '.github/workflows/temporary-den-877-semantic-repair.yml',
              root / '.github/workflows/den-877-root-tree-repair.yml',
              payload_dir / 'RECONCILE-TRIGGER-20260731',
              payload_dir / 'AUTHORIZE-20260731',
              root / '.github/hypesiege-streempilot-device-publish.sh',
              root / '.github/workflows/hypesiege-owner-authorized-publish.yml',
              root / '.github/workflows/hypesiege-streempilot-live-publish.yml',
              root / '.github/workflows/hypesiege-streempilot-owner-publish-now.yml',
              root / '.github/workflows/repository-admin-environment-discovery.yml',
          ]
          for path in temporary_paths:
              path.unlink(missing_ok=True)

          previous_manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          (root / '.git/den-877-previous-manifest.json').write_text(
              json.dumps(previous_manifest),
              encoding='utf-8',
          )
          PY

      - name: Reconstruct the fleet twice and reconcile the ledger
        shell: bash
        run: |
          set -euo pipefail
          first_root="$RUNNER_TEMP/den-877-fleet-first"
          second_root="$RUNNER_TEMP/den-877-fleet-second"
          first_manifest="$RUNNER_TEMP/den-877-manifest-first.json"
          second_manifest="$RUNNER_TEMP/den-877-manifest-second.json"

          python scripts/reconstruct_hypesiege_streempilot_fleet.py \
            --output-root "$first_root" \
            --manifest-out "$first_manifest"
          python scripts/reconstruct_hypesiege_streempilot_fleet.py \
            --output-root "$second_root" \
            --manifest-out "$second_manifest"
          cmp "$first_manifest" "$second_manifest"

          MANIFEST_OUT="$first_manifest" python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path.cwd()
          manifest_path = root / 'repository-fleets/hypesiege-streempilot.json'
          previous = json.loads(
              (root / '.git/den-877-previous-manifest.json').read_text(encoding='utf-8')
          )
          generated = json.loads(
              Path(os.environ['MANIFEST_OUT']).read_text(encoding='utf-8')
          )

          expected = {
              'schema_version': 2,
              'generator_sha256': 'a57b00961ee57ae09bf3bb2e2d09afbdd1ddbbbde832b027802f82a1fc5dfa84',
              'default_branch': 'main',
              'repository_count': 32,
              'total_tracked_files': 888,
              'total_gitlinks': 30,
              'organizations': {'hypesiege': 15, 'streempilot': 17},
          }
          for key, value in expected.items():
              if generated.get(key) != value:
                  raise SystemExit(
                      f'generated manifest {key} drift: {generated.get(key)!r} != {value!r}'
                  )
              if key != 'generator_sha256' and previous.get(key) != value:
                  raise SystemExit(
                      f'previous manifest {key} drift: {previous.get(key)!r} != {value!r}'
                  )

          previous_names = [item['full_name'] for item in previous['repositories']]
          generated_names = [item['full_name'] for item in generated['repositories']]
          if previous_names != generated_names:
              raise SystemExit('repository identity or publication order changed')

          previous_by_name = {
              item['full_name']: item for item in previous['repositories']
          }
          generated_by_name = {
              item['full_name']: item for item in generated['repositories']
          }
          stable_fields = (
              'org',
              'name',
              'kind',
              'files',
              'remote',
              'description',
              'visibility',
              'default_branch',
              'gitlinks',
          )
          for full_name in previous_names:
              before = previous_by_name[full_name]
              after = generated_by_name[full_name]
              for field in stable_fields:
                  if before[field] != after[field]:
                      raise SystemExit(
                          f'{full_name}: non-commit contract changed for {field}'
                      )

          manifest_path.write_text(
              json.dumps(generated, indent=2) + '\n',
              encoding='utf-8',
          )

          reference_paths = [
              root / 'scripts/test_publish_hypesiege_streempilot_fleet.py',
              root / '.github/workflows/repository-fleets.yml',
              root / 'docs/hypesiege-streempilot-repository-publication.md',
          ]
          for full_name in previous_names:
              old_commit = previous_by_name[full_name]['commit']
              new_commit = generated_by_name[full_name]['commit']
              if old_commit == new_commit:
                  continue
              for path in reference_paths:
                  text = path.read_text(encoding='utf-8')
                  if old_commit in text:
                      path.write_text(
                          text.replace(old_commit, new_commit),
                          encoding='utf-8',
                      )

          for full_name in previous_names:
              old_commit = previous_by_name[full_name]['commit']
              if old_commit == generated_by_name[full_name]['commit']:
                  continue
              remaining = subprocess.run(
                  ['git', 'grep', '-n', old_commit, '--', '.'],
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  check=False,
              )
              if remaining.returncode == 0:
                  raise SystemExit(
                      f'stale fleet commit reference remains for {full_name}:\n'
                      f'{remaining.stdout}'
                  )
              if remaining.returncode not in (0, 1):
                  raise SystemExit(remaining.stderr)
          PY

      - name: Validate the complete conceptual merge
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/reconstruct_hypesiege_streempilot_fleet.py \
            scripts/publish_hypesiege_streempilot_fleet.py \
            scripts/test_publish_hypesiege_streempilot_fleet.py
          python -m unittest -v scripts/test_publish_hypesiege_streempilot_fleet.py
          python scripts/publish_hypesiege_streempilot_fleet.py \
            --repository hypesiege/hypesiege-api-server.rs > /tmp/hypesiege-plan.json
          python scripts/publish_hypesiege_streempilot_fleet.py \
            --repository streempilot/streempilot-monorepo > /tmp/streempilot-plan.json

          test ! -e deploy/k8s/bootstrap
          test ! -e .github/workflows/den-877-final-semantic-repair.yml
          test ! -e .github/workflows/den-877-fleet-repair.yml
          test ! -e .github/workflows/den-877-one-shot-repair.yml
          test ! -e .github/workflows/fix-den-877-fleet-payload.yml
          test ! -e .github/workflows/temporary-den-877-semantic-repair.yml
          test ! -e .github/workflows/den-877-root-tree-repair.yml
          test ! -e repository-fleets/hypesiege-streempilot/RECONCILE-TRIGGER-20260731
          test -z "$(git grep -l \
            '50629a57beca1ac85928cfae8fbebbca4f62a6455a7013016f92b1203dcbbd1f' \
            -- scripts/reconstruct_hypesiege_streempilot_fleet.py \
               scripts/publish_hypesiege_streempilot_fleet.py \
               repository-fleets/hypesiege-streempilot.json \
               docs/hypesiege-streempilot-repository-publication.md || true)"
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- .; then
            echo 'conflict markers remain' >&2
            exit 1
          fi
          git diff --check

      - name: Commit the reconciled final state
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No additional semantic repair was required.'
            exit 0
          fi
          git config user.name 'ORESoftware'
          git config user.email '11139560+ORESoftware@users.noreply.github.com'
          git commit -m 'fix(DEN-877): seal final trees and reconcile fleet publication'
          git push origin HEAD:agent/den-877-fleet-merge-repair
