name: Temporary HypeSiege fleet publisher repair

on:
  push:
    branches:
      - fix/hypesiege-api-error-redaction
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact branch state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Restore the reviewed fail-closed sanitizer
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/publish_hypesiege_streempilot_fleet.py')
          source = path.read_text()

          old_error = 'f"{sanitize_detail(reason, token=token)}"'
          new_error = 'f"{sanitize_detail(raw, token=token)}"'
          if source.count(old_error) != 1:
              raise SystemExit('expected exactly one stale API error redaction reference')
          source = source.replace(old_error, new_error, 1)

          token_marker = 'TOKEN_PATTERN = re.compile(r"[A-Za-z0-9_]{20,255}\\Z")\n'
          sanitizer_constants = '''TOKEN_PATTERN = re.compile(r"[A-Za-z0-9_]{20,255}\\Z")
          MAX_ERROR_DETAIL_BYTES = MAX_ERROR_BYTES
          SECRET_PATTERNS = (
              re.compile(r"(?i)\\bBearer\\s+[^\\s,;]+"),
              re.compile(r"\\bgh[pousr]_[A-Za-z0-9_]+\\b"),
              re.compile(r"\\bgithub_pat_[A-Za-z0-9_]+\\b"),
          )
          '''
          if 'SECRET_PATTERNS = (' in source or 'MAX_ERROR_DETAIL_BYTES =' in source:
              raise SystemExit('sanitizer constants unexpectedly already exist')
          if source.count(token_marker) != 1:
              raise SystemExit('expected exactly one token-pattern insertion marker')
          source = source.replace(token_marker, sanitizer_constants, 1)

          duplicate_handler = '''

          class NoRedirectHandler(urllib.request.HTTPRedirectHandler):
              """Reject redirects so credentials never cross an unexpected origin."""

              def redirect_request(self, req, fp, code, msg, headers, newurl):  # noqa: ANN001
                  return None
          '''
          if source.count(duplicate_handler) != 1:
              raise SystemExit('expected exactly one duplicate redirect handler')
          source = source.replace(duplicate_handler, '', 1)

          path.write_text(source)
          PY

      - name: Regenerate the canonical sealed fleet manifest
        run: |
          set -euo pipefail
          python scripts/reconstruct_hypesiege_streempilot_fleet.py \
            --output-root "$RUNNER_TEMP/hypesiege-streempilot-fleet" \
            --manifest-out repository-fleets/hypesiege-streempilot.json

      - name: Run publisher security and fleet tests
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/publish_hypesiege_streempilot_fleet.py \
            scripts/reconstruct_hypesiege_streempilot_fleet.py
          python -m unittest -v \
            scripts/test_publish_hypesiege_streempilot_fleet.py \
            scripts/test_hypesiege_streempilot_publisher_hardening.py

      - name: Commit the focused publisher and manifest repair
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            scripts/publish_hypesiege_streempilot_fleet.py \
            repository-fleets/hypesiege-streempilot.json; then
            echo 'publisher and sealed fleet manifest are already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/publish_hypesiege_streempilot_fleet.py \
            repository-fleets/hypesiege-streempilot.json
          git commit -m 'fix(fleet): restore sealed publisher validation'
          git push origin "HEAD:${GITHUB_REF_NAME}"
