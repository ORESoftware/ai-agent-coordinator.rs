name: Temporary HypeSiege API error redaction fix

on:
  push:
    branches:
      - fix/hypesiege-api-error-redaction
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact branch state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Apply the exact fail-closed redaction repair
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/publish_hypesiege_streempilot_fleet.py')
          source = path.read_text()
          old = 'f"{sanitize_detail(reason, token=token)}"'
          new = 'f"{sanitize_detail(raw, token=token)}"'
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one stale redaction reference; found {count}')
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Run publisher security and fleet tests
        run: |
          set -euo pipefail
          python -m py_compile scripts/publish_hypesiege_streempilot_fleet.py
          python -m unittest -v \
            scripts/test_publish_hypesiege_streempilot_fleet.py \
            scripts/test_hypesiege_streempilot_publisher_hardening.py

      - name: Commit the focused source repair
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/publish_hypesiege_streempilot_fleet.py; then
            echo 'publisher redaction path is already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/publish_hypesiege_streempilot_fleet.py
          git commit -m 'fix(fleet): preserve API error redaction'
          git push origin "HEAD:${GITHUB_REF_NAME}"
