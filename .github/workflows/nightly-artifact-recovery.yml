name: Nightly artifact recovery

on:
  pull_request:
    paths:
      - '.github/workflows/nightly-artifact-recovery.yml'
      - '.github/artifact-recovery-ledger.schema.json'
      - '.github/artifact-recovery-source-coverage.schema.json'
      - 'config/artifact-recovery-policy.json'
      - 'docs/*artifact-recovery*.md'
      - 'scripts/build_artifact_recovery_backfill.py'
      - 'tools/artifact_recovery_ledger.py'
      - 'tools/artifact_recovery_source_coverage.py'
      - 'tools/artifact_recovery/**'
      - 'tools/enqueue_artifact_recovery.py'
      - 'tools/run_nightly_artifact_recovery.py'
      - 'tests/test_artifact_recovery_ledger.py'
      - 'tests/test_artifact_recovery_source_coverage.py'
      - 'tests/test_enqueue_artifact_recovery.py'
      - 'tests/test_run_nightly_artifact_recovery.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/nightly-artifact-recovery.yml'
      - '.github/artifact-recovery-ledger.schema.json'
      - '.github/artifact-recovery-source-coverage.schema.json'
      - 'config/artifact-recovery-policy.json'
      - 'docs/*artifact-recovery*.md'
      - 'scripts/build_artifact_recovery_backfill.py'
      - 'tools/artifact_recovery_ledger.py'
      - 'tools/artifact_recovery_source_coverage.py'
      - 'tools/artifact_recovery/**'
      - 'tools/enqueue_artifact_recovery.py'
      - 'tools/run_nightly_artifact_recovery.py'
      - 'tests/test_artifact_recovery_ledger.py'
      - 'tests/test_artifact_recovery_source_coverage.py'
      - 'tests/test_enqueue_artifact_recovery.py'
      - 'tests/test_run_nightly_artifact_recovery.py'
  schedule:
    # Offset from the top of the hour to reduce delayed/dropped schedule risk.
    - cron: '17 2 * * *'
      timezone: 'America/Chicago'
    # Independent recovery invocation; same daily idempotency key.
    - cron: '47 3 * * *'
      timezone: 'America/Chicago'
  workflow_dispatch:
    inputs:
      mode:
        description: Validate only, or enqueue and verify one explicitly identified recovery run.
        required: true
        default: dry-run
        type: choice
        options: [dry-run, enqueue]
      manual_id:
        description: Required for an enqueued manual run.
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: nightly-artifact-recovery-${{ github.event_name == 'schedule' && 'scheduled' || github.run_id }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/nightly-artifact-recovery.yml
      - name: Compile and test
        run: |
          python3 -m py_compile tools/artifact_recovery_ledger.py tools/artifact_recovery/*.py \
            tools/artifact_recovery_source_coverage.py tools/enqueue_artifact_recovery.py \
            tools/run_nightly_artifact_recovery.py scripts/build_artifact_recovery_backfill.py \
            tests/test_artifact_recovery_ledger.py tests/test_artifact_recovery_source_coverage.py \
            tests/test_enqueue_artifact_recovery.py tests/test_run_nightly_artifact_recovery.py
          python3 -m unittest -v tests/test_artifact_recovery_ledger.py \
            tests/test_artifact_recovery_source_coverage.py tests/test_enqueue_artifact_recovery.py \
            tests/test_run_nightly_artifact_recovery.py
      - name: Validate policy, schemas, deterministic backfill, and source coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool config/artifact-recovery-policy.json >/dev/null
          python3 -m json.tool .github/artifact-recovery-ledger.schema.json >/dev/null
          python3 -m json.tool .github/artifact-recovery-source-coverage.schema.json >/dev/null
          evidence="$RUNNER_TEMP/artifact-recovery-evidence"
          mkdir -p "$evidence"
          python3 scripts/build_artifact_recovery_backfill.py --output "$evidence/backfill.json"
          python3 tools/artifact_recovery_ledger.py validate "$evidence/backfill.json"
          python3 tools/artifact_recovery_ledger.py reconcile \
            --input "$evidence/backfill.json" --output "$evidence/ledger-first.json" \
            --cli-queue "$evidence/queue-first.json" --batch-size 50 --now 2026-08-07T20:15:00Z
          python3 tools/artifact_recovery_ledger.py reconcile \
            --input "$evidence/backfill.json" --ledger "$evidence/ledger-first.json" \
            --output "$evidence/ledger-second.json" --cli-queue "$evidence/queue-second.json" \
            --batch-size 50 --now 2026-08-07T20:15:00Z
          cmp "$evidence/ledger-first.json" "$evidence/ledger-second.json"
          cmp "$evidence/queue-first.json" "$evidence/queue-second.json"
          python3 tools/artifact_recovery_ledger.py summarize \
            --ledger "$evidence/ledger-second.json" --output "$evidence/summary.json"
          python3 tools/artifact_recovery_source_coverage.py example \
            --output "$evidence/source-coverage-ci-fixture.json" \
            --now 2026-08-10T18:45:00Z
          python3 tools/artifact_recovery_source_coverage.py validate \
            "$evidence/source-coverage-ci-fixture.json" \
            --now 2026-08-10T18:45:00Z
          EVIDENCE="$evidence" python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['EVIDENCE'])
          ledger = json.loads((root / 'ledger-second.json').read_text())
          queue = json.loads((root / 'queue-second.json').read_text())
          coverage = json.loads((root / 'source-coverage-ci-fixture.json').read_text())
          assert ledger['summary']['entries'] == 22
          assert ledger['summary']['complete'] == 18
          assert ledger['summary']['actionable'] == 4
          assert ledger['summary']['blocked'] == 0
          assert queue['summary'] == {'items': 4, 'create_repository': 4, 'recover_local': 0}
          assert coverage['summary']['status'] == 'complete'
          assert coverage['summary']['required_sources'] == 5
          assert len(coverage['report_sha256']) == 64
          PY
      - name: Render hardened redacted enqueue plan
        run: >-
          python3 tools/run_nightly_artifact_recovery.py
          --endpoint https://coordinator.example.invalid
          --timezone America/Chicago --local-time 02:17
          --now 2026-08-10T07:17:00Z --dry-run
          --evidence-output "$RUNNER_TEMP/artifact-recovery-enqueue-plan-receipt.json"
          > "$RUNNER_TEMP/artifact-recovery-enqueue-plan.json"
      - name: Upload bounded validation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: artifact-recovery-${{ github.sha }}
          path: |
            ${{ runner.temp }}/artifact-recovery-evidence
            ${{ runner.temp }}/artifact-recovery-enqueue-plan.json
            ${{ runner.temp }}/artifact-recovery-enqueue-plan-receipt.json
          retention-days: 14
          if-no-files-found: error

  enqueue-and-verify:
    needs: validate
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'enqueue')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment:
      name: nightly-artifact-recovery
      deployment: false
    env:
      AI_AGENT_COORDINATOR_URL: ${{ vars.AI_AGENT_COORDINATOR_URL }}
      AI_AGENT_COORDINATOR_API_TOKEN: ${{ secrets.AI_AGENT_COORDINATOR_API_TOKEN }}
      ARTIFACT_RECOVERY_ENQUEUE_ENABLED: ${{ vars.ARTIFACT_RECOVERY_ENQUEUE_ENABLED }}
      ARTIFACT_RECOVERY_TIMEZONE: America/Chicago
      ARTIFACT_RECOVERY_LOCAL_TIME: '02:17'
      ARTIFACT_RECOVERY_RECOVERY_MINUTES: '60'
      ARTIFACT_RECOVERY_MAX_LATENESS_MINUTES: '240'
      ARTIFACT_RECOVERY_WINDOW_HOURS: '96'
      ARTIFACT_RECOVERY_OVERLAP_HOURS: '6'
      ARTIFACT_RECOVERY_CLI_TASK_ID: 019fd526-f34d-7f72-94fa-2da6185f2d74
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Enqueue, poll, and verify one idempotent recovery run
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_ID: ${{ inputs.manual_id }}
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/artifact-recovery-terminal-receipt.json"
          args=(--evidence-output "$receipt")
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            test -n "$MANUAL_ID" || exit 64
            args+=(--force --manual-id "$MANUAL_ID")
          fi
          python3 tools/run_nightly_artifact_recovery.py "${args[@]}"
      - name: Upload terminal run receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: artifact-recovery-terminal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifact-recovery-terminal-receipt.json
          retention-days: 90
          if-no-files-found: warn

  report:
    needs: [validate, enqueue-and-verify]
    if: >-
      always() &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.mode == 'enqueue'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      VALIDATION_RESULT: ${{ needs.validate.result }}
      EXECUTION_RESULT: ${{ needs.enqueue-and-verify.result }}
      EVENT_NAME: ${{ github.event_name }}
      EVENT_SCHEDULE: ${{ github.event.schedule }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      REPOSITORY: ${{ github.repository }}
      SHA: ${{ github.sha }}
    steps:
      - name: Write durable run ledger and human report
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/nightly-artifact-recovery-report"
          mkdir -p "$report"
          REPORT="$report" python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          validation_ok = os.environ['VALIDATION_RESULT'] == 'success'
          execution_ok = os.environ['EXECUTION_RESULT'] == 'success'
          errors = []
          if not validation_ok:
              errors.append(f"validation concluded {os.environ['VALIDATION_RESULT']!r}")
          if not execution_ok:
              errors.append(f"enqueue-and-verify concluded {os.environ['EXECUTION_RESULT']!r}")
          ledger = {
              'schema_version': 'overnight_run_ledger.v1',
              'job_id': 'nightly-artifact-recovery',
              'workflow': 'nightly-artifact-recovery.yml',
              'repository': os.environ['REPOSITORY'],
              'event': os.environ['EVENT_NAME'],
              'schedule': os.environ.get('EVENT_SCHEDULE') or None,
              'timezone': 'America/Chicago',
              'local_time': '02:17',
              'lookback_hours': 96,
              'run_id': int(os.environ['RUN_ID']),
              'run_attempt': int(os.environ['RUN_ATTEMPT']),
              'run_url': os.environ['RUN_URL'],
              'sha': os.environ['SHA'],
              'reported_at': datetime.now(timezone.utc).isoformat(),
              'outcome': 'success' if validation_ok and execution_ok else 'failure',
              'stages': {
                  'validate': os.environ['VALIDATION_RESULT'],
                  'enqueue_and_verify': os.environ['EXECUTION_RESULT'],
              },
              'error_summary': errors,
              'artifact_manifest': [
                  f"artifact-recovery-terminal-{os.environ['RUN_ID']}-{os.environ['RUN_ATTEMPT']}",
                  f"nightly-artifact-recovery-report-{os.environ['RUN_ID']}-{os.environ['RUN_ATTEMPT']}",
              ],
          }
          root = Path(os.environ['REPORT'])
          (root / 'run-ledger.json').write_text(
              json.dumps(ledger, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          (root / 'report.md').write_text(
              '# Nightly artifact recovery\n\n'
              f"- Outcome: **{ledger['outcome'].upper()}**\n"
              '- Scheduled: `02:17 America/Chicago` plus `03:47` recovery invocation\n'
              f"- Rolling window: `{ledger['lookback_hours']} hours`\n"
              f"- Validation: `{ledger['stages']['validate']}`\n"
              f"- Enqueue + terminal verification: `{ledger['stages']['enqueue_and_verify']}`\n"
              f"- Errors: `{'; '.join(ledger['error_summary']) or 'none'}`\n"
              f"- Run: `{ledger['run_id']}` attempt `{ledger['run_attempt']}`\n",
              encoding='utf-8',
          )
          PY
          cat "$report/report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload durable post-schedule report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-artifact-recovery-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nightly-artifact-recovery-report
          retention-days: 90
          if-no-files-found: error
      - name: Preserve execution failure after report upload
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VALIDATION_RESULT" == success ]]
          [[ "$EXECUTION_RESULT" == success ]]
