name: Nightly ChatGPT reconciliation evidence watchdog

on:
  pull_request:
    paths:
      - '.github/workflows/nightly-artifact-recovery-watchdog.yml'
      - '.github/workflows/nightly-artifact-recovery.yml'
      - 'tools/nightly_artifact_recovery_watchdog.py'
      - 'tests/test_nightly_artifact_recovery_watchdog.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/nightly-artifact-recovery-watchdog.yml'
      - '.github/workflows/nightly-artifact-recovery.yml'
      - 'tools/nightly_artifact_recovery_watchdog.py'
      - 'tests/test_nightly_artifact_recovery_watchdog.py'
  schedule:
    # The execution workflow settles by 05:47 ET (00:37 + 240m dispatch
    # allowance + 40m runtime + 30m margin). Audit independently at 06:07.
    - cron: '7 6 * * *'
      timezone: 'America/New_York'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: nightly-chatgpt-reconciliation-evidence-watchdog-${{ github.event_name == 'schedule' && 'scheduled' || github.run_id }}
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Compile and exercise adversarial watchdog tests
        if: github.event_name != 'schedule'
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/nightly_artifact_recovery_watchdog.py \
            tests/test_nightly_artifact_recovery_watchdog.py
          python3 -m unittest -v tests/test_nightly_artifact_recovery_watchdog.py
          python3 tools/nightly_artifact_recovery_watchdog.py emit-fixtures \
            --snapshot-output "$RUNNER_TEMP/watchdog-success-snapshot.json" \
            --receipt-output "$RUNNER_TEMP/watchdog-success-receipt.json"
          python3 -m json.tool "$RUNNER_TEMP/watchdog-success-snapshot.json" >/dev/null
          python3 -m json.tool "$RUNNER_TEMP/watchdog-success-receipt.json" >/dev/null
      - name: Validate watchdog workflow syntax
        if: github.event_name != 'schedule'
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: >-
            .github/workflows/nightly-artifact-recovery-watchdog.yml
            .github/workflows/nightly-artifact-recovery.yml
      - name: Locate a fully evidenced logical-night attempt
        id: locate
        shell: bash
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/nightly-artifact-recovery-watchdog"
          mkdir -p "$report"
          args=(
            locate
            --output-json "$report/workflow-evidence.json"
            --output-markdown "$report/summary.md"
            --github-output "$GITHUB_OUTPUT"
          )
          if [[ '${{ github.event_name }}' == 'pull_request' || '${{ github.event_name }}' == 'push' ]]; then
            args+=(
              --snapshot "$RUNNER_TEMP/watchdog-success-snapshot.json"
              --now 2026-08-10T10:07:00Z
            )
          fi
          python3 tools/nightly_artifact_recovery_watchdog.py "${args[@]}"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Download the selected terminal receipt
        if: >-
          steps.locate.outputs.status == 'success' &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: ORESoftware/ai-agent-coordinator.rs
          run-id: ${{ steps.locate.outputs.run_id }}
          name: ${{ steps.locate.outputs.artifact_name }}
          path: ${{ runner.temp }}/nightly-artifact-recovery-watchdog/terminal-receipt
      - name: Validate the downloaded terminal receipt
        id: receipt
        if: steps.locate.outputs.status == 'success'
        shell: bash
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/nightly-artifact-recovery-watchdog"
          receipt="$report/terminal-receipt/artifact-recovery-terminal-receipt.json"
          if [[ '${{ github.event_name }}' == 'pull_request' || '${{ github.event_name }}' == 'push' ]]; then
            receipt="$RUNNER_TEMP/watchdog-success-receipt.json"
          fi
          python3 tools/nightly_artifact_recovery_watchdog.py validate-receipt \
            --receipt "$receipt" \
            --expected-run-key '${{ steps.locate.outputs.expected_run_key }}' \
            --output-json "$report/receipt-validation.json" \
            --github-output "$GITHUB_OUTPUT"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish watchdog summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          summary="$RUNNER_TEMP/nightly-artifact-recovery-watchdog/summary.md"
          if [[ -f "$summary" ]]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '# Nightly ChatGPT reconciliation watchdog\n\n**FAILURE:** no summary was produced.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload bounded watchdog evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-artifact-recovery-watchdog-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nightly-artifact-recovery-watchdog
          retention-days: 90
          if-no-files-found: error
      - name: Preserve watchdog failure after evidence upload
        if: always()
        shell: bash
        env:
          LOCATE_EXIT: ${{ steps.locate.outputs.exit_code }}
          RECEIPT_EXIT: ${{ steps.receipt.outputs.exit_code }}
          LOCATE_STATUS: ${{ steps.locate.outputs.status }}
        run: |
          set -euo pipefail
          locate="${LOCATE_EXIT:-2}"
          receipt="${RECEIPT_EXIT:-2}"
          [[ "$locate" =~ ^[0-9]+$ ]] || exit 2
          [[ "$receipt" =~ ^[0-9]+$ ]] || exit 2
          [[ "$LOCATE_STATUS" == success ]] || exit "$locate"
          exit "$receipt"
