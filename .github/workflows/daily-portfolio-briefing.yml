name: Daily portfolio briefing

on:
  pull_request:
    paths:
      - '.github/workflows/daily-portfolio-briefing.yml'
      - 'docs/daily-portfolio-briefing.md'
      - 'tools/compose_daily_portfolio_briefing.py'
      - 'tools/enqueue_daily_portfolio_briefing.py'
      - 'tests/test_daily_portfolio_briefing.py'
      - 'tests/fixtures/daily_portfolio_briefing_input.json'
      - 'tests/fixtures/daily_portfolio_briefing_state.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-portfolio-briefing.yml'
      - 'docs/daily-portfolio-briefing.md'
      - 'tools/compose_daily_portfolio_briefing.py'
      - 'tools/enqueue_daily_portfolio_briefing.py'
      - 'tests/test_daily_portfolio_briefing.py'
      - 'tests/fixtures/daily_portfolio_briefing_input.json'
      - 'tests/fixtures/daily_portfolio_briefing_state.json'
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Dry-run or enqueue one explicitly identified manual run.
        type: choice
        required: true
        default: dry-run
        options:
          - dry-run
          - enqueue
      manual_id:
        description: Required for an enqueued manual run; ignored for dry-run validation.
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: daily-portfolio-briefing-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate workflow
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/daily-portfolio-briefing.yml
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Compile implementation and tests
        run: >-
          python -m py_compile
          tools/compose_daily_portfolio_briefing.py
          tools/enqueue_daily_portfolio_briefing.py
          tests/test_daily_portfolio_briefing.py
      - name: Run positive and negative fixtures
        run: python -m unittest -v tests/test_daily_portfolio_briefing.py
      - name: Compose and commit the deterministic fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/daily-portfolio
          python tools/compose_daily_portfolio_briefing.py plan \
            --input tests/fixtures/daily_portfolio_briefing_input.json \
            --state tests/fixtures/daily_portfolio_briefing_state.json \
            --run-mode scheduled \
            --run-key daily-portfolio:scheduled:2026-07-31 \
            --scheduled-run-key daily-portfolio:scheduled:2026-07-31 \
            --scheduled-for 2026-07-31T13:00:00Z \
            --generated-at 2026-07-31T13:02:00Z \
            --timezone America/Chicago \
            --output-json /tmp/daily-portfolio/plan.json \
            --output-markdown /tmp/daily-portfolio/briefing.md
          python tools/compose_daily_portfolio_briefing.py commit \
            --plan /tmp/daily-portfolio/plan.json \
            --state tests/fixtures/daily_portfolio_briefing_state.json \
            --delivered-at 2026-07-31T13:05:00Z \
            --output-state /tmp/daily-portfolio/state.json
          python - <<'PY'
          import json
          from pathlib import Path

          plan = json.loads(Path("/tmp/daily-portfolio/plan.json").read_text())
          state = json.loads(Path("/tmp/daily-portfolio/state.json").read_text())
          markdown = Path("/tmp/daily-portfolio/briefing.md").read_text()
          assert plan["schema_version"] == "portfolio_briefing_plan.v1"
          assert plan["counts"]["selected"] <= 12
          assert len(plan["priorities"]) <= 3
          assert "## Do today" in markdown
          assert "## Monitor" in markdown
          assert "## Ignore" in markdown
          assert state["scheduled_baseline"]["run_key"] == plan["run"]["scheduled_run_key"]
          PY
      - name: Render the safe scheduled enqueue plan
        run: >-
          python tools/enqueue_daily_portfolio_briefing.py
          --endpoint https://coordinator.example.invalid
          --now 2026-07-31T13:00:00Z
          --dry-run

  enqueue:
    if: >-
      always() &&
      ((github.event_name == 'schedule' &&
        vars.DAILY_BRIEFING_ENQUEUE_ENABLED == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.mode == 'enqueue')) &&
      (github.event_name == 'schedule' || needs.validate.result == 'success')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: daily-portfolio-briefing
    env:
      AI_AGENT_COORDINATOR_URL: ${{ vars.AI_AGENT_COORDINATOR_URL }}
      AI_AGENT_COORDINATOR_API_TOKEN: ${{ secrets.AI_AGENT_COORDINATOR_API_TOKEN }}
      DAILY_BRIEFING_TIMEZONE: ${{ vars.DAILY_BRIEFING_TIMEZONE }}
      DAILY_BRIEFING_LOCAL_TIME: ${{ vars.DAILY_BRIEFING_LOCAL_TIME }}
      DAILY_BRIEFING_RECOVERY_MINUTES: ${{ vars.DAILY_BRIEFING_RECOVERY_MINUTES }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Enqueue the idempotent scheduled or manual run
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_ID: ${{ inputs.manual_id }}
        run: |
          set -euo pipefail
          export DAILY_BRIEFING_TIMEZONE="${DAILY_BRIEFING_TIMEZONE:-America/Chicago}"
          export DAILY_BRIEFING_LOCAL_TIME="${DAILY_BRIEFING_LOCAL_TIME:-08:00}"
          export DAILY_BRIEFING_RECOVERY_MINUTES="${DAILY_BRIEFING_RECOVERY_MINUTES:-60}"
          args=()
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ -n "$MANUAL_ID" ]] || {
              echo 'manual_id is required for an enqueued workflow_dispatch run' >&2
              exit 64
            }
            args+=(--force --manual-id "$MANUAL_ID")
          fi
          python tools/enqueue_daily_portfolio_briefing.py "${args[@]}"
