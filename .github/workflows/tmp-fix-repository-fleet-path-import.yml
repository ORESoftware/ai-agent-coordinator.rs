name: Temporary repository-fleet Path import repair

on:
  push:
    branches:
      - fix/hypesiege-api-error-redaction
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Add the missing inline validator import
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/repository-fleets.yml')
          source = path.read_text()
          old = "          import pathlib\n          import subprocess\n"
          new = "          from pathlib import Path\n          import subprocess\n"
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'expected one stale plan-validator import block, found {count}')
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Validate the repaired workflow
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --workdir /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            .github/workflows/repository-fleets.yml

      - name: Commit the focused workflow repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/repository-fleets.yml
          git commit -m 'fix(ci): import Path in fleet plan validator'
          git push origin "HEAD:${GITHUB_REF_NAME}"
