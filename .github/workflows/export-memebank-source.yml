name: export-memebank-source

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/export-memebank-source.yml

permissions:
  contents: read

jobs:
  export:
    if: >-
      github.repository == 'ORESoftware/ai-agent-coordinator.rs' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/export-memebank-source-20260803'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reconstruct and verify sealed source archive
        shell: bash
        run: |
          set -euo pipefail
          manifest=repository-fleets/memebank-source.json
          archive="$RUNNER_TEMP/memebank-source.tar.gz"
          jq -r '.payload.chunks[].path' "$manifest" | while IFS= read -r chunk; do
            cat "$chunk"
          done | base64 --decode > "$archive"

          test "$(stat -c %s "$archive")" = "$(jq -r '.archive.bytes' "$manifest")"
          observed="$(sha256sum "$archive" | awk '{print $1}')"
          test "$observed" = "$(jq -r '.archive.sha256' "$manifest")"
          tar -tzf "$archive" > "$RUNNER_TEMP/memebank-source.members.txt"
          printf '%s  %s\n' "$observed" memebank-source.tar.gz > "$RUNNER_TEMP/memebank-source.sha256"

      - name: Upload exact sealed source evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: memebank-source-exact
          path: |
            ${{ runner.temp }}/memebank-source.tar.gz
            ${{ runner.temp }}/memebank-source.members.txt
            ${{ runner.temp }}/memebank-source.sha256
          if-no-files-found: error
          retention-days: 1
