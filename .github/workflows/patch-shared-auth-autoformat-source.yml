name: Temporary add Shared Auth source autoformat remediation

on:
  push:
    branches:
      - agent/autoformat-shared-auth-artifact-source

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/autoformat-shared-auth-artifact-source
          fetch-depth: 1
      - name: Apply reviewed private-source autoformat patch
        run: python3 scripts/patch_shared_auth_autoformat_source.py
      - name: Commit exact publisher patch and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/publish_shared_auth_client_artifacts.sh
          git add -u scripts/patch_shared_auth_autoformat_source.py
          git add -u .github/workflows/patch-shared-auth-autoformat-source.yml
          git commit -m 'fix: format private Rust source before artifact validation'
          git push origin HEAD:agent/autoformat-shared-auth-artifact-source
