name: Publish sealed HypeSiege and StreemPilot repository fleet

on:
  push:
    branches:
      - agent/publish-hypesiege-streempilot-20260731
    paths:
      - '.github/workflows/publish-hypesiege-streempilot-fleet.yml'

permissions:
  contents: write

concurrency:
  group: publish-hypesiege-streempilot-fleet
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GITHUB_REPOSITORY_ADMIN_TOKEN: ${{ secrets.GITHUB_REPOSITORY_ADMIN_TOKEN }}
      CARRIER_BRANCH: agent/publish-hypesiege-streempilot-20260731
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/publish-hypesiege-streempilot-20260731
          fetch-depth: 0
          persist-credentials: true

      - name: Require the protected repository-administration credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GITHUB_REPOSITORY_ADMIN_TOKEN" || {
            echo 'GITHUB_REPOSITORY_ADMIN_TOKEN is not configured for this repository' >&2
            exit 1
          }
          printf '::add-mask::%s\n' "$GITHUB_REPOSITORY_ADMIN_TOKEN"

      - name: Reconstruct and authenticate the sealed generator
        shell: bash
        run: |
          set -euo pipefail
          cat .github/bootstrap/hypesiege-streempilot-generator.part.* \
            | base64 --decode \
            | gzip --decompress \
            > "$RUNNER_TEMP/generate_hypesiege_streempilot.py"
          echo '50629a57beca1ac85928cfae8fbebbca4f62a6455a7013016f92b1203dcbbd1f  '"$RUNNER_TEMP/generate_hypesiege_streempilot.py" \
            | sha256sum --check --strict
          python3 -m py_compile "$RUNNER_TEMP/generate_hypesiege_streempilot.py"

      - name: Generate and validate all 32 independent Git histories
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/generate_hypesiege_streempilot.py"
          test "$(jq -r '.repository_count' /mnt/data/hypesiege-streempilot-fleet/MANIFEST.json)" = 32
          test "$(grep -c '^PASS \(hypesiege\|streempilot\)/' /mnt/data/hypesiege-streempilot-fleet/VALIDATION.log)" = 32
          grep -Fx 'PASS all repositories clean on main' /mnt/data/hypesiege-streempilot-fleet/VALIDATION.log
          grep -Fx 'PASS exact GitHub origins configured' /mnt/data/hypesiege-streempilot-fleet/VALIDATION.log
          grep -Fx 'PASS git fsck for all histories' /mnt/data/hypesiege-streempilot-fleet/VALIDATION.log

      - name: Create missing repositories and push exact main histories
        shell: bash
        run: |
          set -euo pipefail
          python3 /mnt/data/hypesiege-streempilot-fleet/publish.py --execute

      - name: Verify every remote main ref against the sealed manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          token = os.environ['GITHUB_REPOSITORY_ADMIN_TOKEN']
          manifest = json.loads(Path('/mnt/data/hypesiege-streempilot-fleet/MANIFEST.json').read_text())
          failures = []
          for record in manifest['repositories']:
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{record['full_name']}/git/ref/heads/main"
              )
              request.add_header('Accept', 'application/vnd.github+json')
              request.add_header('Authorization', f'Bearer {token}')
              request.add_header('X-GitHub-Api-Version', '2022-11-28')
              request.add_header('User-Agent', 'sealed-fleet-verifier')
              with urllib.request.urlopen(request, timeout=30) as response:
                  actual = json.load(response)['object']['sha']
              if actual != record['commit']:
                  failures.append(f"{record['full_name']}: {actual} != {record['commit']}")
              else:
                  print(f"PASS {record['full_name']} {actual}")
          if failures:
              raise SystemExit('\n'.join(failures))
          print(f"PASS verified {len(manifest['repositories'])} remote main refs")
          PY

      - name: Remove the temporary carrier from Git history
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git push --force origin "refs/remotes/origin/main:refs/heads/$CARRIER_BRANCH"
