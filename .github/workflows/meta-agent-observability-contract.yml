name: Meta Agent observability contract

on:
  pull_request:
    paths:
      - '.github/workflows/meta-agent-observability-contract.yml'
      - 'contracts/meta-agent-observability/**'
      - 'docs/meta-agent-observability-protocol.md'
      - 'scripts/validate_meta_agent_observability_contract.py'
      - 'scripts/test_validate_meta_agent_observability_contract.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/meta-agent-observability-contract.yml

      - name: Compile validators
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/validate_meta_agent_observability_contract.py \
            scripts/test_validate_meta_agent_observability_contract.py

      - name: Run conformance and negative tests
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_meta_agent_observability_contract.py \
            --report "$RUNNER_TEMP/meta-agent-observability-report.json"
          python3 -m unittest -v scripts/test_validate_meta_agent_observability_contract.py
          git diff --check
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' \
            contracts/meta-agent-observability \
            docs/meta-agent-observability-protocol.md \
            scripts/validate_meta_agent_observability_contract.py \
            scripts/test_validate_meta_agent_observability_contract.py; then
            echo 'Git conflict markers are forbidden.' >&2
            exit 1
          fi

      - name: Upload deterministic conformance report
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: meta-agent-observability-contract
          path: ${{ runner.temp }}/meta-agent-observability-report.json
          if-no-files-found: error
          retention-days: 14
