apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-agent-coordinator-artifact-recovery
  namespace: ai-agent-coordinator
  labels:
    app.kubernetes.io/name: ai-agent-coordinator-artifact-recovery
    app.kubernetes.io/part-of: oresoftware-agent-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: dd-cluster-secrets
  target:
    name: ai-agent-coordinator-artifact-recovery
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: dd/remote-dev/ai-agent-coordinator-artifact-recovery
