apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-agent-coordinator-artifact-recovery
  namespace: ai-agent-coordinator
  labels:
    app.kubernetes.io/name: ai-agent-coordinator-artifact-recovery
    app.kubernetes.io/part-of: oresoftware-agent-platform
data:
  ARTIFACT_RECOVERY_WORKER_COUNT: "3"
  ARTIFACT_RECOVERY_WINDOW_HOURS: "1200"
  ARTIFACT_RECOVERY_OVERLAP_HOURS: "6"
  ARTIFACT_RECOVERY_LEASE_SECONDS: "300"
  ARTIFACT_RECOVERY_REQUEST_TIMEOUT_SECONDS: "20"
  ARTIFACT_RECOVERY_MAX_RESPONSE_BYTES: "2097152"
  ARTIFACT_RECOVERY_MAX_PAGES_PER_SOURCE: "200"
  ARTIFACT_RECOVERY_SOURCE_PAGE_SIZE: "50"
  ARTIFACT_RECOVERY_RETRY_DELAY_SECONDS: "900"
  ARTIFACT_RECOVERY_POLL_SECONDS: "30"
  ARTIFACT_RECOVERY_MAX_RESTARTS: "5"
  ARTIFACT_RECOVERY_RESTART_WINDOW_SECONDS: "300"
  ARTIFACT_RECOVERY_RESTART_BACKOFF_MAX_SECONDS: "60"
  ARTIFACT_RECOVERY_STABLE_RUNTIME_SECONDS: "120"
  ARTIFACT_RECOVERY_SHUTDOWN_GRACE_SECONDS: "30"
  ARTIFACT_RECOVERY_KILL_GRACE_SECONDS: "5"
  ARTIFACT_RECOVERY_WORKER_ID_PREFIX: "continuous-recovery"
