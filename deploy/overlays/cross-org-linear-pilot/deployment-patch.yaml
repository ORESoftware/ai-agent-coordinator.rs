apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent-coordinator
  namespace: ai-agent-coordinator
spec:
  template:
    metadata:
      annotations:
        oresoftware.dev/cross-org-linear-pilot: dry-run
    spec:
      containers:
        - name: coordinator
          envFrom:
            - configMapRef:
                name: ai-agent-coordinator-telemetry
            - secretRef:
                name: ai-agent-coordinator-core
            - secretRef:
                name: ai-agent-coordinator-telemetry
            - secretRef:
                name: ai-agent-coordinator-linear-pilot
            - secretRef:
                name: ai-agent-coordinator-admin
                optional: true
            - secretRef:
                name: ai-agent-coordinator-providers
                optional: true
