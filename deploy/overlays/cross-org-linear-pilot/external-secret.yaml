apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-agent-coordinator-linear-pilot
  namespace: ai-agent-coordinator
  labels:
    app.kubernetes.io/name: ai-agent-coordinator
    app.kubernetes.io/part-of: oresoftware-agent-platform
    app.kubernetes.io/component: cross-org-linear-pilot
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: dd-cluster-secrets
  target:
    name: ai-agent-coordinator-linear-pilot
    creationPolicy: Owner
  data:
    - secretKey: LINEAR_API_TOKEN
      remoteRef:
        key: dd/remote-dev/ai-agent-coordinator-linear-pilot
        property: LINEAR_API_TOKEN
    - secretKey: GITHUB_WEBHOOK_SECRET_SONUS_AURIS
      remoteRef:
        key: dd/remote-dev/ai-agent-coordinator-linear-pilot
        property: GITHUB_WEBHOOK_SECRET_SONUS_AURIS
    - secretKey: GITHUB_WEBHOOK_SECRET_DAEDALUS_FAB
      remoteRef:
        key: dd/remote-dev/ai-agent-coordinator-linear-pilot
        property: GITHUB_WEBHOOK_SECRET_DAEDALUS_FAB
