apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-agent-coordinator-telemetry
  namespace: ai-agent-coordinator
data:
  GITHUB_WEBHOOK_ORG_SECRET_ENVS: >-
    sonus-auris=GITHUB_WEBHOOK_SECRET_SONUS_AURIS,
    daedalus-fab=GITHUB_WEBHOOK_SECRET_DAEDALUS_FAB
  GITHUB_AUTO_ENQUEUE_PUSHES: "true"
  GITHUB_PUSH_ALLOWED_REPOSITORIES: >-
    sonus-auris/sonus-auris-site.web,
    daedalus-fab/daedalus-clients
  GITHUB_PUSH_DEFAULT_BRANCHES: >-
    sonus-auris/sonus-auris-site.web=main,
    daedalus-fab/daedalus-clients=main
  LINEAR_DELIVERY_ENABLED: "true"
  LINEAR_DELIVERY_DRY_RUN: "true"
  LINEAR_API_URL: https://api.linear.app/graphql
  LINEAR_API_AUTH_SCHEME: api_key
