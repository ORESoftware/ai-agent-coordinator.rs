apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-agent-coordinator-telemetry
  namespace: ai-agent-coordinator
  labels:
    app.kubernetes.io/name: ai-agent-coordinator
    app.kubernetes.io/part-of: oresoftware-agent-platform
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: dd-cluster-secrets
  target:
    name: ai-agent-coordinator-telemetry
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: dd/remote-dev/telemetry-ticket-automation
