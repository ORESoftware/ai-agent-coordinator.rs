apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-agent-coordinator-core
  namespace: ai-agent-coordinator
  labels:
    app.kubernetes.io/name: ai-agent-coordinator
    app.kubernetes.io/part-of: oresoftware-agent-platform
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: dd-cluster-secrets
  target:
    name: ai-agent-coordinator-core
    creationPolicy: Owner
  data:
    - secretKey: COORDINATOR_API_TOKEN
      remoteRef:
        key: dd/remote-dev/ai-agent-coordinator-secrets
        property: COORDINATOR_API_TOKEN
    - secretKey: AI_AGENT_COORDINATOR_DATABASE_URL
      remoteRef:
        key: dd/remote-dev/ai-agent-coordinator-secrets
        property: AI_AGENT_COORDINATOR_DATABASE_URL
