apiVersion: batch/v1
kind: Job
metadata:
  name: ai-agent-coordinator-hypesiege-streempilot-bootstrap-20260731
  namespace: ai-agent-coordinator
  labels:
    app.kubernetes.io/name: ai-agent-coordinator
    app.kubernetes.io/component: repository-bootstrap
    app.kubernetes.io/part-of: oresoftware-agent-platform
  annotations:
    linear.app/issue: DEN-877
    repository-fleet.oresoftware.com/organizations: hypesiege,streempilot
    repository-fleet.oresoftware.com/repository-count: "32"
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-agent-coordinator
        app.kubernetes.io/component: repository-bootstrap
        app.kubernetes.io/part-of: oresoftware-agent-platform
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: publish
          image: python:3.12.12-bookworm@sha256:c0abd0758831ad99b7a29e0c1a875da9c4abb9a2e3f21e2eeb585dbcadfb6cd0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: HOME
              value: /tmp
            - name: TMPDIR
              value: /tmp
            - name: GIT_TERMINAL_PROMPT
              value: "0"
            - name: GITHUB_REPOSITORY_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ai-agent-coordinator-admin
                  key: GITHUB_REPOSITORY_ADMIN_TOKEN
          command:
            - /bin/sh
            - -ec
          args:
            - |
              set -eu
              umask 077
              test -n "${GITHUB_REPOSITORY_ADMIN_TOKEN:-}"

              cat /bootstrap/generate.py.gz.b64.part-* > /tmp/generate.py.gz.b64
              printf '%s  %s\n' \
                '65320ae8c33b3569715448714a920aba203aee968aa6a6f47500e3a6cedff669' \
                '/tmp/generate.py.gz.b64' | sha256sum -c -

              python3 - <<'PY'
              import base64
              import gzip
              import hashlib
              from pathlib import Path

              encoded = Path('/tmp/generate.py.gz.b64').read_bytes()
              source = gzip.decompress(base64.b64decode(encoded, validate=True))
              expected = '50629a57beca1ac85928cfae8fbebbca4f62a6455a7013016f92b1203dcbbd1f'
              actual = hashlib.sha256(source).hexdigest()
              if actual != expected:
                  raise SystemExit(f'generator checksum mismatch: {actual}')
              Path('/tmp/generate_hypesiege_streempilot.py').write_bytes(source)
              PY

              python3 /tmp/generate_hypesiege_streempilot.py

              python3 - <<'PY'
              import json
              from pathlib import Path

              manifest_path = Path('/mnt/data/hypesiege-streempilot-fleet/MANIFEST.json')
              manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
              if manifest.get('repository_count') != 32:
                  raise SystemExit('fleet manifest must contain exactly 32 repositories')
              if manifest.get('organizations') != {'hypesiege': 15, 'streempilot': 17}:
                  raise SystemExit('fleet organization counts do not match the approved batch')
              allowed = {'hypesiege', 'streempilot'}
              actual = {item['org'] for item in manifest['repositories']}
              if actual != allowed:
                  raise SystemExit(f'unapproved organization in manifest: {sorted(actual)}')
              if any(item.get('visibility') != 'public' for item in manifest['repositories']):
                  raise SystemExit('every repository visibility must be explicitly public')
              if any(item.get('default_branch') != 'main' for item in manifest['repositories']):
                  raise SystemExit('every repository must use main')
              PY

              python3 /mnt/data/hypesiege-streempilot-fleet/publish.py --execute

              python3 - <<'PY'
              import json
              import os
              import urllib.error
              import urllib.request
              from pathlib import Path

              token = os.environ['GITHUB_REPOSITORY_ADMIN_TOKEN']
              manifest = json.loads(
                  Path('/mnt/data/hypesiege-streempilot-fleet/MANIFEST.json').read_text(
                      encoding='utf-8'
                  )
              )

              def github(path: str) -> dict:
                  request = urllib.request.Request(
                      f'https://api.github.com{path}',
                      headers={
                          'Accept': 'application/vnd.github+json',
                          'Authorization': f'Bearer {token}',
                          'X-GitHub-Api-Version': '2022-11-28',
                          'User-Agent': 'ai-agent-coordinator-repository-bootstrap',
                      },
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          return json.loads(response.read(1_000_000))
                  except urllib.error.HTTPError as error:
                      body = error.read(4096).decode('utf-8', errors='replace')
                      raise SystemExit(
                          f'GitHub verification failed for {path}: HTTP {error.code}: {body}'
                      ) from error

              evidence = []
              for item in manifest['repositories']:
                  full_name = item['full_name']
                  repository = github(f'/repos/{full_name}')
                  reference = github(f'/repos/{full_name}/git/ref/heads/main')
                  remote_sha = reference['object']['sha']
                  if repository['full_name'].lower() != full_name.lower():
                      raise SystemExit(f'full-name mismatch for {full_name}')
                  if repository['visibility'] != item['visibility']:
                      raise SystemExit(f'visibility mismatch for {full_name}')
                  if repository['default_branch'] != 'main':
                      raise SystemExit(f'default-branch mismatch for {full_name}')
                  if remote_sha != item['commit']:
                      raise SystemExit(
                          f'main SHA mismatch for {full_name}: '
                          f"expected {item['commit']} received {remote_sha}"
                      )
                  evidence.append(
                      {
                          'full_name': repository['full_name'],
                          'repository_id': repository['id'],
                          'url': repository['html_url'],
                          'visibility': repository['visibility'],
                          'default_branch': repository['default_branch'],
                          'main_sha': remote_sha,
                      }
                  )
                  print(f"VERIFIED {repository['full_name']} main={remote_sha}")

              Path('/mnt/data/PUBLICATION-EVIDENCE.json').write_text(
                  json.dumps(
                      {
                          'schema_version': 1,
                          'repository_count': len(evidence),
                          'repositories': evidence,
                      },
                      indent=2,
                  )
                  + '\n',
                  encoding='utf-8',
              )
              print(f'PASS verified {len(evidence)} GitHub repositories')
              PY
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          volumeMounts:
            - name: generator
              mountPath: /bootstrap
              readOnly: true
            - name: work
              mountPath: /mnt/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: generator
          configMap:
            name: hypesiege-streempilot-bootstrap-generator
        - name: work
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
